services:
  oracle-postgres:
    image: postgres:16-alpine
    pull_policy: never
    environment:
      POSTGRES_USER: netbox_oracle
      POSTGRES_PASSWORD: netbox_oracle
      POSTGRES_DB: netbox_oracle
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netbox_oracle -d netbox_oracle"]
      interval: 2s
      timeout: 3s
      retries: 30

  oracle-redis:
    image: redis:7-alpine
    pull_policy: never
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  oracle:
    image: netboxcommunity/netbox:v4.4-3.4.1
    pull_policy: never
    depends_on:
      oracle-postgres:
        condition: service_healthy
      oracle-redis:
        condition: service_healthy
    environment:
      DB_HOST: oracle-postgres
      DB_NAME: netbox_oracle
      DB_USER: netbox_oracle
      DB_PASSWORD: netbox_oracle
      DB_SSLMODE: disable
      REDIS_HOST: oracle-redis
      REDIS_DATABASE: "0"
      REDIS_CACHE_DATABASE: "1"
      SECRET_KEY: compatibility-only-secret-key-with-more-than-fifty-characters
      LOGIN_REQUIRED: "True"
      ALLOW_TOKEN_RETRIEVAL: "False"
      MAINTENANCE_MODE: "False"
      ENFORCE_GLOBAL_UNIQUE: "True"
      TIME_ZONE: UTC
      CENSUS_REPORTING_ENABLED: "False"
      METRICS_ENABLED: "False"
      GRAPHQL_ENABLED: "False"
      NETBOX_CONFIGURATION: netbox.configuration_example
      PYTHONDONTWRITEBYTECODE: "1"
      SUPERUSER_NAME: oracle-admin
      SUPERUSER_EMAIL: oracle-admin@example.test
      SUPERUSER_PASSWORD: Oracle-Compatibility-Only-2026!
      SUPERUSER_API_TOKEN: 0123456789abcdef0123456789abcdef01234567
    volumes:
      # Python is an oracle-job dependency only. The deployed Go/Vue image has
      # no mount or dependency on this checkout.
      - ${NETBOX_ORACLE_SOURCE_DIR:?run.sh must export the pinned tracked-only oracle source}:/opt/netbox/netbox:ro
      - ./oracle_configuration.py:/opt/netbox/netbox/netbox/configuration_example.py:ro
    ports:
      - "127.0.0.1:${NETBOX_ORACLE_HTTP_PORT:-18080}:8080"
    healthcheck:
      test:
        ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/login/"]
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 30s

  go-postgres:
    image: postgres:16-alpine
    pull_policy: never
    environment:
      POSTGRES_USER: netbox_compat
      POSTGRES_PASSWORD: netbox_compat
      POSTGRES_DB: netbox_compat
    ports:
      - "127.0.0.1:${NETBOX_GO_POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netbox_compat -d netbox_compat"]
      interval: 2s
      timeout: 3s
      retries: 30
