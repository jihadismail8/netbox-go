syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service tenancyContactrole {
  // Create a new tenancyContactrole
  rpc Create(CreateTenancyContactroleRequest) returns (CreateTenancyContactroleReply) {
    option (google.api.http) = {
      post: "/api/tenancy/contactroles"
      body: "*"
    };
  }

  // Delete a tenancyContactrole by id
  rpc DeleteByID(DeleteTenancyContactroleByIDRequest) returns (DeleteTenancyContactroleByIDReply) {
    option (google.api.http) = {
      delete: "/api/tenancy/contactroles/{id}"
    };
  }

  // Update a tenancyContactrole by id
  rpc UpdateByID(UpdateTenancyContactroleByIDRequest) returns (UpdateTenancyContactroleByIDReply) {
    option (google.api.http) = {
      put: "/api/tenancy/contactroles/{id}"
      body: "*"
    };
  }

  // Get a tenancyContactrole by id
  rpc GetByID(GetTenancyContactroleByIDRequest) returns (GetTenancyContactroleByIDReply) {
    option (google.api.http) = {
      get: "/api/tenancy/contactroles/{id}"
    };
  }

  // Get a paginated list of tenancyContactrole by custom conditions
  rpc List(ListTenancyContactroleRequest) returns (ListTenancyContactroleReply) {
    option (google.api.http) = {
      post: "/api/tenancy/contactroles/list"
      body: "*"
    };
  }

  // Batch delete tenancyContactrole by ids
  rpc DeleteByIDs(DeleteTenancyContactroleByIDsRequest) returns (DeleteTenancyContactroleByIDsReply) {
    option (google.api.http) = {
      post: "/api/tenancy/contactroles/delete/ids"
      body: "*"
    };
  }

  // Get a tenancyContactrole by custom condition
  rpc GetByCondition(GetTenancyContactroleByConditionRequest) returns (GetTenancyContactroleByConditionReply) {
    option (google.api.http) = {
      post: "/api/tenancy/contactroles/condition"
      body: "*"
    };
  }

  // Batch get tenancyContactrole by ids
  rpc ListByIDs(ListTenancyContactroleByIDsRequest) returns (ListTenancyContactroleByIDsReply) {
    option (google.api.http) = {
      post: "/api/tenancy/contactroles/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of tenancyContactrole by last id
  rpc ListByLastID(ListTenancyContactroleByLastIDRequest) returns (ListTenancyContactroleByLastIDReply) {
    option (google.api.http) = {
      get: "/api/tenancy/contactroles"
    };
  }
}


