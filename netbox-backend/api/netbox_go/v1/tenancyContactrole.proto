message CreateTenancyContactroleRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	string name = 4; 
	string slug = 5; 
	string description = 6; 
}

message CreateTenancyContactroleReply {
  uint64 id = 1;
}

message DeleteTenancyContactroleByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteTenancyContactroleByIDReply {

}

message UpdateTenancyContactroleByIDRequest {
	uint64 id = 1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	string created = 2; 
	string lastUpdated = 3; 
	string customFieldData = 4; 
	string name = 5; 
	string slug = 6; 
	string description = 7; 
}

message UpdateTenancyContactroleByIDReply {

}

message TenancyContactrole {
	uint64 id = 1; 
	string created = 2; 
	string lastUpdated = 3; 
	string customFieldData = 4; 
	string name = 5; 
	string slug = 6; 
	string description = 7; 
}

message GetTenancyContactroleByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\"" ];
}

message GetTenancyContactroleByIDReply {
  TenancyContactrole tenancyContactrole = 1;
}

message ListTenancyContactroleRequest {
  api.types.Params params = 1;
}

message ListTenancyContactroleReply {
  int64 total = 1;
  repeated TenancyContactrole tenancyContactroles = 2;
}

message DeleteTenancyContactroleByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteTenancyContactroleByIDsReply {

}

message GetTenancyContactroleByConditionRequest {
  types.Conditions conditions = 1;
}

message GetTenancyContactroleByConditionReply {
  TenancyContactrole tenancyContactrole = 1;
}

message ListTenancyContactroleByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message ListTenancyContactroleByIDsReply {
  repeated TenancyContactrole tenancyContactroles = 1;
}

message ListTenancyContactroleByLastIDRequest {
  uint64 lastID = 1 [(tagger.tags) = "form:\"lastID\""]; // last id
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -id, the - sign indicates descending order.
}

message ListTenancyContactroleByLastIDReply {
  repeated TenancyContactrole tenancyContactroles = 1;
}


