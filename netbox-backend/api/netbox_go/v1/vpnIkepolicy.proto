message CreateVpnIkepolicyRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	string description = 4; 
	string comments = 5; 
	string name = 6; 
	int32 version = 7; 
	string mode = 8; 
	string presharedKey = 9; 
}

message CreateVpnIkepolicyReply {
  uint64 id = 1;
}

message DeleteVpnIkepolicyByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteVpnIkepolicyByIDReply {

}

message UpdateVpnIkepolicyByIDRequest {
	uint64 id = 1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	string created = 2; 
	string lastUpdated = 3; 
	string customFieldData = 4; 
	string description = 5; 
	string comments = 6; 
	string name = 7; 
	int32 version = 8; 
	string mode = 9; 
	string presharedKey = 10; 
}

message UpdateVpnIkepolicyByIDReply {

}

message VpnIkepolicy {
	uint64 id = 1; 
	string created = 2; 
	string lastUpdated = 3; 
	string customFieldData = 4; 
	string description = 5; 
	string comments = 6; 
	string name = 7; 
	int32 version = 8; 
	string mode = 9; 
	string presharedKey = 10; 
}

message GetVpnIkepolicyByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\"" ];
}

message GetVpnIkepolicyByIDReply {
  VpnIkepolicy vpnIkepolicy = 1;
}

message ListVpnIkepolicyRequest {
  api.types.Params params = 1;
}

message ListVpnIkepolicyReply {
  int64 total = 1;
  repeated VpnIkepolicy vpnIkepolicys = 2;
}

message DeleteVpnIkepolicyByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteVpnIkepolicyByIDsReply {

}

message GetVpnIkepolicyByConditionRequest {
  types.Conditions conditions = 1;
}

message GetVpnIkepolicyByConditionReply {
  VpnIkepolicy vpnIkepolicy = 1;
}

message ListVpnIkepolicyByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message ListVpnIkepolicyByIDsReply {
  repeated VpnIkepolicy vpnIkepolicys = 1;
}

message ListVpnIkepolicyByLastIDRequest {
  uint64 lastID = 1 [(tagger.tags) = "form:\"lastID\""]; // last id
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -id, the - sign indicates descending order.
}

message ListVpnIkepolicyByLastIDReply {
  repeated VpnIkepolicy vpnIkepolicys = 1;
}


