syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service vpnIkepolicy {
  // Create a new vpnIkepolicy
  rpc Create(CreateVpnIkepolicyRequest) returns (CreateVpnIkepolicyReply) {
    option (google.api.http) = {
      post: "/api/vpn/ikepolicys"
      body: "*"
    };
  }

  // Delete a vpnIkepolicy by id
  rpc DeleteByID(DeleteVpnIkepolicyByIDRequest) returns (DeleteVpnIkepolicyByIDReply) {
    option (google.api.http) = {
      delete: "/api/vpn/ikepolicys/{id}"
    };
  }

  // Update a vpnIkepolicy by id
  rpc UpdateByID(UpdateVpnIkepolicyByIDRequest) returns (UpdateVpnIkepolicyByIDReply) {
    option (google.api.http) = {
      put: "/api/vpn/ikepolicys/{id}"
      body: "*"
    };
  }

  // Get a vpnIkepolicy by id
  rpc GetByID(GetVpnIkepolicyByIDRequest) returns (GetVpnIkepolicyByIDReply) {
    option (google.api.http) = {
      get: "/api/vpn/ikepolicys/{id}"
    };
  }

  // Get a paginated list of vpnIkepolicy by custom conditions
  rpc List(ListVpnIkepolicyRequest) returns (ListVpnIkepolicyReply) {
    option (google.api.http) = {
      post: "/api/vpn/ikepolicys/list"
      body: "*"
    };
  }

  // Batch delete vpnIkepolicy by ids
  rpc DeleteByIDs(DeleteVpnIkepolicyByIDsRequest) returns (DeleteVpnIkepolicyByIDsReply) {
    option (google.api.http) = {
      post: "/api/vpn/ikepolicys/delete/ids"
      body: "*"
    };
  }

  // Get a vpnIkepolicy by custom condition
  rpc GetByCondition(GetVpnIkepolicyByConditionRequest) returns (GetVpnIkepolicyByConditionReply) {
    option (google.api.http) = {
      post: "/api/vpn/ikepolicys/condition"
      body: "*"
    };
  }

  // Batch get vpnIkepolicy by ids
  rpc ListByIDs(ListVpnIkepolicyByIDsRequest) returns (ListVpnIkepolicyByIDsReply) {
    option (google.api.http) = {
      post: "/api/vpn/ikepolicys/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of vpnIkepolicy by last id
  rpc ListByLastID(ListVpnIkepolicyByLastIDRequest) returns (ListVpnIkepolicyByLastIDReply) {
    option (google.api.http) = {
      get: "/api/vpn/ikepolicys"
    };
  }
}


