syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service dcimPlatform {
  // Create a new dcimPlatform
  rpc Create(CreateDcimPlatformRequest) returns (CreateDcimPlatformReply) {
    option (google.api.http) = {
      post: "/api/dcim/platforms"
      body: "*"
    };
  }

  // Delete a dcimPlatform by id
  rpc DeleteByID(DeleteDcimPlatformByIDRequest) returns (DeleteDcimPlatformByIDReply) {
    option (google.api.http) = {
      delete: "/api/dcim/platforms/{id}"
    };
  }

  // Update a dcimPlatform by id
  rpc UpdateByID(UpdateDcimPlatformByIDRequest) returns (UpdateDcimPlatformByIDReply) {
    option (google.api.http) = {
      put: "/api/dcim/platforms/{id}"
      body: "*"
    };
  }

  // Get a dcimPlatform by id
  rpc GetByID(GetDcimPlatformByIDRequest) returns (GetDcimPlatformByIDReply) {
    option (google.api.http) = {
      get: "/api/dcim/platforms/{id}"
    };
  }

  // Get a paginated list of dcimPlatform by custom conditions
  rpc List(ListDcimPlatformRequest) returns (ListDcimPlatformReply) {
    option (google.api.http) = {
      post: "/api/dcim/platforms/list"
      body: "*"
    };
  }

  // Batch delete dcimPlatform by ids
  rpc DeleteByIDs(DeleteDcimPlatformByIDsRequest) returns (DeleteDcimPlatformByIDsReply) {
    option (google.api.http) = {
      post: "/api/dcim/platforms/delete/ids"
      body: "*"
    };
  }

  // Get a dcimPlatform by custom condition
  rpc GetByCondition(GetDcimPlatformByConditionRequest) returns (GetDcimPlatformByConditionReply) {
    option (google.api.http) = {
      post: "/api/dcim/platforms/condition"
      body: "*"
    };
  }

  // Batch get dcimPlatform by ids
  rpc ListByIDs(ListDcimPlatformByIDsRequest) returns (ListDcimPlatformByIDsReply) {
    option (google.api.http) = {
      post: "/api/dcim/platforms/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of dcimPlatform by last id
  rpc ListByLastID(ListDcimPlatformByLastIDRequest) returns (ListDcimPlatformByLastIDReply) {
    option (google.api.http) = {
      get: "/api/dcim/platforms"
    };
  }
}


/*
Notes for defining message fields:
    1. Suggest using camel case style naming for message field names, such as firstName, lastName, etc.
    2. If the message field name ending in 'id', it is recommended to use xxxID naming format, such as userID, orderID, etc.
    3. Add validate rules https://github.com/envoyproxy/protoc-gen-validate#constraint-rules, such as:
        uint64 id = 1 [(validate.rules).uint64.gte  = 1];

If used to generate code that supports the HTTP protocol, notes for defining message fields:
    1. If the route contains the path parameter, such as /api/v1/dcimPlatform/{id}, the defined
        message must contain the name of the path parameter and the name should be added
        with a new tag, such as int64 id = 1 [(tagger.tags) = "uri:\"id\""];
    2. If the request url is followed by a query parameter, such as /api/v1/getDcimPlatform?name=Tom,
        a form tag must be added when defining the query parameter in the message, such as:
        string name = 1 [(tagger.tags) = "form:\"name\""].
    3. When the message fields use snake_case naming (e.g., order_id), the generated swagger.json file
        will use camelCase (e.g., orderId) instead of the expected snake_case. This behavior aligns with
        the JSON tag names used by gRPC, but it can cause the Gin framework to fail to correctly bind and
        retrieve parameter values. There are two ways to resolve this issue:
            (1) Explicitly specify the JSON tag name using the json_name option, such as:
                 string order_id = 1 [json_name = "order_id"];
            (2) If you want to switch to camelCase naming and update the JSON tag name accordingly, such as:
                 string order_id = 1 [json_name = "orderID", (tagger.tags) = "json:\"orderID\""];
*/


message CreateDcimPlatformRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	string name = 4; 
	string slug = 5; 
	string description = 6; 
	int64 manufacturerID = 7; 
	int64 configTemplateID = 8; 
	int64 parentID = 9; 
	int32 level = 10; 
	int32 lft = 11; 
	int32 rght = 12; 
	int32 treeID = 13; 
	string comments = 14; 
}

message CreateDcimPlatformReply {
  uint64 id = 1;
}

message DeleteDcimPlatformByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteDcimPlatformByIDReply {

}

message UpdateDcimPlatformByIDRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	uint64 id = 4 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	string name = 5; 
	string slug = 6; 
	string description = 7; 
	int64 manufacturerID = 8; 
	int64 configTemplateID = 9; 
	int64 parentID = 10; 
	int32 level = 11; 
	int32 lft = 12; 
	int32 rght = 13; 
	int32 treeID = 14; 
	string comments = 15; 
}

message UpdateDcimPlatformByIDReply {

}

message DcimPlatform {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	uint64 id = 4; 
	string name = 5; 
	string slug = 6; 
	string description = 7; 
	int64 manufacturerID = 8; 
	int64 configTemplateID = 9; 
	int64 parentID = 10; 
	int32 level = 11; 
	int32 lft = 12; 
	int32 rght = 13; 
	int32 treeID = 14; 
	string comments = 15; 
}

message GetDcimPlatformByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\"" ];
}

message GetDcimPlatformByIDReply {
  DcimPlatform dcimPlatform = 1;
}

message ListDcimPlatformRequest {
  api.types.Params params = 1;
}

message ListDcimPlatformReply {
  int64 total = 1;
  repeated DcimPlatform dcimPlatforms = 2;
}

message DeleteDcimPlatformByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteDcimPlatformByIDsReply {

}

message GetDcimPlatformByConditionRequest {
  types.Conditions conditions = 1;
}

message GetDcimPlatformByConditionReply {
  DcimPlatform dcimPlatform = 1;
}

message ListDcimPlatformByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message ListDcimPlatformByIDsReply {
  repeated DcimPlatform dcimPlatforms = 1;
}

message ListDcimPlatformByLastIDRequest {
  uint64 lastID = 1 [(tagger.tags) = "form:\"lastID\""]; // last id
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -id, the - sign indicates descending order.
}

message ListDcimPlatformByLastIDReply {
  repeated DcimPlatform dcimPlatforms = 1;
}


