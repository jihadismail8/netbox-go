  // Update a dcimInterfaceWirelessLans by id
  rpc UpdateByID(UpdateDcimInterfaceWirelessLansByIDRequest) returns (UpdateDcimInterfaceWirelessLansByIDReply) {
    option (google.api.http) = {
      put: "/api/dcim/dcimInterfaceWirelessLans/{id}"
