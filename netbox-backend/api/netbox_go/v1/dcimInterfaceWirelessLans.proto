  // Get a paginated list of dcimInterfaceWirelessLans by custom conditions
  rpc List(ListDcimInterfaceWirelessLansRequest) returns (ListDcimInterfaceWirelessLansReply) {
    option (google.api.http) = {
      post: "/api/dcim/dcimInterfaceWirelessLans/list"
      body: "*"
    };
  }

  // Batch delete dcimInterfaceWirelessLans by ids
  rpc DeleteByIDs(DeleteDcimInterfaceWirelessLansByIDsRequest) returns (DeleteDcimInterfaceWirelessLansByIDsReply) {
    option (google.api.http) = {
      post: "/api/dcim/dcimInterfaceWirelessLans/delete/ids"
      body: "*"
    };
  }

  // Get a dcimInterfaceWirelessLans by custom condition
  rpc GetByCondition(GetDcimInterfaceWirelessLansByConditionRequest) returns (GetDcimInterfaceWirelessLansByConditionReply) {
    option (google.api.http) = {
      post: "/api/dcim/dcimInterfaceWirelessLans/condition"
      body: "*"
    };
  }

  // Batch get dcimInterfaceWirelessLans by ids
  rpc ListByIDs(ListDcimInterfaceWirelessLansByIDsRequest) returns (ListDcimInterfaceWirelessLansByIDsReply) {
    option (google.api.http) = {
      post: "/api/dcim/dcimInterfaceWirelessLans/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of dcimInterfaceWirelessLans by last id
  rpc ListByLastID(ListDcimInterfaceWirelessLansByLastIDRequest) returns (ListDcimInterfaceWirelessLansByLastIDReply) {
    option (google.api.http) = {
      get: "/api/dcim/dcimInterfaceWirelessLans"
    };
  }
}


