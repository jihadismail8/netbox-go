    };
  }

  // Get a dcimInterfaceWirelessLans by id
  rpc GetByID(GetDcimInterfaceWirelessLansByIDRequest) returns (GetDcimInterfaceWirelessLansByIDReply) {
    option (google.api.http) = {
      get: "/api/dcim/dcimInterfaceWirelessLans/{id}"
    };
