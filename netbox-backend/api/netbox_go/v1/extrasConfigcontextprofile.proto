  // Batch get extrasConfigcontextprofile by ids
  rpc ListByIDs(ListExtrasConfigcontextprofileByIDsRequest) returns (ListExtrasConfigcontextprofileByIDsReply) {
    option (google.api.http) = {
      post: "/api/extras/configcontextprofiles/list/ids"
      body: "*"
    };
