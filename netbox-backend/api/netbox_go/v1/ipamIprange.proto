*/


message CreateIpamIprangeRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	string startAddress = 4; 
	string endAddress = 5; 
	int32 size = 6; 
	string status = 7; 
	string description = 8; 
	int64 roleID = 9; 
	int64 tenantID = 10; 
	int64 vrfID = 11; 
	string comments = 12; 
	bool markUtilized = 13; 
	bool markPopulated = 14; 
}

message CreateIpamIprangeReply {
  uint64 id = 1;
}

message DeleteIpamIprangeByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteIpamIprangeByIDReply {

}

message UpdateIpamIprangeByIDRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	uint64 id = 4 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	string startAddress = 5; 
	string endAddress = 6; 
	int32 size = 7; 
	string status = 8; 
	string description = 9; 
	int64 roleID = 10; 
	int64 tenantID = 11; 
	int64 vrfID = 12; 
	string comments = 13; 
	bool markUtilized = 14; 
	bool markPopulated = 15; 
}

message UpdateIpamIprangeByIDReply {

}

message IpamIprange {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	uint64 id = 4; 
	string startAddress = 5; 
	string endAddress = 6; 
	int32 size = 7; 
	string status = 8; 
	string description = 9; 
	int64 roleID = 10; 
	int64 tenantID = 11; 
	int64 vrfID = 12; 
	string comments = 13; 
	bool markUtilized = 14; 
	bool markPopulated = 15; 
}

message GetIpamIprangeByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\"" ];
}

message GetIpamIprangeByIDReply {
  IpamIprange ipamIprange = 1;
}

message ListIpamIprangeRequest {
  api.types.Params params = 1;
}

message ListIpamIprangeReply {
  int64 total = 1;
  repeated IpamIprange ipamIpranges = 2;
}

message DeleteIpamIprangeByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteIpamIprangeByIDsReply {

}

message GetIpamIprangeByConditionRequest {
  types.Conditions conditions = 1;
}

message GetIpamIprangeByConditionReply {
  IpamIprange ipamIprange = 1;
}

message ListIpamIprangeByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message ListIpamIprangeByIDsReply {
  repeated IpamIprange ipamIpranges = 1;
}

message ListIpamIprangeByLastIDRequest {
  uint64 lastID = 1 [(tagger.tags) = "form:\"lastID\""]; // last id
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -id, the - sign indicates descending order.
}

message ListIpamIprangeByLastIDReply {
  repeated IpamIprange ipamIpranges = 1;
}


