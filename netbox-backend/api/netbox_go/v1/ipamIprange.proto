syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service ipamIprange {
  // Create a new ipamIprange
  rpc Create(CreateIpamIprangeRequest) returns (CreateIpamIprangeReply) {
    option (google.api.http) = {
      post: "/api/ipam/ipranges"
      body: "*"
    };
  }

  // Delete a ipamIprange by id
  rpc DeleteByID(DeleteIpamIprangeByIDRequest) returns (DeleteIpamIprangeByIDReply) {
    option (google.api.http) = {
      delete: "/api/ipam/ipranges/{id}"
    };
  }

  // Update a ipamIprange by id
  rpc UpdateByID(UpdateIpamIprangeByIDRequest) returns (UpdateIpamIprangeByIDReply) {
    option (google.api.http) = {
      put: "/api/ipam/ipranges/{id}"
      body: "*"
    };
  }

  // Get a ipamIprange by id
  rpc GetByID(GetIpamIprangeByIDRequest) returns (GetIpamIprangeByIDReply) {
    option (google.api.http) = {
      get: "/api/ipam/ipranges/{id}"
    };
  }

  // Get a paginated list of ipamIprange by custom conditions
  rpc List(ListIpamIprangeRequest) returns (ListIpamIprangeReply) {
    option (google.api.http) = {
      post: "/api/ipam/ipranges/list"
      body: "*"
    };
  }

  // Batch delete ipamIprange by ids
  rpc DeleteByIDs(DeleteIpamIprangeByIDsRequest) returns (DeleteIpamIprangeByIDsReply) {
    option (google.api.http) = {
      post: "/api/ipam/ipranges/delete/ids"
      body: "*"
    };
  }

  // Get a ipamIprange by custom condition
  rpc GetByCondition(GetIpamIprangeByConditionRequest) returns (GetIpamIprangeByConditionReply) {
    option (google.api.http) = {
      post: "/api/ipam/ipranges/condition"
      body: "*"
    };
  }

  // Batch get ipamIprange by ids
  rpc ListByIDs(ListIpamIprangeByIDsRequest) returns (ListIpamIprangeByIDsReply) {
    option (google.api.http) = {
      post: "/api/ipam/ipranges/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of ipamIprange by last id
  rpc ListByLastID(ListIpamIprangeByLastIDRequest) returns (ListIpamIprangeByLastIDReply) {
    option (google.api.http) = {
      get: "/api/ipam/ipranges"
    };
  }
}


