  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service dcimDevicebaytemplate {
  // Create a new dcimDevicebaytemplate
  rpc Create(CreateDcimDevicebaytemplateRequest) returns (CreateDcimDevicebaytemplateReply) {
    option (google.api.http) = {
      post: "/api/dcim/devicebaytemplates"
      body: "*"
    };
  }

  // Delete a dcimDevicebaytemplate by id
  rpc DeleteByID(DeleteDcimDevicebaytemplateByIDRequest) returns (DeleteDcimDevicebaytemplateByIDReply) {
    option (google.api.http) = {
      delete: "/api/dcim/devicebaytemplates/{id}"
    };
  }

  // Update a dcimDevicebaytemplate by id
  rpc UpdateByID(UpdateDcimDevicebaytemplateByIDRequest) returns (UpdateDcimDevicebaytemplateByIDReply) {
    option (google.api.http) = {
      put: "/api/dcim/devicebaytemplates/{id}"
      body: "*"
    };
  }

  // Get a dcimDevicebaytemplate by id
  rpc GetByID(GetDcimDevicebaytemplateByIDRequest) returns (GetDcimDevicebaytemplateByIDReply) {
    option (google.api.http) = {
      get: "/api/dcim/devicebaytemplates/{id}"
    };
  }

  // Get a paginated list of dcimDevicebaytemplate by custom conditions
  rpc List(ListDcimDevicebaytemplateRequest) returns (ListDcimDevicebaytemplateReply) {
    option (google.api.http) = {
      post: "/api/dcim/devicebaytemplates/list"
      body: "*"
    };
  }

  // Batch delete dcimDevicebaytemplate by ids
  rpc DeleteByIDs(DeleteDcimDevicebaytemplateByIDsRequest) returns (DeleteDcimDevicebaytemplateByIDsReply) {
    option (google.api.http) = {
      post: "/api/dcim/devicebaytemplates/delete/ids"
      body: "*"
    };
  }

  // Get a dcimDevicebaytemplate by custom condition
  rpc GetByCondition(GetDcimDevicebaytemplateByConditionRequest) returns (GetDcimDevicebaytemplateByConditionReply) {
    option (google.api.http) = {
      post: "/api/dcim/devicebaytemplates/condition"
      body: "*"
    };
  }

  // Batch get dcimDevicebaytemplate by ids
  rpc ListByIDs(ListDcimDevicebaytemplateByIDsRequest) returns (ListDcimDevicebaytemplateByIDsReply) {
    option (google.api.http) = {
      post: "/api/dcim/devicebaytemplates/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of dcimDevicebaytemplate by last id
  rpc ListByLastID(ListDcimDevicebaytemplateByLastIDRequest) returns (ListDcimDevicebaytemplateByLastIDReply) {
    option (google.api.http) = {
      get: "/api/dcim/devicebaytemplates"
    };
  }
}


