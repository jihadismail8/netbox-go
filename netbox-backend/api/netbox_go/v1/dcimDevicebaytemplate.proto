message CreateDcimDevicebaytemplateRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string name = 3; 
	string label = 4; 
	string description = 5; 
	int64 deviceTypeID = 6; 
}

message CreateDcimDevicebaytemplateReply {
  uint64 id = 1;
}

