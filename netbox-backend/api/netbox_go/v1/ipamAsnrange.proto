syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service ipamAsnrange {
  // Create a new ipamAsnrange
  rpc Create(CreateIpamAsnrangeRequest) returns (CreateIpamAsnrangeReply) {
    option (google.api.http) = {
      post: "/api/ipam/asnranges"
      body: "*"
    };
  }

  // Delete a ipamAsnrange by id
  rpc DeleteByID(DeleteIpamAsnrangeByIDRequest) returns (DeleteIpamAsnrangeByIDReply) {
    option (google.api.http) = {
      delete: "/api/ipam/asnranges/{id}"
    };
  }

  // Update a ipamAsnrange by id
  rpc UpdateByID(UpdateIpamAsnrangeByIDRequest) returns (UpdateIpamAsnrangeByIDReply) {
    option (google.api.http) = {
      put: "/api/ipam/asnranges/{id}"
      body: "*"
    };
  }

  // Get a ipamAsnrange by id
  rpc GetByID(GetIpamAsnrangeByIDRequest) returns (GetIpamAsnrangeByIDReply) {
    option (google.api.http) = {
      get: "/api/ipam/asnranges/{id}"
    };
  }

  // Get a paginated list of ipamAsnrange by custom conditions
  rpc List(ListIpamAsnrangeRequest) returns (ListIpamAsnrangeReply) {
    option (google.api.http) = {
      post: "/api/ipam/asnranges/list"
      body: "*"
    };
  }

  // Batch delete ipamAsnrange by ids
  rpc DeleteByIDs(DeleteIpamAsnrangeByIDsRequest) returns (DeleteIpamAsnrangeByIDsReply) {
    option (google.api.http) = {
      post: "/api/ipam/asnranges/delete/ids"
      body: "*"
    };
  }

  // Get a ipamAsnrange by custom condition
  rpc GetByCondition(GetIpamAsnrangeByConditionRequest) returns (GetIpamAsnrangeByConditionReply) {
    option (google.api.http) = {
      post: "/api/ipam/asnranges/condition"
      body: "*"
    };
  }

  // Batch get ipamAsnrange by ids
  rpc ListByIDs(ListIpamAsnrangeByIDsRequest) returns (ListIpamAsnrangeByIDsReply) {
    option (google.api.http) = {
      post: "/api/ipam/asnranges/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of ipamAsnrange by last id
  rpc ListByLastID(ListIpamAsnrangeByLastIDRequest) returns (ListIpamAsnrangeByLastIDReply) {
    option (google.api.http) = {
      get: "/api/ipam/asnranges"
    };
  }
}


