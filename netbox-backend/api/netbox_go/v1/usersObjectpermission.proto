syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service usersObjectpermission {
  // Create a new usersObjectpermission
  rpc Create(CreateUsersObjectpermissionRequest) returns (CreateUsersObjectpermissionReply) {
    option (google.api.http) = {
      post: "/api/users/objectpermissions"
      body: "*"
    };
  }

  // Delete a usersObjectpermission by id
  rpc DeleteByID(DeleteUsersObjectpermissionByIDRequest) returns (DeleteUsersObjectpermissionByIDReply) {
    option (google.api.http) = {
      delete: "/api/users/objectpermissions/{id}"
    };
  }

  // Update a usersObjectpermission by id
  rpc UpdateByID(UpdateUsersObjectpermissionByIDRequest) returns (UpdateUsersObjectpermissionByIDReply) {
    option (google.api.http) = {
      put: "/api/users/objectpermissions/{id}"
      body: "*"
    };
  }

  // Get a usersObjectpermission by id
  rpc GetByID(GetUsersObjectpermissionByIDRequest) returns (GetUsersObjectpermissionByIDReply) {
    option (google.api.http) = {
      get: "/api/users/objectpermissions/{id}"
    };
  }

  // Get a paginated list of usersObjectpermission by custom conditions
  rpc List(ListUsersObjectpermissionRequest) returns (ListUsersObjectpermissionReply) {
    option (google.api.http) = {
      post: "/api/users/objectpermissions/list"
      body: "*"
    };
  }

  // Batch delete usersObjectpermission by ids
  rpc DeleteByIDs(DeleteUsersObjectpermissionByIDsRequest) returns (DeleteUsersObjectpermissionByIDsReply) {
    option (google.api.http) = {
      post: "/api/users/objectpermissions/delete/ids"
      body: "*"
    };
  }

  // Get a usersObjectpermission by custom condition
  rpc GetByCondition(GetUsersObjectpermissionByConditionRequest) returns (GetUsersObjectpermissionByConditionReply) {
    option (google.api.http) = {
      post: "/api/users/objectpermissions/condition"
      body: "*"
    };
  }

  // Batch get usersObjectpermission by ids
  rpc ListByIDs(ListUsersObjectpermissionByIDsRequest) returns (ListUsersObjectpermissionByIDsReply) {
    option (google.api.http) = {
      post: "/api/users/objectpermissions/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of usersObjectpermission by last id
  rpc ListByLastID(ListUsersObjectpermissionByLastIDRequest) returns (ListUsersObjectpermissionByLastIDReply) {
    option (google.api.http) = {
      get: "/api/users/objectpermissions"
    };
  }
}


