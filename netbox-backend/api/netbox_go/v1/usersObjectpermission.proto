message CreateUsersObjectpermissionRequest {
	string name = 1; 
	string description = 2; 
	bool enabled = 3; 
	string actions = 4; 
	string constraints = 5; 
}

message CreateUsersObjectpermissionReply {
  uint64 id = 1;
}

message DeleteUsersObjectpermissionByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteUsersObjectpermissionByIDReply {

}

message UpdateUsersObjectpermissionByIDRequest {
	uint64 id = 1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	string name = 2; 
	string description = 3; 
	bool enabled = 4; 
	string actions = 5; 
	string constraints = 6; 
}

message UpdateUsersObjectpermissionByIDReply {

}

message UsersObjectpermission {
	uint64 id = 1; 
	string name = 2; 
	string description = 3; 
	bool enabled = 4; 
	string actions = 5; 
	string constraints = 6; 
}

message GetUsersObjectpermissionByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\"" ];
}

message GetUsersObjectpermissionByIDReply {
  UsersObjectpermission usersObjectpermission = 1;
}

message ListUsersObjectpermissionRequest {
  api.types.Params params = 1;
}

message ListUsersObjectpermissionReply {
  int64 total = 1;
  repeated UsersObjectpermission usersObjectpermissions = 2;
}

message DeleteUsersObjectpermissionByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteUsersObjectpermissionByIDsReply {

}

message GetUsersObjectpermissionByConditionRequest {
  types.Conditions conditions = 1;
}

message GetUsersObjectpermissionByConditionReply {
  UsersObjectpermission usersObjectpermission = 1;
}

message ListUsersObjectpermissionByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message ListUsersObjectpermissionByIDsReply {
  repeated UsersObjectpermission usersObjectpermissions = 1;
}

message ListUsersObjectpermissionByLastIDRequest {
  uint64 lastID = 1 [(tagger.tags) = "form:\"lastID\""]; // last id
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -id, the - sign indicates descending order.
}

message ListUsersObjectpermissionByLastIDReply {
  repeated UsersObjectpermission usersObjectpermissions = 1;
}


