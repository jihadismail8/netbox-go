message CreateVirtualizationVirtualmachineRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	string localContextData = 4; 
	string name = 5; 
	string status = 6; 
	string vcpus = 7; 
	int32 memory = 8; 
	int32 disk = 9; 
	string comments = 10; 
	int64 clusterID = 11; 
	int64 platformID = 12; 
	int64 primaryIp4ID = 13; 
	int64 primaryIp6ID = 14; 
	int64 roleID = 15; 
	int64 tenantID = 16; 
	int64 siteID = 17; 
	int64 deviceID = 18; 
	string description = 19; 
	int64 interfaceCount = 20; 
	int64 configTemplateID = 21; 
	int64 virtualDiskCount = 22; 
	string serial = 23; 
}

message CreateVirtualizationVirtualmachineReply {
  uint64 id = 1;
}

