	string localContextData = 5; 
	string name = 6; 
	string status = 7; 
	string vcpus = 8; 
	int32 memory = 9; 
	int32 disk = 10; 
	string comments = 11; 
	int64 clusterID = 12; 
	int64 platformID = 13; 
	int64 primaryIp4ID = 14; 
	int64 primaryIp6ID = 15; 
	int64 roleID = 16; 
	int64 tenantID = 17; 
	int64 siteID = 18; 
	int64 deviceID = 19; 
	string description = 20; 
	int64 interfaceCount = 21; 
	int64 configTemplateID = 22; 
	int64 virtualDiskCount = 23; 
	string serial = 24; 
}

message UpdateVirtualizationVirtualmachineByIDReply {

}

message VirtualizationVirtualmachine {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	uint64 id = 4; 
	string localContextData = 5; 
	string name = 6; 
	string status = 7; 
	string vcpus = 8; 
	int32 memory = 9; 
	int32 disk = 10; 
	string comments = 11; 
	int64 clusterID = 12; 
	int64 platformID = 13; 
	int64 primaryIp4ID = 14; 
	int64 primaryIp6ID = 15; 
	int64 roleID = 16; 
	int64 tenantID = 17; 
	int64 siteID = 18; 
	int64 deviceID = 19; 
	string description = 20; 
	int64 interfaceCount = 21; 
	int64 configTemplateID = 22; 
	int64 virtualDiskCount = 23; 
	string serial = 24; 
}

message GetVirtualizationVirtualmachineByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\"" ];
}

message GetVirtualizationVirtualmachineByIDReply {
