syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service virtualizationVirtualmachine {
  // Create a new virtualizationVirtualmachine
  rpc Create(CreateVirtualizationVirtualmachineRequest) returns (CreateVirtualizationVirtualmachineReply) {
    option (google.api.http) = {
      post: "/api/virtualization/virtualmachines"
      body: "*"
    };
  }

  // Delete a virtualizationVirtualmachine by id
  rpc DeleteByID(DeleteVirtualizationVirtualmachineByIDRequest) returns (DeleteVirtualizationVirtualmachineByIDReply) {
    option (google.api.http) = {
      delete: "/api/virtualization/virtualmachines/{id}"
    };
  }

  // Update a virtualizationVirtualmachine by id
  rpc UpdateByID(UpdateVirtualizationVirtualmachineByIDRequest) returns (UpdateVirtualizationVirtualmachineByIDReply) {
    option (google.api.http) = {
      put: "/api/virtualization/virtualmachines/{id}"
      body: "*"
    };
  }

  // Get a virtualizationVirtualmachine by id
  rpc GetByID(GetVirtualizationVirtualmachineByIDRequest) returns (GetVirtualizationVirtualmachineByIDReply) {
    option (google.api.http) = {
      get: "/api/virtualization/virtualmachines/{id}"
    };
  }

  // Get a paginated list of virtualizationVirtualmachine by custom conditions
  rpc List(ListVirtualizationVirtualmachineRequest) returns (ListVirtualizationVirtualmachineReply) {
    option (google.api.http) = {
      post: "/api/virtualization/virtualmachines/list"
      body: "*"
    };
  }

  // Batch delete virtualizationVirtualmachine by ids
  rpc DeleteByIDs(DeleteVirtualizationVirtualmachineByIDsRequest) returns (DeleteVirtualizationVirtualmachineByIDsReply) {
    option (google.api.http) = {
      post: "/api/virtualization/virtualmachines/delete/ids"
      body: "*"
    };
  }

  // Get a virtualizationVirtualmachine by custom condition
  rpc GetByCondition(GetVirtualizationVirtualmachineByConditionRequest) returns (GetVirtualizationVirtualmachineByConditionReply) {
    option (google.api.http) = {
      post: "/api/virtualization/virtualmachines/condition"
      body: "*"
    };
  }

  // Batch get virtualizationVirtualmachine by ids
  rpc ListByIDs(ListVirtualizationVirtualmachineByIDsRequest) returns (ListVirtualizationVirtualmachineByIDsReply) {
    option (google.api.http) = {
      post: "/api/virtualization/virtualmachines/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of virtualizationVirtualmachine by last id
  rpc ListByLastID(ListVirtualizationVirtualmachineByLastIDRequest) returns (ListVirtualizationVirtualmachineByLastIDReply) {
    option (google.api.http) = {
      get: "/api/virtualization/virtualmachines"
    };
  }
}


