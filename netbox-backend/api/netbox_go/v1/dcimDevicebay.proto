            (2) If you want to switch to camelCase naming and update the JSON tag name accordingly, such as:
                 string order_id = 1 [json_name = "orderID", (tagger.tags) = "json:\"orderID\""];
*/


message CreateDcimDevicebayRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	string name = 4; 
	string label = 5; 
	string description = 6; 
	int64 deviceID = 7; 
	int64 installedDeviceID = 8; 
	int64 xLocationID = 9; 
	int64 xRackID = 10; 
	int64 xSiteID = 11; 
}

message CreateDcimDevicebayReply {
  uint64 id = 1;
}

message DeleteDcimDevicebayByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteDcimDevicebayByIDReply {

}

message UpdateDcimDevicebayByIDRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	uint64 id = 4 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	string name = 5; 
	string label = 6; 
	string description = 7; 
	int64 deviceID = 8; 
	int64 installedDeviceID = 9; 
	int64 xLocationID = 10; 
	int64 xRackID = 11; 
	int64 xSiteID = 12; 
}

message UpdateDcimDevicebayByIDReply {

}

message DcimDevicebay {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	uint64 id = 4; 
	string name = 5; 
	string label = 6; 
	string description = 7; 
	int64 deviceID = 8; 
	int64 installedDeviceID = 9; 
	int64 xLocationID = 10; 
	int64 xRackID = 11; 
	int64 xSiteID = 12; 
}

message GetDcimDevicebayByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\"" ];
}

message GetDcimDevicebayByIDReply {
  DcimDevicebay dcimDevicebay = 1;
}

message ListDcimDevicebayRequest {
  api.types.Params params = 1;
}

message ListDcimDevicebayReply {
  int64 total = 1;
  repeated DcimDevicebay dcimDevicebays = 2;
}

message DeleteDcimDevicebayByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteDcimDevicebayByIDsReply {

}

message GetDcimDevicebayByConditionRequest {
  types.Conditions conditions = 1;
}

message GetDcimDevicebayByConditionReply {
  DcimDevicebay dcimDevicebay = 1;
}

message ListDcimDevicebayByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message ListDcimDevicebayByIDsReply {
  repeated DcimDevicebay dcimDevicebays = 1;
}

message ListDcimDevicebayByLastIDRequest {
  uint64 lastID = 1 [(tagger.tags) = "form:\"lastID\""]; // last id
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -id, the - sign indicates descending order.
}

message ListDcimDevicebayByLastIDReply {
  repeated DcimDevicebay dcimDevicebays = 1;
}


