syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service socialAuthAssociation {
  // Create a new socialAuthAssociation
  rpc Create(CreateSocialAuthAssociationRequest) returns (CreateSocialAuthAssociationReply) {
    option (google.api.http) = {
      post: "/api/users/auth-associations"
      body: "*"
    };
  }

  // Delete a socialAuthAssociation by id
  rpc DeleteByID(DeleteSocialAuthAssociationByIDRequest) returns (DeleteSocialAuthAssociationByIDReply) {
    option (google.api.http) = {
      delete: "/api/users/auth-associations/{id}"
    };
  }

  // Update a socialAuthAssociation by id
  rpc UpdateByID(UpdateSocialAuthAssociationByIDRequest) returns (UpdateSocialAuthAssociationByIDReply) {
    option (google.api.http) = {
      put: "/api/users/auth-associations/{id}"
      body: "*"
    };
  }

  // Get a socialAuthAssociation by id
  rpc GetByID(GetSocialAuthAssociationByIDRequest) returns (GetSocialAuthAssociationByIDReply) {
    option (google.api.http) = {
      get: "/api/users/auth-associations/{id}"
    };
  }

  // Get a paginated list of socialAuthAssociation by custom conditions
  rpc List(ListSocialAuthAssociationRequest) returns (ListSocialAuthAssociationReply) {
    option (google.api.http) = {
      post: "/api/users/auth-associations/list"
      body: "*"
    };
  }

  // Batch delete socialAuthAssociation by ids
  rpc DeleteByIDs(DeleteSocialAuthAssociationByIDsRequest) returns (DeleteSocialAuthAssociationByIDsReply) {
    option (google.api.http) = {
      post: "/api/users/auth-associations/delete/ids"
      body: "*"
    };
  }

  // Get a socialAuthAssociation by custom condition
  rpc GetByCondition(GetSocialAuthAssociationByConditionRequest) returns (GetSocialAuthAssociationByConditionReply) {
    option (google.api.http) = {
      post: "/api/users/auth-associations/condition"
      body: "*"
    };
  }

  // Batch get socialAuthAssociation by ids
  rpc ListByIDs(ListSocialAuthAssociationByIDsRequest) returns (ListSocialAuthAssociationByIDsReply) {
    option (google.api.http) = {
      post: "/api/users/auth-associations/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of socialAuthAssociation by last id
  rpc ListByLastID(ListSocialAuthAssociationByLastIDRequest) returns (ListSocialAuthAssociationByLastIDReply) {
    option (google.api.http) = {
      get: "/api/users/auth-associations"
    };
  }
}


/*
Notes for defining message fields:
    1. Suggest using camel case style naming for message field names, such as firstName, lastName, etc.
    2. If the message field name ending in 'id', it is recommended to use xxxID naming format, such as userID, orderID, etc.
    3. Add validate rules https://github.com/envoyproxy/protoc-gen-validate#constraint-rules, such as:
        uint64 id = 1 [(validate.rules).uint64.gte  = 1];

If used to generate code that supports the HTTP protocol, notes for defining message fields:
    1. If the route contains the path parameter, such as /api/v1/socialAuthAssociation/{id}, the defined
        message must contain the name of the path parameter and the name should be added
        with a new tag, such as int64 id = 1 [(tagger.tags) = "uri:\"id\""];
    2. If the request url is followed by a query parameter, such as /api/v1/getSocialAuthAssociation?name=Tom,
        a form tag must be added when defining the query parameter in the message, such as:
        string name = 1 [(tagger.tags) = "form:\"name\""].
    3. When the message fields use snake_case naming (e.g., order_id), the generated swagger.json file
        will use camelCase (e.g., orderId) instead of the expected snake_case. This behavior aligns with
        the JSON tag names used by gRPC, but it can cause the Gin framework to fail to correctly bind and
        retrieve parameter values. There are two ways to resolve this issue:
            (1) Explicitly specify the JSON tag name using the json_name option, such as:
