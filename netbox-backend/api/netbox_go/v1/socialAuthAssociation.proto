            (2) If you want to switch to camelCase naming and update the JSON tag name accordingly, such as:
                 string order_id = 1 [json_name = "orderID", (tagger.tags) = "json:\"orderID\""];
*/


message CreateSocialAuthAssociationRequest {
	string serverURL = 1; 
	string handle = 2; 
	string secret = 3; 
	int32 issued = 4; 
	int32 lifetime = 5; 
	string assocType = 6; 
}

message CreateSocialAuthAssociationReply {
  uint64 id = 1;
}

message DeleteSocialAuthAssociationByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteSocialAuthAssociationByIDReply {

}

message UpdateSocialAuthAssociationByIDRequest {
	uint64 id = 1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	string serverURL = 2; 
	string handle = 3; 
	string secret = 4; 
	int32 issued = 5; 
	int32 lifetime = 6; 
	string assocType = 7; 
}

message UpdateSocialAuthAssociationByIDReply {

}

message SocialAuthAssociation {
	uint64 id = 1; 
	string serverURL = 2; 
	string handle = 3; 
	string secret = 4; 
	int32 issued = 5; 
	int32 lifetime = 6; 
	string assocType = 7; 
}

message GetSocialAuthAssociationByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\"" ];
}

message GetSocialAuthAssociationByIDReply {
  SocialAuthAssociation socialAuthAssociation = 1;
}

message ListSocialAuthAssociationRequest {
  api.types.Params params = 1;
}

message ListSocialAuthAssociationReply {
  int64 total = 1;
  repeated SocialAuthAssociation socialAuthAssociations = 2;
}

message DeleteSocialAuthAssociationByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteSocialAuthAssociationByIDsReply {

}

message GetSocialAuthAssociationByConditionRequest {
  types.Conditions conditions = 1;
}

message GetSocialAuthAssociationByConditionReply {
  SocialAuthAssociation socialAuthAssociation = 1;
}

message ListSocialAuthAssociationByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message ListSocialAuthAssociationByIDsReply {
  repeated SocialAuthAssociation socialAuthAssociations = 1;
}

message ListSocialAuthAssociationByLastIDRequest {
  uint64 lastID = 1 [(tagger.tags) = "form:\"lastID\""]; // last id
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -id, the - sign indicates descending order.
}

message ListSocialAuthAssociationByLastIDReply {
  repeated SocialAuthAssociation socialAuthAssociations = 1;
}


