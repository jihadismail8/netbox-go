syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service dcimPoweroutlettemplate {
  // Create a new dcimPoweroutlettemplate
  rpc Create(CreateDcimPoweroutlettemplateRequest) returns (CreateDcimPoweroutlettemplateReply) {
    option (google.api.http) = {
      post: "/api/dcim/poweroutlettemplates"
      body: "*"
    };
  }

  // Delete a dcimPoweroutlettemplate by id
  rpc DeleteByID(DeleteDcimPoweroutlettemplateByIDRequest) returns (DeleteDcimPoweroutlettemplateByIDReply) {
    option (google.api.http) = {
      delete: "/api/dcim/poweroutlettemplates/{id}"
    };
  }

  // Update a dcimPoweroutlettemplate by id
  rpc UpdateByID(UpdateDcimPoweroutlettemplateByIDRequest) returns (UpdateDcimPoweroutlettemplateByIDReply) {
    option (google.api.http) = {
      put: "/api/dcim/poweroutlettemplates/{id}"
      body: "*"
    };
  }

  // Get a dcimPoweroutlettemplate by id
  rpc GetByID(GetDcimPoweroutlettemplateByIDRequest) returns (GetDcimPoweroutlettemplateByIDReply) {
    option (google.api.http) = {
      get: "/api/dcim/poweroutlettemplates/{id}"
    };
  }

  // Get a paginated list of dcimPoweroutlettemplate by custom conditions
  rpc List(ListDcimPoweroutlettemplateRequest) returns (ListDcimPoweroutlettemplateReply) {
    option (google.api.http) = {
      post: "/api/dcim/poweroutlettemplates/list"
      body: "*"
    };
  }

  // Batch delete dcimPoweroutlettemplate by ids
  rpc DeleteByIDs(DeleteDcimPoweroutlettemplateByIDsRequest) returns (DeleteDcimPoweroutlettemplateByIDsReply) {
    option (google.api.http) = {
      post: "/api/dcim/poweroutlettemplates/delete/ids"
      body: "*"
    };
  }

  // Get a dcimPoweroutlettemplate by custom condition
  rpc GetByCondition(GetDcimPoweroutlettemplateByConditionRequest) returns (GetDcimPoweroutlettemplateByConditionReply) {
    option (google.api.http) = {
      post: "/api/dcim/poweroutlettemplates/condition"
      body: "*"
    };
  }

  // Batch get dcimPoweroutlettemplate by ids
  rpc ListByIDs(ListDcimPoweroutlettemplateByIDsRequest) returns (ListDcimPoweroutlettemplateByIDsReply) {
    option (google.api.http) = {
      post: "/api/dcim/poweroutlettemplates/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of dcimPoweroutlettemplate by last id
  rpc ListByLastID(ListDcimPoweroutlettemplateByLastIDRequest) returns (ListDcimPoweroutlettemplateByLastIDReply) {
    option (google.api.http) = {
      get: "/api/dcim/poweroutlettemplates"
    };
  }
}


