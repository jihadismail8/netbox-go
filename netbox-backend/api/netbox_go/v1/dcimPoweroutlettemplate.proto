*/


message CreateDcimPoweroutlettemplateRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string name = 3; 
	string label = 4; 
	string description = 5; 
	string type = 6; 
	string feedLeg = 7; 
	int64 deviceTypeID = 8; 
	int64 powerPortID = 9; 
	int64 moduleTypeID = 10; 
}

message CreateDcimPoweroutlettemplateReply {
  uint64 id = 1;
}

message DeleteDcimPoweroutlettemplateByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteDcimPoweroutlettemplateByIDReply {

}

message UpdateDcimPoweroutlettemplateByIDRequest {
	string created = 1; 
	string lastUpdated = 2; 
	uint64 id = 3 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	string name = 4; 
	string label = 5; 
	string description = 6; 
	string type = 7; 
	string feedLeg = 8; 
	int64 deviceTypeID = 9; 
	int64 powerPortID = 10; 
	int64 moduleTypeID = 11; 
}

message UpdateDcimPoweroutlettemplateByIDReply {

}

message DcimPoweroutlettemplate {
	string created = 1; 
	string lastUpdated = 2; 
	uint64 id = 3; 
	string name = 4; 
	string label = 5; 
	string description = 6; 
	string type = 7; 
	string feedLeg = 8; 
	int64 deviceTypeID = 9; 
	int64 powerPortID = 10; 
	int64 moduleTypeID = 11; 
}

message GetDcimPoweroutlettemplateByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\"" ];
}

message GetDcimPoweroutlettemplateByIDReply {
  DcimPoweroutlettemplate dcimPoweroutlettemplate = 1;
}

message ListDcimPoweroutlettemplateRequest {
  api.types.Params params = 1;
}

message ListDcimPoweroutlettemplateReply {
  int64 total = 1;
  repeated DcimPoweroutlettemplate dcimPoweroutlettemplates = 2;
}

message DeleteDcimPoweroutlettemplateByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteDcimPoweroutlettemplateByIDsReply {

}

message GetDcimPoweroutlettemplateByConditionRequest {
  types.Conditions conditions = 1;
}

message GetDcimPoweroutlettemplateByConditionReply {
  DcimPoweroutlettemplate dcimPoweroutlettemplate = 1;
}

message ListDcimPoweroutlettemplateByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message ListDcimPoweroutlettemplateByIDsReply {
  repeated DcimPoweroutlettemplate dcimPoweroutlettemplates = 1;
}

message ListDcimPoweroutlettemplateByLastIDRequest {
  uint64 lastID = 1 [(tagger.tags) = "form:\"lastID\""]; // last id
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -id, the - sign indicates descending order.
}

message ListDcimPoweroutlettemplateByLastIDReply {
  repeated DcimPoweroutlettemplate dcimPoweroutlettemplates = 1;
}


