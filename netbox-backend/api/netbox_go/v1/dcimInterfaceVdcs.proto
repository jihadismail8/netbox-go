message CreateDcimInterfaceVdcsRequest {
	int64 interfaceID = 1; 
	int64 virtualdevicecontextID = 2; 
}

message CreateDcimInterfaceVdcsReply {
  uint64 id = 1;
}

message DeleteDcimInterfaceVdcsByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteDcimInterfaceVdcsByIDReply {

}

