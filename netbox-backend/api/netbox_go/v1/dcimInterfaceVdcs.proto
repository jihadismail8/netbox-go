Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service dcimInterfaceVdcs {
  // Create a new dcimInterfaceVdcs
  rpc Create(CreateDcimInterfaceVdcsRequest) returns (CreateDcimInterfaceVdcsReply) {
    option (google.api.http) = {
      post: "/api/dcim/dcimInterfaceVdcs"
      body: "*"
    };
  }

  // Delete a dcimInterfaceVdcs by id
  rpc DeleteByID(DeleteDcimInterfaceVdcsByIDRequest) returns (DeleteDcimInterfaceVdcsByIDReply) {
    option (google.api.http) = {
      delete: "/api/dcim/dcimInterfaceVdcs/{id}"
    };
  }

  // Update a dcimInterfaceVdcs by id
  rpc UpdateByID(UpdateDcimInterfaceVdcsByIDRequest) returns (UpdateDcimInterfaceVdcsByIDReply) {
    option (google.api.http) = {
      put: "/api/dcim/dcimInterfaceVdcs/{id}"
      body: "*"
    };
  }

  // Get a dcimInterfaceVdcs by id
  rpc GetByID(GetDcimInterfaceVdcsByIDRequest) returns (GetDcimInterfaceVdcsByIDReply) {
    option (google.api.http) = {
      get: "/api/dcim/dcimInterfaceVdcs/{id}"
    };
  }

  // Get a paginated list of dcimInterfaceVdcs by custom conditions
  rpc List(ListDcimInterfaceVdcsRequest) returns (ListDcimInterfaceVdcsReply) {
    option (google.api.http) = {
      post: "/api/dcim/dcimInterfaceVdcs/list"
      body: "*"
    };
  }

  // Batch delete dcimInterfaceVdcs by ids
  rpc DeleteByIDs(DeleteDcimInterfaceVdcsByIDsRequest) returns (DeleteDcimInterfaceVdcsByIDsReply) {
    option (google.api.http) = {
      post: "/api/dcim/dcimInterfaceVdcs/delete/ids"
      body: "*"
    };
  }

  // Get a dcimInterfaceVdcs by custom condition
  rpc GetByCondition(GetDcimInterfaceVdcsByConditionRequest) returns (GetDcimInterfaceVdcsByConditionReply) {
    option (google.api.http) = {
      post: "/api/dcim/dcimInterfaceVdcs/condition"
      body: "*"
    };
  }

  // Batch get dcimInterfaceVdcs by ids
  rpc ListByIDs(ListDcimInterfaceVdcsByIDsRequest) returns (ListDcimInterfaceVdcsByIDsReply) {
    option (google.api.http) = {
      post: "/api/dcim/dcimInterfaceVdcs/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of dcimInterfaceVdcs by last id
  rpc ListByLastID(ListDcimInterfaceVdcsByLastIDRequest) returns (ListDcimInterfaceVdcsByLastIDReply) {
    option (google.api.http) = {
      get: "/api/dcim/dcimInterfaceVdcs"
    };
  }
}


