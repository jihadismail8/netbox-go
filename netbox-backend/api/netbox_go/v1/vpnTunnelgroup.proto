            (2) If you want to switch to camelCase naming and update the JSON tag name accordingly, such as:
                 string order_id = 1 [json_name = "orderID", (tagger.tags) = "json:\"orderID\""];
*/


message CreateVpnTunnelgroupRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	string name = 4; 
	string slug = 5; 
	string description = 6; 
}

message CreateVpnTunnelgroupReply {
  uint64 id = 1;
}

message DeleteVpnTunnelgroupByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteVpnTunnelgroupByIDReply {

}

message UpdateVpnTunnelgroupByIDRequest {
	uint64 id = 1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	string created = 2; 
	string lastUpdated = 3; 
	string customFieldData = 4; 
	string name = 5; 
	string slug = 6; 
	string description = 7; 
}

message UpdateVpnTunnelgroupByIDReply {

}

message VpnTunnelgroup {
	uint64 id = 1; 
	string created = 2; 
	string lastUpdated = 3; 
	string customFieldData = 4; 
	string name = 5; 
	string slug = 6; 
	string description = 7; 
}

message GetVpnTunnelgroupByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\"" ];
}

message GetVpnTunnelgroupByIDReply {
  VpnTunnelgroup vpnTunnelgroup = 1;
}

message ListVpnTunnelgroupRequest {
  api.types.Params params = 1;
}

message ListVpnTunnelgroupReply {
  int64 total = 1;
  repeated VpnTunnelgroup vpnTunnelgroups = 2;
}

message DeleteVpnTunnelgroupByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteVpnTunnelgroupByIDsReply {

}

message GetVpnTunnelgroupByConditionRequest {
  types.Conditions conditions = 1;
}

message GetVpnTunnelgroupByConditionReply {
  VpnTunnelgroup vpnTunnelgroup = 1;
}

message ListVpnTunnelgroupByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message ListVpnTunnelgroupByIDsReply {
  repeated VpnTunnelgroup vpnTunnelgroups = 1;
}

message ListVpnTunnelgroupByLastIDRequest {
  uint64 lastID = 1 [(tagger.tags) = "form:\"lastID\""]; // last id
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -id, the - sign indicates descending order.
}

message ListVpnTunnelgroupByLastIDReply {
  repeated VpnTunnelgroup vpnTunnelgroups = 1;
}


