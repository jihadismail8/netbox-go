syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service circuitsCircuit {
  // Create a new circuitsCircuit
  rpc Create(CreateCircuitsCircuitRequest) returns (CreateCircuitsCircuitReply) {
    option (google.api.http) = {
      post: "/api/circuits/circuits"
      body: "*"
    };
  }

  // Delete a circuitsCircuit by id
  rpc DeleteByID(DeleteCircuitsCircuitByIDRequest) returns (DeleteCircuitsCircuitByIDReply) {
    option (google.api.http) = {
      delete: "/api/circuits/circuits/{id}"
    };
  }

  // Update a circuitsCircuit by id
  rpc UpdateByID(UpdateCircuitsCircuitByIDRequest) returns (UpdateCircuitsCircuitByIDReply) {
    option (google.api.http) = {
      put: "/api/circuits/circuits/{id}"
      body: "*"
    };
  }

  // Get a circuitsCircuit by id
  rpc GetByID(GetCircuitsCircuitByIDRequest) returns (GetCircuitsCircuitByIDReply) {
    option (google.api.http) = {
      get: "/api/circuits/circuits/{id}"
    };
  }

  // Get a paginated list of circuitsCircuit by custom conditions
  rpc List(ListCircuitsCircuitRequest) returns (ListCircuitsCircuitReply) {
    option (google.api.http) = {
      post: "/api/circuits/circuits/list"
      body: "*"
    };
  }

  // Batch delete circuitsCircuit by ids
  rpc DeleteByIDs(DeleteCircuitsCircuitByIDsRequest) returns (DeleteCircuitsCircuitByIDsReply) {
    option (google.api.http) = {
      post: "/api/circuits/circuits/delete/ids"
      body: "*"
    };
  }

  // Get a circuitsCircuit by custom condition
  rpc GetByCondition(GetCircuitsCircuitByConditionRequest) returns (GetCircuitsCircuitByConditionReply) {
    option (google.api.http) = {
      post: "/api/circuits/circuits/condition"
      body: "*"
    };
  }

  // Batch get circuitsCircuit by ids
  rpc ListByIDs(ListCircuitsCircuitByIDsRequest) returns (ListCircuitsCircuitByIDsReply) {
    option (google.api.http) = {
      post: "/api/circuits/circuits/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of circuitsCircuit by last id
  rpc ListByLastID(ListCircuitsCircuitByLastIDRequest) returns (ListCircuitsCircuitByLastIDReply) {
    option (google.api.http) = {
      get: "/api/circuits/circuits"
    };
  }
}


/*
Notes for defining message fields:
    1. Suggest using camel case style naming for message field names, such as firstName, lastName, etc.
    2. If the message field name ending in 'id', it is recommended to use xxxID naming format, such as userID, orderID, etc.
    3. Add validate rules https://github.com/envoyproxy/protoc-gen-validate#constraint-rules, such as:
        uint64 id = 1 [(validate.rules).uint64.gte  = 1];

If used to generate code that supports the HTTP protocol, notes for defining message fields:
    1. If the route contains the path parameter, such as /api/v1/circuitsCircuit/{id}, the defined
        message must contain the name of the path parameter and the name should be added
        with a new tag, such as int64 id = 1 [(tagger.tags) = "uri:\"id\""];
    2. If the request url is followed by a query parameter, such as /api/v1/getCircuitsCircuit?name=Tom,
        a form tag must be added when defining the query parameter in the message, such as:
        string name = 1 [(tagger.tags) = "form:\"name\""].
    3. When the message fields use snake_case naming (e.g., order_id), the generated swagger.json file
        will use camelCase (e.g., orderId) instead of the expected snake_case. This behavior aligns with
        the JSON tag names used by gRPC, but it can cause the Gin framework to fail to correctly bind and
        retrieve parameter values. There are two ways to resolve this issue:
            (1) Explicitly specify the JSON tag name using the json_name option, such as:
                 string order_id = 1 [json_name = "order_id"];
            (2) If you want to switch to camelCase naming and update the JSON tag name accordingly, such as:
                 string order_id = 1 [json_name = "orderID", (tagger.tags) = "json:\"orderID\""];
*/


message CreateCircuitsCircuitRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	string cid = 4; 
	string status = 5; 
	string installDate = 6; 
	int32 commitRate = 7; 
	string description = 8; 
	string comments = 9; 
	int64 providerID = 10; 
	int64 tenantID = 11; 
	int64 terminationAID = 12; 
	int64 terminationZID = 13; 
	int64 typeID = 14; 
	string terminationDate = 15; 
	int64 providerAccountID = 16; 
	string xAbsDistance = 17; 
	string distance = 18; 
	string distanceUnit = 19; 
}

message CreateCircuitsCircuitReply {
  uint64 id = 1;
}

message DeleteCircuitsCircuitByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteCircuitsCircuitByIDReply {

}

message UpdateCircuitsCircuitByIDRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	uint64 id = 4 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	string cid = 5; 
	string status = 6; 
	string installDate = 7; 
	int32 commitRate = 8; 
	string description = 9; 
	string comments = 10; 
	int64 providerID = 11; 
	int64 tenantID = 12; 
	int64 terminationAID = 13; 
	int64 terminationZID = 14; 
	int64 typeID = 15; 
	string terminationDate = 16; 
	int64 providerAccountID = 17; 
	string xAbsDistance = 18; 
	string distance = 19; 
	string distanceUnit = 20; 
}

message UpdateCircuitsCircuitByIDReply {

}

message CircuitsCircuit {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	uint64 id = 4; 
	string cid = 5; 
	string status = 6; 
	string installDate = 7; 
	int32 commitRate = 8; 
	string description = 9; 
	string comments = 10; 
	int64 providerID = 11; 
	int64 tenantID = 12; 
	int64 terminationAID = 13; 
	int64 terminationZID = 14; 
	int64 typeID = 15; 
	string terminationDate = 16; 
	int64 providerAccountID = 17; 
	string xAbsDistance = 18; 
	string distance = 19; 
	string distanceUnit = 20; 
}

message GetCircuitsCircuitByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\"" ];
}

message GetCircuitsCircuitByIDReply {
  CircuitsCircuit circuitsCircuit = 1;
}

message ListCircuitsCircuitRequest {
  api.types.Params params = 1;
}

message ListCircuitsCircuitReply {
  int64 total = 1;
  repeated CircuitsCircuit circuitsCircuits = 2;
}

message DeleteCircuitsCircuitByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteCircuitsCircuitByIDsReply {

}

message GetCircuitsCircuitByConditionRequest {
  types.Conditions conditions = 1;
}

message GetCircuitsCircuitByConditionReply {
  CircuitsCircuit circuitsCircuit = 1;
}

message ListCircuitsCircuitByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message ListCircuitsCircuitByIDsReply {
  repeated CircuitsCircuit circuitsCircuits = 1;
}

message ListCircuitsCircuitByLastIDRequest {
  uint64 lastID = 1 [(tagger.tags) = "form:\"lastID\""]; // last id
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -id, the - sign indicates descending order.
}

message ListCircuitsCircuitByLastIDReply {
  repeated CircuitsCircuit circuitsCircuits = 1;
}


