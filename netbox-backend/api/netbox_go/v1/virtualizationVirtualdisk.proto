*/


message CreateVirtualizationVirtualdiskRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	string name = 4; 
	string description = 5; 
	int32 size = 6; 
	int64 virtualMachineID = 7; 
}

message CreateVirtualizationVirtualdiskReply {
  uint64 id = 1;
}

message DeleteVirtualizationVirtualdiskByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteVirtualizationVirtualdiskByIDReply {

}

message UpdateVirtualizationVirtualdiskByIDRequest {
	uint64 id = 1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	string created = 2; 
	string lastUpdated = 3; 
	string customFieldData = 4; 
	string name = 5; 
	string description = 6; 
	int32 size = 7; 
	int64 virtualMachineID = 8; 
}

message UpdateVirtualizationVirtualdiskByIDReply {

}

message VirtualizationVirtualdisk {
	uint64 id = 1; 
	string created = 2; 
	string lastUpdated = 3; 
	string customFieldData = 4; 
	string name = 5; 
	string description = 6; 
	int32 size = 7; 
	int64 virtualMachineID = 8; 
}

message GetVirtualizationVirtualdiskByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\"" ];
}

message GetVirtualizationVirtualdiskByIDReply {
  VirtualizationVirtualdisk virtualizationVirtualdisk = 1;
}

message ListVirtualizationVirtualdiskRequest {
  api.types.Params params = 1;
}

message ListVirtualizationVirtualdiskReply {
  int64 total = 1;
  repeated VirtualizationVirtualdisk virtualizationVirtualdisks = 2;
}

message DeleteVirtualizationVirtualdiskByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteVirtualizationVirtualdiskByIDsReply {

}

message GetVirtualizationVirtualdiskByConditionRequest {
  types.Conditions conditions = 1;
}

message GetVirtualizationVirtualdiskByConditionReply {
  VirtualizationVirtualdisk virtualizationVirtualdisk = 1;
}

message ListVirtualizationVirtualdiskByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message ListVirtualizationVirtualdiskByIDsReply {
  repeated VirtualizationVirtualdisk virtualizationVirtualdisks = 1;
}

message ListVirtualizationVirtualdiskByLastIDRequest {
  uint64 lastID = 1 [(tagger.tags) = "form:\"lastID\""]; // last id
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -id, the - sign indicates descending order.
}

message ListVirtualizationVirtualdiskByLastIDReply {
  repeated VirtualizationVirtualdisk virtualizationVirtualdisks = 1;
}


