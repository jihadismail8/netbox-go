syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service virtualizationVirtualdisk {
  // Create a new virtualizationVirtualdisk
  rpc Create(CreateVirtualizationVirtualdiskRequest) returns (CreateVirtualizationVirtualdiskReply) {
    option (google.api.http) = {
      post: "/api/virtualization/virtualdisks"
      body: "*"
    };
  }

  // Delete a virtualizationVirtualdisk by id
  rpc DeleteByID(DeleteVirtualizationVirtualdiskByIDRequest) returns (DeleteVirtualizationVirtualdiskByIDReply) {
    option (google.api.http) = {
      delete: "/api/virtualization/virtualdisks/{id}"
    };
  }

  // Update a virtualizationVirtualdisk by id
  rpc UpdateByID(UpdateVirtualizationVirtualdiskByIDRequest) returns (UpdateVirtualizationVirtualdiskByIDReply) {
    option (google.api.http) = {
      put: "/api/virtualization/virtualdisks/{id}"
      body: "*"
    };
  }

  // Get a virtualizationVirtualdisk by id
  rpc GetByID(GetVirtualizationVirtualdiskByIDRequest) returns (GetVirtualizationVirtualdiskByIDReply) {
    option (google.api.http) = {
      get: "/api/virtualization/virtualdisks/{id}"
    };
  }

  // Get a paginated list of virtualizationVirtualdisk by custom conditions
  rpc List(ListVirtualizationVirtualdiskRequest) returns (ListVirtualizationVirtualdiskReply) {
    option (google.api.http) = {
      post: "/api/virtualization/virtualdisks/list"
      body: "*"
    };
  }

  // Batch delete virtualizationVirtualdisk by ids
  rpc DeleteByIDs(DeleteVirtualizationVirtualdiskByIDsRequest) returns (DeleteVirtualizationVirtualdiskByIDsReply) {
    option (google.api.http) = {
      post: "/api/virtualization/virtualdisks/delete/ids"
      body: "*"
    };
  }

  // Get a virtualizationVirtualdisk by custom condition
  rpc GetByCondition(GetVirtualizationVirtualdiskByConditionRequest) returns (GetVirtualizationVirtualdiskByConditionReply) {
    option (google.api.http) = {
      post: "/api/virtualization/virtualdisks/condition"
      body: "*"
    };
  }

  // Batch get virtualizationVirtualdisk by ids
  rpc ListByIDs(ListVirtualizationVirtualdiskByIDsRequest) returns (ListVirtualizationVirtualdiskByIDsReply) {
    option (google.api.http) = {
      post: "/api/virtualization/virtualdisks/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of virtualizationVirtualdisk by last id
  rpc ListByLastID(ListVirtualizationVirtualdiskByLastIDRequest) returns (ListVirtualizationVirtualdiskByLastIDReply) {
    option (google.api.http) = {
      get: "/api/virtualization/virtualdisks"
    };
  }
}


