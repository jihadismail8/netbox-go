syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service authGroupPermissions {
  // Create a new authGroupPermissions
  rpc Create(CreateAuthGroupPermissionsRequest) returns (CreateAuthGroupPermissionsReply) {
    option (google.api.http) = {
      post: "/api/users/authGroupPermissions"
      body: "*"
    };
  }

  // Delete a authGroupPermissions by id
  rpc DeleteByID(DeleteAuthGroupPermissionsByIDRequest) returns (DeleteAuthGroupPermissionsByIDReply) {
    option (google.api.http) = {
      delete: "/api/users/authGroupPermissions/{id}"
    };
  }

  // Update a authGroupPermissions by id
  rpc UpdateByID(UpdateAuthGroupPermissionsByIDRequest) returns (UpdateAuthGroupPermissionsByIDReply) {
    option (google.api.http) = {
      put: "/api/users/authGroupPermissions/{id}"
      body: "*"
    };
  }

  // Get a authGroupPermissions by id
  rpc GetByID(GetAuthGroupPermissionsByIDRequest) returns (GetAuthGroupPermissionsByIDReply) {
    option (google.api.http) = {
      get: "/api/users/authGroupPermissions/{id}"
    };
  }

  // Get a paginated list of authGroupPermissions by custom conditions
  rpc List(ListAuthGroupPermissionsRequest) returns (ListAuthGroupPermissionsReply) {
    option (google.api.http) = {
      post: "/api/users/authGroupPermissions/list"
      body: "*"
    };
  }

  // Batch delete authGroupPermissions by ids
  rpc DeleteByIDs(DeleteAuthGroupPermissionsByIDsRequest) returns (DeleteAuthGroupPermissionsByIDsReply) {
    option (google.api.http) = {
      post: "/api/users/authGroupPermissions/delete/ids"
      body: "*"
    };
  }

  // Get a authGroupPermissions by custom condition
  rpc GetByCondition(GetAuthGroupPermissionsByConditionRequest) returns (GetAuthGroupPermissionsByConditionReply) {
    option (google.api.http) = {
      post: "/api/users/authGroupPermissions/condition"
      body: "*"
    };
  }

  // Batch get authGroupPermissions by ids
  rpc ListByIDs(ListAuthGroupPermissionsByIDsRequest) returns (ListAuthGroupPermissionsByIDsReply) {
    option (google.api.http) = {
      post: "/api/users/authGroupPermissions/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of authGroupPermissions by last id
  rpc ListByLastID(ListAuthGroupPermissionsByLastIDRequest) returns (ListAuthGroupPermissionsByLastIDReply) {
    option (google.api.http) = {
      get: "/api/users/authGroupPermissions"
    };
  }
}


