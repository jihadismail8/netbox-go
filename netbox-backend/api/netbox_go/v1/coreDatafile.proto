syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service coreDatafile {
  // Create a new coreDatafile
  rpc Create(CreateCoreDatafileRequest) returns (CreateCoreDatafileReply) {
    option (google.api.http) = {
      post: "/api/core/datafiles"
      body: "*"
    };
  }

  // Delete a coreDatafile by id
  rpc DeleteByID(DeleteCoreDatafileByIDRequest) returns (DeleteCoreDatafileByIDReply) {
    option (google.api.http) = {
      delete: "/api/core/datafiles/{id}"
    };
  }

  // Update a coreDatafile by id
  rpc UpdateByID(UpdateCoreDatafileByIDRequest) returns (UpdateCoreDatafileByIDReply) {
    option (google.api.http) = {
      put: "/api/core/datafiles/{id}"
      body: "*"
    };
  }

  // Get a coreDatafile by id
  rpc GetByID(GetCoreDatafileByIDRequest) returns (GetCoreDatafileByIDReply) {
    option (google.api.http) = {
      get: "/api/core/datafiles/{id}"
    };
  }

  // Get a paginated list of coreDatafile by custom conditions
  rpc List(ListCoreDatafileRequest) returns (ListCoreDatafileReply) {
    option (google.api.http) = {
      post: "/api/core/datafiles/list"
      body: "*"
    };
  }

  // Batch delete coreDatafile by ids
  rpc DeleteByIDs(DeleteCoreDatafileByIDsRequest) returns (DeleteCoreDatafileByIDsReply) {
    option (google.api.http) = {
      post: "/api/core/datafiles/delete/ids"
      body: "*"
    };
  }

  // Get a coreDatafile by custom condition
  rpc GetByCondition(GetCoreDatafileByConditionRequest) returns (GetCoreDatafileByConditionReply) {
    option (google.api.http) = {
      post: "/api/core/datafiles/condition"
      body: "*"
    };
  }

  // Batch get coreDatafile by ids
  rpc ListByIDs(ListCoreDatafileByIDsRequest) returns (ListCoreDatafileByIDsReply) {
    option (google.api.http) = {
      post: "/api/core/datafiles/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of coreDatafile by last id
  rpc ListByLastID(ListCoreDatafileByLastIDRequest) returns (ListCoreDatafileByLastIDReply) {
    option (google.api.http) = {
      get: "/api/core/datafiles"
    };
  }
}


/*
Notes for defining message fields:
    1. Suggest using camel case style naming for message field names, such as firstName, lastName, etc.
    2. If the message field name ending in 'id', it is recommended to use xxxID naming format, such as userID, orderID, etc.
    3. Add validate rules https://github.com/envoyproxy/protoc-gen-validate#constraint-rules, such as:
        uint64 id = 1 [(validate.rules).uint64.gte  = 1];

If used to generate code that supports the HTTP protocol, notes for defining message fields:
    1. If the route contains the path parameter, such as /api/v1/coreDatafile/{id}, the defined
        message must contain the name of the path parameter and the name should be added
        with a new tag, such as int64 id = 1 [(tagger.tags) = "uri:\"id\""];
    2. If the request url is followed by a query parameter, such as /api/v1/getCoreDatafile?name=Tom,
        a form tag must be added when defining the query parameter in the message, such as:
        string name = 1 [(tagger.tags) = "form:\"name\""].
    3. When the message fields use snake_case naming (e.g., order_id), the generated swagger.json file
        will use camelCase (e.g., orderId) instead of the expected snake_case. This behavior aligns with
        the JSON tag names used by gRPC, but it can cause the Gin framework to fail to correctly bind and
        retrieve parameter values. There are two ways to resolve this issue:
            (1) Explicitly specify the JSON tag name using the json_name option, such as:
                 string order_id = 1 [json_name = "order_id"];
            (2) If you want to switch to camelCase naming and update the JSON tag name accordingly, such as:
                 string order_id = 1 [json_name = "orderID", (tagger.tags) = "json:\"orderID\""];
*/


message CreateCoreDatafileRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string path = 3; 
	int32 size = 4; 
	string hash = 5; 
	string data = 6; 
	int64 sourceID = 7; 
}

message CreateCoreDatafileReply {
  uint64 id = 1;
}

message DeleteCoreDatafileByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteCoreDatafileByIDReply {

}

message UpdateCoreDatafileByIDRequest {
	uint64 id = 1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	string created = 2; 
	string lastUpdated = 3; 
	string path = 4; 
	int32 size = 5; 
	string hash = 6; 
	string data = 7; 
	int64 sourceID = 8; 
}

message UpdateCoreDatafileByIDReply {

}

message CoreDatafile {
	uint64 id = 1; 
	string created = 2; 
	string lastUpdated = 3; 
	string path = 4; 
	int32 size = 5; 
	string hash = 6; 
	string data = 7; 
	int64 sourceID = 8; 
}

message GetCoreDatafileByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\"" ];
}

message GetCoreDatafileByIDReply {
  CoreDatafile coreDatafile = 1;
}

message ListCoreDatafileRequest {
  api.types.Params params = 1;
}

message ListCoreDatafileReply {
  int64 total = 1;
  repeated CoreDatafile coreDatafiles = 2;
}

message DeleteCoreDatafileByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteCoreDatafileByIDsReply {

}

message GetCoreDatafileByConditionRequest {
  types.Conditions conditions = 1;
}

message GetCoreDatafileByConditionReply {
  CoreDatafile coreDatafile = 1;
}

message ListCoreDatafileByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message ListCoreDatafileByIDsReply {
  repeated CoreDatafile coreDatafiles = 1;
}

message ListCoreDatafileByLastIDRequest {
  uint64 lastID = 1 [(tagger.tags) = "form:\"lastID\""]; // last id
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -id, the - sign indicates descending order.
}

message ListCoreDatafileByLastIDReply {
  repeated CoreDatafile coreDatafiles = 1;
}


