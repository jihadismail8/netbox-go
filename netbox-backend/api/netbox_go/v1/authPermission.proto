syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service authPermission {
  // Create a new authPermission
  rpc Create(CreateAuthPermissionRequest) returns (CreateAuthPermissionReply) {
    option (google.api.http) = {
      post: "/api/users/permissions"
      body: "*"
    };
  }

  // Delete a authPermission by id
  rpc DeleteByID(DeleteAuthPermissionByIDRequest) returns (DeleteAuthPermissionByIDReply) {
    option (google.api.http) = {
      delete: "/api/users/permissions/{id}"
    };
  }

  // Update a authPermission by id
  rpc UpdateByID(UpdateAuthPermissionByIDRequest) returns (UpdateAuthPermissionByIDReply) {
    option (google.api.http) = {
      put: "/api/users/permissions/{id}"
      body: "*"
    };
  }

  // Get a authPermission by id
  rpc GetByID(GetAuthPermissionByIDRequest) returns (GetAuthPermissionByIDReply) {
    option (google.api.http) = {
      get: "/api/users/permissions/{id}"
    };
  }

  // Get a paginated list of authPermission by custom conditions
  rpc List(ListAuthPermissionRequest) returns (ListAuthPermissionReply) {
    option (google.api.http) = {
      post: "/api/users/permissions/list"
      body: "*"
    };
  }

  // Batch delete authPermission by ids
  rpc DeleteByIDs(DeleteAuthPermissionByIDsRequest) returns (DeleteAuthPermissionByIDsReply) {
    option (google.api.http) = {
      post: "/api/users/permissions/delete/ids"
      body: "*"
    };
  }

  // Get a authPermission by custom condition
  rpc GetByCondition(GetAuthPermissionByConditionRequest) returns (GetAuthPermissionByConditionReply) {
    option (google.api.http) = {
      post: "/api/users/permissions/condition"
      body: "*"
    };
  }

  // Batch get authPermission by ids
  rpc ListByIDs(ListAuthPermissionByIDsRequest) returns (ListAuthPermissionByIDsReply) {
    option (google.api.http) = {
      post: "/api/users/permissions/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of authPermission by last id
  rpc ListByLastID(ListAuthPermissionByLastIDRequest) returns (ListAuthPermissionByLastIDReply) {
    option (google.api.http) = {
      get: "/api/users/permissions"
    };
  }
}


/*
Notes for defining message fields:
    1. Suggest using camel case style naming for message field names, such as firstName, lastName, etc.
    2. If the message field name ending in 'id', it is recommended to use xxxID naming format, such as userID, orderID, etc.
    3. Add validate rules https://github.com/envoyproxy/protoc-gen-validate#constraint-rules, such as:
        uint64 id = 1 [(validate.rules).uint64.gte  = 1];

If used to generate code that supports the HTTP protocol, notes for defining message fields:
    1. If the route contains the path parameter, such as /api/v1/authPermission/{id}, the defined
        message must contain the name of the path parameter and the name should be added
        with a new tag, such as int64 id = 1 [(tagger.tags) = "uri:\"id\""];
    2. If the request url is followed by a query parameter, such as /api/v1/getAuthPermission?name=Tom,
        a form tag must be added when defining the query parameter in the message, such as:
        string name = 1 [(tagger.tags) = "form:\"name\""].
    3. When the message fields use snake_case naming (e.g., order_id), the generated swagger.json file
        will use camelCase (e.g., orderId) instead of the expected snake_case. This behavior aligns with
        the JSON tag names used by gRPC, but it can cause the Gin framework to fail to correctly bind and
        retrieve parameter values. There are two ways to resolve this issue:
            (1) Explicitly specify the JSON tag name using the json_name option, such as:
                 string order_id = 1 [json_name = "order_id"];
            (2) If you want to switch to camelCase naming and update the JSON tag name accordingly, such as:
                 string order_id = 1 [json_name = "orderID", (tagger.tags) = "json:\"orderID\""];
*/


message CreateAuthPermissionRequest {
	string name = 1; 
	int32 contentTypeID = 2; 
	string codename = 3; 
}

message CreateAuthPermissionReply {
  uint64 id = 1;
}

message DeleteAuthPermissionByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteAuthPermissionByIDReply {

}

message UpdateAuthPermissionByIDRequest {
	uint64 id = 1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	string name = 2; 
	int32 contentTypeID = 3; 
	string codename = 4; 
}

message UpdateAuthPermissionByIDReply {

}

message AuthPermission {
	uint64 id = 1; 
	string name = 2; 
	int32 contentTypeID = 3; 
	string codename = 4; 
}

message GetAuthPermissionByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\"" ];
}

message GetAuthPermissionByIDReply {
  AuthPermission authPermission = 1;
}

message ListAuthPermissionRequest {
  api.types.Params params = 1;
}

message ListAuthPermissionReply {
  int64 total = 1;
  repeated AuthPermission authPermissions = 2;
}

message DeleteAuthPermissionByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteAuthPermissionByIDsReply {

}

message GetAuthPermissionByConditionRequest {
  types.Conditions conditions = 1;
}

message GetAuthPermissionByConditionReply {
  AuthPermission authPermission = 1;
}

message ListAuthPermissionByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message ListAuthPermissionByIDsReply {
  repeated AuthPermission authPermissions = 1;
}

message ListAuthPermissionByLastIDRequest {
  uint64 lastID = 1 [(tagger.tags) = "form:\"lastID\""]; // last id
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -id, the - sign indicates descending order.
}

message ListAuthPermissionByLastIDReply {
  repeated AuthPermission authPermissions = 1;
}


