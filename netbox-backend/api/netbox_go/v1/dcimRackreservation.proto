syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service dcimRackreservation {
  // Create a new dcimRackreservation
  rpc Create(CreateDcimRackreservationRequest) returns (CreateDcimRackreservationReply) {
    option (google.api.http) = {
      post: "/api/dcim/rackreservations"
      body: "*"
    };
  }

  // Delete a dcimRackreservation by id
  rpc DeleteByID(DeleteDcimRackreservationByIDRequest) returns (DeleteDcimRackreservationByIDReply) {
    option (google.api.http) = {
      delete: "/api/dcim/rackreservations/{id}"
    };
  }

  // Update a dcimRackreservation by id
  rpc UpdateByID(UpdateDcimRackreservationByIDRequest) returns (UpdateDcimRackreservationByIDReply) {
    option (google.api.http) = {
      put: "/api/dcim/rackreservations/{id}"
      body: "*"
    };
  }

  // Get a dcimRackreservation by id
  rpc GetByID(GetDcimRackreservationByIDRequest) returns (GetDcimRackreservationByIDReply) {
    option (google.api.http) = {
      get: "/api/dcim/rackreservations/{id}"
    };
  }

  // Get a paginated list of dcimRackreservation by custom conditions
  rpc List(ListDcimRackreservationRequest) returns (ListDcimRackreservationReply) {
    option (google.api.http) = {
      post: "/api/dcim/rackreservations/list"
      body: "*"
    };
  }

  // Batch delete dcimRackreservation by ids
  rpc DeleteByIDs(DeleteDcimRackreservationByIDsRequest) returns (DeleteDcimRackreservationByIDsReply) {
    option (google.api.http) = {
      post: "/api/dcim/rackreservations/delete/ids"
      body: "*"
    };
  }

  // Get a dcimRackreservation by custom condition
  rpc GetByCondition(GetDcimRackreservationByConditionRequest) returns (GetDcimRackreservationByConditionReply) {
    option (google.api.http) = {
      post: "/api/dcim/rackreservations/condition"
      body: "*"
    };
  }

  // Batch get dcimRackreservation by ids
  rpc ListByIDs(ListDcimRackreservationByIDsRequest) returns (ListDcimRackreservationByIDsReply) {
    option (google.api.http) = {
      post: "/api/dcim/rackreservations/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of dcimRackreservation by last id
  rpc ListByLastID(ListDcimRackreservationByLastIDRequest) returns (ListDcimRackreservationByLastIDReply) {
    option (google.api.http) = {
      get: "/api/dcim/rackreservations"
    };
  }
}


