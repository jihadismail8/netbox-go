message CreateDcimRackreservationRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	string units = 4; 
	string description = 5; 
	int64 rackID = 6; 
	int64 tenantID = 7; 
	int64 userID = 8; 
	string comments = 9; 
	string status = 10; 
}

message CreateDcimRackreservationReply {
  uint64 id = 1;
}

message DeleteDcimRackreservationByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteDcimRackreservationByIDReply {

}

message UpdateDcimRackreservationByIDRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	uint64 id = 4 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	string units = 5; 
	string description = 6; 
	int64 rackID = 7; 
	int64 tenantID = 8; 
	int64 userID = 9; 
	string comments = 10; 
	string status = 11; 
}

message UpdateDcimRackreservationByIDReply {

}

message DcimRackreservation {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	uint64 id = 4; 
	string units = 5; 
	string description = 6; 
	int64 rackID = 7; 
	int64 tenantID = 8; 
	int64 userID = 9; 
	string comments = 10; 
	string status = 11; 
}

message GetDcimRackreservationByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\"" ];
}

message GetDcimRackreservationByIDReply {
  DcimRackreservation dcimRackreservation = 1;
}

message ListDcimRackreservationRequest {
  api.types.Params params = 1;
}

message ListDcimRackreservationReply {
  int64 total = 1;
  repeated DcimRackreservation dcimRackreservations = 2;
}

message DeleteDcimRackreservationByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteDcimRackreservationByIDsReply {

}

message GetDcimRackreservationByConditionRequest {
  types.Conditions conditions = 1;
}

message GetDcimRackreservationByConditionReply {
  DcimRackreservation dcimRackreservation = 1;
}

message ListDcimRackreservationByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message ListDcimRackreservationByIDsReply {
  repeated DcimRackreservation dcimRackreservations = 1;
}

message ListDcimRackreservationByLastIDRequest {
  uint64 lastID = 1 [(tagger.tags) = "form:\"lastID\""]; // last id
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -id, the - sign indicates descending order.
}

message ListDcimRackreservationByLastIDReply {
  repeated DcimRackreservation dcimRackreservations = 1;
}


