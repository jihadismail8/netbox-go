            (2) If you want to switch to camelCase naming and update the JSON tag name accordingly, such as:
                 string order_id = 1 [json_name = "orderID", (tagger.tags) = "json:\"orderID\""];
*/


message CreateDcimCablepathRequest {
	string xNodes = 1; 
	bool isActive = 2; 
	bool isSplit = 3; 
	string path = 4; 
	bool isComplete = 5; 
}

message CreateDcimCablepathReply {
  uint64 id = 1;
}

message DeleteDcimCablepathByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteDcimCablepathByIDReply {

}

message UpdateDcimCablepathByIDRequest {
	uint64 id = 1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	string xNodes = 2; 
	bool isActive = 3; 
	bool isSplit = 4; 
	string path = 5; 
	bool isComplete = 6; 
}

message UpdateDcimCablepathByIDReply {

}

message DcimCablepath {
	uint64 id = 1; 
	string xNodes = 2; 
	bool isActive = 3; 
	bool isSplit = 4; 
	string path = 5; 
	bool isComplete = 6; 
}

message GetDcimCablepathByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\"" ];
}

message GetDcimCablepathByIDReply {
  DcimCablepath dcimCablepath = 1;
}

message ListDcimCablepathRequest {
  api.types.Params params = 1;
}

message ListDcimCablepathReply {
  int64 total = 1;
  repeated DcimCablepath dcimCablepaths = 2;
}

message DeleteDcimCablepathByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteDcimCablepathByIDsReply {

}

message GetDcimCablepathByConditionRequest {
  types.Conditions conditions = 1;
}

message GetDcimCablepathByConditionReply {
  DcimCablepath dcimCablepath = 1;
}

message ListDcimCablepathByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message ListDcimCablepathByIDsReply {
  repeated DcimCablepath dcimCablepaths = 1;
}

message ListDcimCablepathByLastIDRequest {
  uint64 lastID = 1 [(tagger.tags) = "form:\"lastID\""]; // last id
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -id, the - sign indicates descending order.
}

message ListDcimCablepathByLastIDReply {
  repeated DcimCablepath dcimCablepaths = 1;
}


