syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service circuitsProvidernetwork {
  // Create a new circuitsProvidernetwork
  rpc Create(CreateCircuitsProvidernetworkRequest) returns (CreateCircuitsProvidernetworkReply) {
    option (google.api.http) = {
      post: "/api/circuits/providernetworks"
      body: "*"
    };
  }

  // Delete a circuitsProvidernetwork by id
  rpc DeleteByID(DeleteCircuitsProvidernetworkByIDRequest) returns (DeleteCircuitsProvidernetworkByIDReply) {
    option (google.api.http) = {
      delete: "/api/circuits/providernetworks/{id}"
    };
  }

  // Update a circuitsProvidernetwork by id
  rpc UpdateByID(UpdateCircuitsProvidernetworkByIDRequest) returns (UpdateCircuitsProvidernetworkByIDReply) {
    option (google.api.http) = {
      put: "/api/circuits/providernetworks/{id}"
      body: "*"
    };
  }

  // Get a circuitsProvidernetwork by id
  rpc GetByID(GetCircuitsProvidernetworkByIDRequest) returns (GetCircuitsProvidernetworkByIDReply) {
    option (google.api.http) = {
      get: "/api/circuits/providernetworks/{id}"
    };
  }

  // Get a paginated list of circuitsProvidernetwork by custom conditions
  rpc List(ListCircuitsProvidernetworkRequest) returns (ListCircuitsProvidernetworkReply) {
    option (google.api.http) = {
      post: "/api/circuits/providernetworks/list"
      body: "*"
    };
  }

  // Batch delete circuitsProvidernetwork by ids
  rpc DeleteByIDs(DeleteCircuitsProvidernetworkByIDsRequest) returns (DeleteCircuitsProvidernetworkByIDsReply) {
    option (google.api.http) = {
      post: "/api/circuits/providernetworks/delete/ids"
      body: "*"
    };
  }

  // Get a circuitsProvidernetwork by custom condition
  rpc GetByCondition(GetCircuitsProvidernetworkByConditionRequest) returns (GetCircuitsProvidernetworkByConditionReply) {
    option (google.api.http) = {
      post: "/api/circuits/providernetworks/condition"
      body: "*"
    };
  }

  // Batch get circuitsProvidernetwork by ids
  rpc ListByIDs(ListCircuitsProvidernetworkByIDsRequest) returns (ListCircuitsProvidernetworkByIDsReply) {
    option (google.api.http) = {
      post: "/api/circuits/providernetworks/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of circuitsProvidernetwork by last id
  rpc ListByLastID(ListCircuitsProvidernetworkByLastIDRequest) returns (ListCircuitsProvidernetworkByLastIDReply) {
    option (google.api.http) = {
      get: "/api/circuits/providernetworks"
    };
  }
}


