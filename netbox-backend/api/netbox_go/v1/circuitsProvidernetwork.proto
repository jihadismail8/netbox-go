message CreateCircuitsProvidernetworkRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	string name = 4; 
	string description = 5; 
	string comments = 6; 
	int64 providerID = 7; 
	string serviceID = 8; 
}

message CreateCircuitsProvidernetworkReply {
  uint64 id = 1;
}

message DeleteCircuitsProvidernetworkByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteCircuitsProvidernetworkByIDReply {

}

message UpdateCircuitsProvidernetworkByIDRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	uint64 id = 4 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	string name = 5; 
	string description = 6; 
	string comments = 7; 
	int64 providerID = 8; 
	string serviceID = 9; 
}

message UpdateCircuitsProvidernetworkByIDReply {

}

