syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service socialAuthPartial {
  // Create a new socialAuthPartial
  rpc Create(CreateSocialAuthPartialRequest) returns (CreateSocialAuthPartialReply) {
    option (google.api.http) = {
      post: "/api/users/auth-partials"
      body: "*"
    };
  }

  // Delete a socialAuthPartial by id
  rpc DeleteByID(DeleteSocialAuthPartialByIDRequest) returns (DeleteSocialAuthPartialByIDReply) {
    option (google.api.http) = {
      delete: "/api/users/auth-partials/{id}"
    };
  }

  // Update a socialAuthPartial by id
  rpc UpdateByID(UpdateSocialAuthPartialByIDRequest) returns (UpdateSocialAuthPartialByIDReply) {
    option (google.api.http) = {
      put: "/api/users/auth-partials/{id}"
      body: "*"
    };
  }

  // Get a socialAuthPartial by id
  rpc GetByID(GetSocialAuthPartialByIDRequest) returns (GetSocialAuthPartialByIDReply) {
    option (google.api.http) = {
      get: "/api/users/auth-partials/{id}"
    };
  }

  // Get a paginated list of socialAuthPartial by custom conditions
  rpc List(ListSocialAuthPartialRequest) returns (ListSocialAuthPartialReply) {
    option (google.api.http) = {
      post: "/api/users/auth-partials/list"
      body: "*"
    };
  }

  // Batch delete socialAuthPartial by ids
  rpc DeleteByIDs(DeleteSocialAuthPartialByIDsRequest) returns (DeleteSocialAuthPartialByIDsReply) {
    option (google.api.http) = {
      post: "/api/users/auth-partials/delete/ids"
      body: "*"
    };
  }

  // Get a socialAuthPartial by custom condition
  rpc GetByCondition(GetSocialAuthPartialByConditionRequest) returns (GetSocialAuthPartialByConditionReply) {
    option (google.api.http) = {
      post: "/api/users/auth-partials/condition"
      body: "*"
    };
  }

  // Batch get socialAuthPartial by ids
  rpc ListByIDs(ListSocialAuthPartialByIDsRequest) returns (ListSocialAuthPartialByIDsReply) {
    option (google.api.http) = {
      post: "/api/users/auth-partials/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of socialAuthPartial by last id
  rpc ListByLastID(ListSocialAuthPartialByLastIDRequest) returns (ListSocialAuthPartialByLastIDReply) {
    option (google.api.http) = {
      get: "/api/users/auth-partials"
    };
  }
}


/*
Notes for defining message fields:
    1. Suggest using camel case style naming for message field names, such as firstName, lastName, etc.
    2. If the message field name ending in 'id', it is recommended to use xxxID naming format, such as userID, orderID, etc.
    3. Add validate rules https://github.com/envoyproxy/protoc-gen-validate#constraint-rules, such as:
        uint64 id = 1 [(validate.rules).uint64.gte  = 1];

If used to generate code that supports the HTTP protocol, notes for defining message fields:
    1. If the route contains the path parameter, such as /api/v1/socialAuthPartial/{id}, the defined
        message must contain the name of the path parameter and the name should be added
        with a new tag, such as int64 id = 1 [(tagger.tags) = "uri:\"id\""];
    2. If the request url is followed by a query parameter, such as /api/v1/getSocialAuthPartial?name=Tom,
        a form tag must be added when defining the query parameter in the message, such as:
        string name = 1 [(tagger.tags) = "form:\"name\""].
    3. When the message fields use snake_case naming (e.g., order_id), the generated swagger.json file
        will use camelCase (e.g., orderId) instead of the expected snake_case. This behavior aligns with
        the JSON tag names used by gRPC, but it can cause the Gin framework to fail to correctly bind and
        retrieve parameter values. There are two ways to resolve this issue:
            (1) Explicitly specify the JSON tag name using the json_name option, such as:
                 string order_id = 1 [json_name = "order_id"];
            (2) If you want to switch to camelCase naming and update the JSON tag name accordingly, such as:
                 string order_id = 1 [json_name = "orderID", (tagger.tags) = "json:\"orderID\""];
*/


message CreateSocialAuthPartialRequest {
	string token = 1; 
	int32 nextStep = 2; 
	string backend = 3; 
	string timestamp = 4; 
	string data = 5; 
}

message CreateSocialAuthPartialReply {
  uint64 id = 1;
}

message DeleteSocialAuthPartialByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteSocialAuthPartialByIDReply {

}

message UpdateSocialAuthPartialByIDRequest {
	uint64 id = 1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	string token = 2; 
	int32 nextStep = 3; 
	string backend = 4; 
	string timestamp = 5; 
	string data = 6; 
}

message UpdateSocialAuthPartialByIDReply {

}

message SocialAuthPartial {
	uint64 id = 1; 
	string token = 2; 
	int32 nextStep = 3; 
	string backend = 4; 
	string timestamp = 5; 
	string data = 6; 
}

message GetSocialAuthPartialByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\"" ];
}

message GetSocialAuthPartialByIDReply {
  SocialAuthPartial socialAuthPartial = 1;
}

message ListSocialAuthPartialRequest {
  api.types.Params params = 1;
}

message ListSocialAuthPartialReply {
  int64 total = 1;
  repeated SocialAuthPartial socialAuthPartials = 2;
}

message DeleteSocialAuthPartialByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteSocialAuthPartialByIDsReply {

}

message GetSocialAuthPartialByConditionRequest {
  types.Conditions conditions = 1;
}

message GetSocialAuthPartialByConditionReply {
  SocialAuthPartial socialAuthPartial = 1;
}

message ListSocialAuthPartialByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message ListSocialAuthPartialByIDsReply {
  repeated SocialAuthPartial socialAuthPartials = 1;
}

message ListSocialAuthPartialByLastIDRequest {
  uint64 lastID = 1 [(tagger.tags) = "form:\"lastID\""]; // last id
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -id, the - sign indicates descending order.
}

message ListSocialAuthPartialByLastIDReply {
  repeated SocialAuthPartial socialAuthPartials = 1;
}


