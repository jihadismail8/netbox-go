syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service extrasConfigcontext {
  // Create a new extrasConfigcontext
  rpc Create(CreateExtrasConfigcontextRequest) returns (CreateExtrasConfigcontextReply) {
    option (google.api.http) = {
      post: "/api/extras/configcontexts"
      body: "*"
    };
  }

  // Delete a extrasConfigcontext by id
  rpc DeleteByID(DeleteExtrasConfigcontextByIDRequest) returns (DeleteExtrasConfigcontextByIDReply) {
    option (google.api.http) = {
      delete: "/api/extras/configcontexts/{id}"
    };
  }

  // Update a extrasConfigcontext by id
  rpc UpdateByID(UpdateExtrasConfigcontextByIDRequest) returns (UpdateExtrasConfigcontextByIDReply) {
    option (google.api.http) = {
      put: "/api/extras/configcontexts/{id}"
      body: "*"
    };
  }

  // Get a extrasConfigcontext by id
  rpc GetByID(GetExtrasConfigcontextByIDRequest) returns (GetExtrasConfigcontextByIDReply) {
    option (google.api.http) = {
      get: "/api/extras/configcontexts/{id}"
    };
  }

  // Get a paginated list of extrasConfigcontext by custom conditions
  rpc List(ListExtrasConfigcontextRequest) returns (ListExtrasConfigcontextReply) {
    option (google.api.http) = {
      post: "/api/extras/configcontexts/list"
      body: "*"
    };
  }

  // Batch delete extrasConfigcontext by ids
  rpc DeleteByIDs(DeleteExtrasConfigcontextByIDsRequest) returns (DeleteExtrasConfigcontextByIDsReply) {
    option (google.api.http) = {
      post: "/api/extras/configcontexts/delete/ids"
      body: "*"
    };
  }

  // Get a extrasConfigcontext by custom condition
  rpc GetByCondition(GetExtrasConfigcontextByConditionRequest) returns (GetExtrasConfigcontextByConditionReply) {
    option (google.api.http) = {
      post: "/api/extras/configcontexts/condition"
      body: "*"
    };
  }

  // Batch get extrasConfigcontext by ids
  rpc ListByIDs(ListExtrasConfigcontextByIDsRequest) returns (ListExtrasConfigcontextByIDsReply) {
    option (google.api.http) = {
      post: "/api/extras/configcontexts/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of extrasConfigcontext by last id
  rpc ListByLastID(ListExtrasConfigcontextByLastIDRequest) returns (ListExtrasConfigcontextByLastIDReply) {
    option (google.api.http) = {
      get: "/api/extras/configcontexts"
    };
  }
}


