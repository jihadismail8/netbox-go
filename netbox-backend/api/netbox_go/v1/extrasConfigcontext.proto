message CreateExtrasConfigcontextRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string name = 3; 
	int32 weight = 4; 
	string description = 5; 
	bool isActive = 6; 
	string data = 7; 
	int64 dataFileID = 8; 
	string dataPath = 9; 
	int64 dataSourceID = 10; 
	bool autoSyncEnabled = 11; 
	string dataSynced = 12; 
	int64 profileID = 13; 
}

message CreateExtrasConfigcontextReply {
  uint64 id = 1;
}

message DeleteExtrasConfigcontextByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteExtrasConfigcontextByIDReply {

}

message UpdateExtrasConfigcontextByIDRequest {
	string created = 1; 
	string lastUpdated = 2; 
	uint64 id = 3 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	string name = 4; 
	int32 weight = 5; 
	string description = 6; 
	bool isActive = 7; 
	string data = 8; 
	int64 dataFileID = 9; 
	string dataPath = 10; 
	int64 dataSourceID = 11; 
	bool autoSyncEnabled = 12; 
	string dataSynced = 13; 
	int64 profileID = 14; 
}

message UpdateExtrasConfigcontextByIDReply {

}

message ExtrasConfigcontext {
	string created = 1; 
	string lastUpdated = 2; 
	uint64 id = 3; 
	string name = 4; 
	int32 weight = 5; 
	string description = 6; 
	bool isActive = 7; 
	string data = 8; 
	int64 dataFileID = 9; 
	string dataPath = 10; 
	int64 dataSourceID = 11; 
	bool autoSyncEnabled = 12; 
	string dataSynced = 13; 
	int64 profileID = 14; 
}

message GetExtrasConfigcontextByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\"" ];
}

message GetExtrasConfigcontextByIDReply {
  ExtrasConfigcontext extrasConfigcontext = 1;
}

message ListExtrasConfigcontextRequest {
  api.types.Params params = 1;
}

message ListExtrasConfigcontextReply {
  int64 total = 1;
  repeated ExtrasConfigcontext extrasConfigcontexts = 2;
}

message DeleteExtrasConfigcontextByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteExtrasConfigcontextByIDsReply {

}

message GetExtrasConfigcontextByConditionRequest {
  types.Conditions conditions = 1;
}

message GetExtrasConfigcontextByConditionReply {
  ExtrasConfigcontext extrasConfigcontext = 1;
}

message ListExtrasConfigcontextByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message ListExtrasConfigcontextByIDsReply {
  repeated ExtrasConfigcontext extrasConfigcontexts = 1;
}

message ListExtrasConfigcontextByLastIDRequest {
  uint64 lastID = 1 [(tagger.tags) = "form:\"lastID\""]; // last id
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -id, the - sign indicates descending order.
}

message ListExtrasConfigcontextByLastIDReply {
  repeated ExtrasConfigcontext extrasConfigcontexts = 1;
}


