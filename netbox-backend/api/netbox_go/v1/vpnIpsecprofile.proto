message CreateVpnIpsecprofileRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	string description = 4; 
	string comments = 5; 
	string name = 6; 
	string mode = 7; 
	int64 ikePolicyID = 8; 
	int64 ipsecPolicyID = 9; 
}

message CreateVpnIpsecprofileReply {
  uint64 id = 1;
}

message DeleteVpnIpsecprofileByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteVpnIpsecprofileByIDReply {

}

message UpdateVpnIpsecprofileByIDRequest {
	uint64 id = 1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	string created = 2; 
	string lastUpdated = 3; 
	string customFieldData = 4; 
	string description = 5; 
	string comments = 6; 
	string name = 7; 
	string mode = 8; 
	int64 ikePolicyID = 9; 
	int64 ipsecPolicyID = 10; 
}

message UpdateVpnIpsecprofileByIDReply {

}

message VpnIpsecprofile {
	uint64 id = 1; 
	string created = 2; 
	string lastUpdated = 3; 
	string customFieldData = 4; 
	string description = 5; 
	string comments = 6; 
	string name = 7; 
	string mode = 8; 
	int64 ikePolicyID = 9; 
	int64 ipsecPolicyID = 10; 
}

message GetVpnIpsecprofileByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\"" ];
}

message GetVpnIpsecprofileByIDReply {
  VpnIpsecprofile vpnIpsecprofile = 1;
}

message ListVpnIpsecprofileRequest {
  api.types.Params params = 1;
}

message ListVpnIpsecprofileReply {
  int64 total = 1;
  repeated VpnIpsecprofile vpnIpsecprofiles = 2;
}

message DeleteVpnIpsecprofileByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteVpnIpsecprofileByIDsReply {

}

message GetVpnIpsecprofileByConditionRequest {
  types.Conditions conditions = 1;
}

message GetVpnIpsecprofileByConditionReply {
  VpnIpsecprofile vpnIpsecprofile = 1;
}

message ListVpnIpsecprofileByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message ListVpnIpsecprofileByIDsReply {
  repeated VpnIpsecprofile vpnIpsecprofiles = 1;
}

message ListVpnIpsecprofileByLastIDRequest {
  uint64 lastID = 1 [(tagger.tags) = "form:\"lastID\""]; // last id
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -id, the - sign indicates descending order.
}

message ListVpnIpsecprofileByLastIDReply {
  repeated VpnIpsecprofile vpnIpsecprofiles = 1;
}


