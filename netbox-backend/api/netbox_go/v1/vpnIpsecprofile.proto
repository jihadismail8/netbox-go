syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service vpnIpsecprofile {
  // Create a new vpnIpsecprofile
  rpc Create(CreateVpnIpsecprofileRequest) returns (CreateVpnIpsecprofileReply) {
    option (google.api.http) = {
      post: "/api/vpn/ipsecprofiles"
      body: "*"
    };
  }

  // Delete a vpnIpsecprofile by id
  rpc DeleteByID(DeleteVpnIpsecprofileByIDRequest) returns (DeleteVpnIpsecprofileByIDReply) {
    option (google.api.http) = {
      delete: "/api/vpn/ipsecprofiles/{id}"
    };
  }

  // Update a vpnIpsecprofile by id
  rpc UpdateByID(UpdateVpnIpsecprofileByIDRequest) returns (UpdateVpnIpsecprofileByIDReply) {
    option (google.api.http) = {
      put: "/api/vpn/ipsecprofiles/{id}"
      body: "*"
    };
  }

  // Get a vpnIpsecprofile by id
  rpc GetByID(GetVpnIpsecprofileByIDRequest) returns (GetVpnIpsecprofileByIDReply) {
    option (google.api.http) = {
      get: "/api/vpn/ipsecprofiles/{id}"
    };
  }

  // Get a paginated list of vpnIpsecprofile by custom conditions
  rpc List(ListVpnIpsecprofileRequest) returns (ListVpnIpsecprofileReply) {
    option (google.api.http) = {
      post: "/api/vpn/ipsecprofiles/list"
      body: "*"
    };
  }

  // Batch delete vpnIpsecprofile by ids
  rpc DeleteByIDs(DeleteVpnIpsecprofileByIDsRequest) returns (DeleteVpnIpsecprofileByIDsReply) {
    option (google.api.http) = {
      post: "/api/vpn/ipsecprofiles/delete/ids"
      body: "*"
    };
  }

  // Get a vpnIpsecprofile by custom condition
  rpc GetByCondition(GetVpnIpsecprofileByConditionRequest) returns (GetVpnIpsecprofileByConditionReply) {
    option (google.api.http) = {
      post: "/api/vpn/ipsecprofiles/condition"
      body: "*"
    };
  }

  // Batch get vpnIpsecprofile by ids
  rpc ListByIDs(ListVpnIpsecprofileByIDsRequest) returns (ListVpnIpsecprofileByIDsReply) {
    option (google.api.http) = {
      post: "/api/vpn/ipsecprofiles/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of vpnIpsecprofile by last id
  rpc ListByLastID(ListVpnIpsecprofileByLastIDRequest) returns (ListVpnIpsecprofileByLastIDReply) {
    option (google.api.http) = {
      get: "/api/vpn/ipsecprofiles"
    };
  }
}


