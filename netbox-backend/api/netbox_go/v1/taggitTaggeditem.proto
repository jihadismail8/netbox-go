syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service taggitTaggeditem {
  // Create a new taggitTaggeditem
  rpc Create(CreateTaggitTaggeditemRequest) returns (CreateTaggitTaggeditemReply) {
    option (google.api.http) = {
      post: "/api/taggit/taggeditems"
      body: "*"
    };
  }

  // Delete a taggitTaggeditem by id
  rpc DeleteByID(DeleteTaggitTaggeditemByIDRequest) returns (DeleteTaggitTaggeditemByIDReply) {
    option (google.api.http) = {
      delete: "/api/taggit/taggeditems/{id}"
    };
  }

  // Update a taggitTaggeditem by id
  rpc UpdateByID(UpdateTaggitTaggeditemByIDRequest) returns (UpdateTaggitTaggeditemByIDReply) {
    option (google.api.http) = {
      put: "/api/taggit/taggeditems/{id}"
      body: "*"
    };
  }

  // Get a taggitTaggeditem by id
  rpc GetByID(GetTaggitTaggeditemByIDRequest) returns (GetTaggitTaggeditemByIDReply) {
    option (google.api.http) = {
      get: "/api/taggit/taggeditems/{id}"
    };
  }

  // Get a paginated list of taggitTaggeditem by custom conditions
  rpc List(ListTaggitTaggeditemRequest) returns (ListTaggitTaggeditemReply) {
    option (google.api.http) = {
      post: "/api/taggit/taggeditems/list"
      body: "*"
    };
  }

  // Batch delete taggitTaggeditem by ids
  rpc DeleteByIDs(DeleteTaggitTaggeditemByIDsRequest) returns (DeleteTaggitTaggeditemByIDsReply) {
    option (google.api.http) = {
      post: "/api/taggit/taggeditems/delete/ids"
      body: "*"
    };
  }

  // Get a taggitTaggeditem by custom condition
  rpc GetByCondition(GetTaggitTaggeditemByConditionRequest) returns (GetTaggitTaggeditemByConditionReply) {
    option (google.api.http) = {
      post: "/api/taggit/taggeditems/condition"
      body: "*"
    };
  }

  // Batch get taggitTaggeditem by ids
  rpc ListByIDs(ListTaggitTaggeditemByIDsRequest) returns (ListTaggitTaggeditemByIDsReply) {
    option (google.api.http) = {
      post: "/api/taggit/taggeditems/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of taggitTaggeditem by last id
  rpc ListByLastID(ListTaggitTaggeditemByLastIDRequest) returns (ListTaggitTaggeditemByLastIDReply) {
    option (google.api.http) = {
      get: "/api/taggit/taggeditems"
    };
  }
}


