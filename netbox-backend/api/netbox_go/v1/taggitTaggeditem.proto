message CreateTaggitTaggeditemRequest {
	int32 objectID = 1; 
	int32 contentTypeID = 2; 
	int32 tagID = 3; 
}

message CreateTaggitTaggeditemReply {
  uint64 id = 1;
}

message DeleteTaggitTaggeditemByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteTaggitTaggeditemByIDReply {

}

message UpdateTaggitTaggeditemByIDRequest {
	uint64 id = 1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	int32 objectID = 2; 
	int32 contentTypeID = 3; 
	int32 tagID = 4; 
}

message UpdateTaggitTaggeditemByIDReply {

}

message TaggitTaggeditem {
	uint64 id = 1; 
	int32 objectID = 2; 
	int32 contentTypeID = 3; 
	int32 tagID = 4; 
}

message GetTaggitTaggeditemByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\"" ];
}

message GetTaggitTaggeditemByIDReply {
  TaggitTaggeditem taggitTaggeditem = 1;
}

message ListTaggitTaggeditemRequest {
  api.types.Params params = 1;
}

message ListTaggitTaggeditemReply {
  int64 total = 1;
  repeated TaggitTaggeditem taggitTaggeditems = 2;
}

message DeleteTaggitTaggeditemByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteTaggitTaggeditemByIDsReply {

}

message GetTaggitTaggeditemByConditionRequest {
  types.Conditions conditions = 1;
}

message GetTaggitTaggeditemByConditionReply {
  TaggitTaggeditem taggitTaggeditem = 1;
}

message ListTaggitTaggeditemByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message ListTaggitTaggeditemByIDsReply {
  repeated TaggitTaggeditem taggitTaggeditems = 1;
}

message ListTaggitTaggeditemByLastIDRequest {
  uint64 lastID = 1 [(tagger.tags) = "form:\"lastID\""]; // last id
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -id, the - sign indicates descending order.
}

message ListTaggitTaggeditemByLastIDReply {
  repeated TaggitTaggeditem taggitTaggeditems = 1;
}


