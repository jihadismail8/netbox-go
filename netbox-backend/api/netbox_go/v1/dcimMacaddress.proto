syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service dcimMacaddress {
  // Create a new dcimMacaddress
  rpc Create(CreateDcimMacaddressRequest) returns (CreateDcimMacaddressReply) {
    option (google.api.http) = {
      post: "/api/dcim/macaddress"
      body: "*"
    };
  }

  // Delete a dcimMacaddress by id
  rpc DeleteByID(DeleteDcimMacaddressByIDRequest) returns (DeleteDcimMacaddressByIDReply) {
    option (google.api.http) = {
      delete: "/api/dcim/macaddress/{id}"
    };
  }

  // Update a dcimMacaddress by id
  rpc UpdateByID(UpdateDcimMacaddressByIDRequest) returns (UpdateDcimMacaddressByIDReply) {
    option (google.api.http) = {
      put: "/api/dcim/macaddress/{id}"
      body: "*"
    };
  }

  // Get a dcimMacaddress by id
  rpc GetByID(GetDcimMacaddressByIDRequest) returns (GetDcimMacaddressByIDReply) {
    option (google.api.http) = {
      get: "/api/dcim/macaddress/{id}"
    };
  }

  // Get a paginated list of dcimMacaddress by custom conditions
  rpc List(ListDcimMacaddressRequest) returns (ListDcimMacaddressReply) {
    option (google.api.http) = {
      post: "/api/dcim/macaddress/list"
      body: "*"
    };
  }

  // Batch delete dcimMacaddress by ids
  rpc DeleteByIDs(DeleteDcimMacaddressByIDsRequest) returns (DeleteDcimMacaddressByIDsReply) {
    option (google.api.http) = {
      post: "/api/dcim/macaddress/delete/ids"
      body: "*"
    };
  }

  // Get a dcimMacaddress by custom condition
  rpc GetByCondition(GetDcimMacaddressByConditionRequest) returns (GetDcimMacaddressByConditionReply) {
    option (google.api.http) = {
      post: "/api/dcim/macaddress/condition"
      body: "*"
    };
  }

  // Batch get dcimMacaddress by ids
  rpc ListByIDs(ListDcimMacaddressByIDsRequest) returns (ListDcimMacaddressByIDsReply) {
    option (google.api.http) = {
      post: "/api/dcim/macaddress/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of dcimMacaddress by last id
  rpc ListByLastID(ListDcimMacaddressByLastIDRequest) returns (ListDcimMacaddressByLastIDReply) {
    option (google.api.http) = {
      get: "/api/dcim/macaddress"
    };
  }
}


/*
Notes for defining message fields:
    1. Suggest using camel case style naming for message field names, such as firstName, lastName, etc.
    2. If the message field name ending in 'id', it is recommended to use xxxID naming format, such as userID, orderID, etc.
    3. Add validate rules https://github.com/envoyproxy/protoc-gen-validate#constraint-rules, such as:
        uint64 id = 1 [(validate.rules).uint64.gte  = 1];

If used to generate code that supports the HTTP protocol, notes for defining message fields:
    1. If the route contains the path parameter, such as /api/v1/dcimMacaddress/{id}, the defined
        message must contain the name of the path parameter and the name should be added
        with a new tag, such as int64 id = 1 [(tagger.tags) = "uri:\"id\""];
    2. If the request url is followed by a query parameter, such as /api/v1/getDcimMacaddress?name=Tom,
        a form tag must be added when defining the query parameter in the message, such as:
        string name = 1 [(tagger.tags) = "form:\"name\""].
    3. When the message fields use snake_case naming (e.g., order_id), the generated swagger.json file
        will use camelCase (e.g., orderId) instead of the expected snake_case. This behavior aligns with
        the JSON tag names used by gRPC, but it can cause the Gin framework to fail to correctly bind and
        retrieve parameter values. There are two ways to resolve this issue:
            (1) Explicitly specify the JSON tag name using the json_name option, such as:
                 string order_id = 1 [json_name = "order_id"];
            (2) If you want to switch to camelCase naming and update the JSON tag name accordingly, such as:
                 string order_id = 1 [json_name = "orderID", (tagger.tags) = "json:\"orderID\""];
*/


message CreateDcimMacaddressRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	string description = 4; 
	string comments = 5; 
	string macAddress = 6; 
	int64 assignedObjectID = 7; 
	int32 assignedObjectTypeID = 8; 
}

message CreateDcimMacaddressReply {
  uint64 id = 1;
}

message DeleteDcimMacaddressByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteDcimMacaddressByIDReply {

}

message UpdateDcimMacaddressByIDRequest {
	uint64 id = 1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	string created = 2; 
	string lastUpdated = 3; 
	string customFieldData = 4; 
	string description = 5; 
	string comments = 6; 
	string macAddress = 7; 
	int64 assignedObjectID = 8; 
	int32 assignedObjectTypeID = 9; 
}

message UpdateDcimMacaddressByIDReply {

}

message DcimMacaddress {
	uint64 id = 1; 
	string created = 2; 
	string lastUpdated = 3; 
	string customFieldData = 4; 
	string description = 5; 
	string comments = 6; 
	string macAddress = 7; 
	int64 assignedObjectID = 8; 
	int32 assignedObjectTypeID = 9; 
}

message GetDcimMacaddressByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\"" ];
}

message GetDcimMacaddressByIDReply {
  DcimMacaddress dcimMacaddress = 1;
}

message ListDcimMacaddressRequest {
  api.types.Params params = 1;
}

message ListDcimMacaddressReply {
  int64 total = 1;
  repeated DcimMacaddress dcimMacaddresss = 2;
}

message DeleteDcimMacaddressByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteDcimMacaddressByIDsReply {

}

message GetDcimMacaddressByConditionRequest {
  types.Conditions conditions = 1;
}

message GetDcimMacaddressByConditionReply {
  DcimMacaddress dcimMacaddress = 1;
}

message ListDcimMacaddressByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message ListDcimMacaddressByIDsReply {
  repeated DcimMacaddress dcimMacaddresss = 1;
}

message ListDcimMacaddressByLastIDRequest {
  uint64 lastID = 1 [(tagger.tags) = "form:\"lastID\""]; // last id
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -id, the - sign indicates descending order.
}

message ListDcimMacaddressByLastIDReply {
  repeated DcimMacaddress dcimMacaddresss = 1;
}


