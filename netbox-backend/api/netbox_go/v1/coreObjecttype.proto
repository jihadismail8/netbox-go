*/


message CreateCoreObjecttypeRequest {
	int32 contenttypePtrID = 1; 
	bool public = 2; 
	string features = 3; 
}

message CreateCoreObjecttypeReply {
  int32 contenttypePtrID = 1;
}

message DeleteCoreObjecttypeByContenttypePtrIDRequest {
  int32 contenttypePtrID = 1 [(validate.rules).int32.gt = 0, (tagger.tags) = "uri:\"contenttypePtrID\""];
}

message DeleteCoreObjecttypeByContenttypePtrIDReply {

}

message UpdateCoreObjecttypeByContenttypePtrIDRequest {
	int32 contenttypePtrID = 1 [(validate.rules).int32.gt = 0, (tagger.tags) = "uri:\"contenttypePtrID\""]; 
	bool public = 2; 
	string features = 3; 
}

message UpdateCoreObjecttypeByContenttypePtrIDReply {

}

message CoreObjecttype {
	int32 contenttypePtrID = 1; 
	bool public = 2; 
	string features = 3; 
}

message GetCoreObjecttypeByContenttypePtrIDRequest {
  int32 contenttypePtrID = 1 [(validate.rules).int32.gt = 0, (tagger.tags) = "uri:\"contenttypePtrID\""];
}

message GetCoreObjecttypeByContenttypePtrIDReply {
  CoreObjecttype coreObjecttype = 1;
}

message ListCoreObjecttypeRequest {
  api.types.Params params = 1;
}

message ListCoreObjecttypeReply {
  int64 total = 1;
  repeated CoreObjecttype coreObjecttypes = 2;
}

message DeleteCoreObjecttypeByContenttypePtrIDsRequest {
  repeated int32 contenttypePtrIDs = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteCoreObjecttypeByContenttypePtrIDsReply {

}

message GetCoreObjecttypeByConditionRequest {
  types.Conditions conditions = 1;
}

message GetCoreObjecttypeByConditionReply {
  CoreObjecttype coreObjecttype = 1;
}

message ListCoreObjecttypeByContenttypePtrIDsRequest {
  repeated int32 contenttypePtrIDs = 1 [(validate.rules).repeated.min_items = 1];
}

message ListCoreObjecttypeByContenttypePtrIDsReply {
  repeated CoreObjecttype coreObjecttypes = 1;
}

message ListCoreObjecttypeByLastContenttypePtrIDRequest {
  int32 lastContenttypePtrID = 1 [(tagger.tags) = "form:\"lastContenttypePtrID\""];
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -contenttype_ptr_id, the - sign indicates descending order.
}

message ListCoreObjecttypeByLastContenttypePtrIDReply {
  repeated CoreObjecttype coreObjecttypes = 1;
}


