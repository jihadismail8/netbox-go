syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user details by id",
      description: "Gets detailed information of a coreObjecttype specified by the given id in the path.",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service coreObjecttype {
  // Create a new coreObjecttype
  rpc Create(CreateCoreObjecttypeRequest) returns (CreateCoreObjecttypeReply) {
    option (google.api.http) = {
      post: "/api/core/objecttypes"
      body: "*"
    };
  }

  // Delete a coreObjecttype by contenttypePtrID
  rpc DeleteByContenttypePtrID(DeleteCoreObjecttypeByContenttypePtrIDRequest) returns (DeleteCoreObjecttypeByContenttypePtrIDReply) {
    option (google.api.http) = {
      delete: "/api/v1/coreObjecttype/{contenttypePtrID}"
    };
  }

  // Update a coreObjecttype by contenttypePtrID
  rpc UpdateByContenttypePtrID(UpdateCoreObjecttypeByContenttypePtrIDRequest) returns (UpdateCoreObjecttypeByContenttypePtrIDReply) {
    option (google.api.http) = {
      put: "/api/v1/coreObjecttype/{contenttypePtrID}"
      body: "*"
    };
  }

  // Get a coreObjecttype by contenttypePtrID
  rpc GetByContenttypePtrID(GetCoreObjecttypeByContenttypePtrIDRequest) returns (GetCoreObjecttypeByContenttypePtrIDReply) {
    option (google.api.http) = {
      get: "/api/v1/coreObjecttype/{contenttypePtrID}"
    };
  }

  // Get a paginated list of coreObjecttype by custom conditions
  rpc List(ListCoreObjecttypeRequest) returns (ListCoreObjecttypeReply) {
    option (google.api.http) = {
      post: "/api/core/objecttypes/list"
      body: "*"
    };
  }

  // Batch delete coreObjecttype by contenttypePtrID
  rpc DeleteByContenttypePtrIDs(DeleteCoreObjecttypeByContenttypePtrIDsRequest) returns (DeleteCoreObjecttypeByContenttypePtrIDsReply) {
    option (google.api.http) = {
      post: "/api/core/objecttypes/delete/ids"
      body: "*"
    };
  }

  // Get a coreObjecttype by custom conditions
  rpc GetByCondition(GetCoreObjecttypeByConditionRequest) returns (GetCoreObjecttypeByConditionReply) {
    option (google.api.http) = {
      post: "/api/core/objecttypes/condition"
      body: "*"
    };
  }

  // Batch get coreObjecttype by contenttypePtrID
  rpc ListByContenttypePtrIDs(ListCoreObjecttypeByContenttypePtrIDsRequest) returns (ListCoreObjecttypeByContenttypePtrIDsReply) {
    option (google.api.http) = {
      post: "/api/core/objecttypes/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of coreObjecttype by last contenttypePtrID
  rpc ListByLastContenttypePtrID(ListCoreObjecttypeByLastContenttypePtrIDRequest) returns (ListCoreObjecttypeByLastContenttypePtrIDReply) {
    option (google.api.http) = {
      get: "/api/core/objecttypes"
    };
  }
}


/*
Notes for defining message fields:
    1. Suggest using camel case style naming for message field names, such as firstName, lastName, etc.
    2. If the message field name ending in 'id', it is recommended to use xxxID naming format, such as userID, orderID, etc.
    3. Add validate rules https://github.com/envoyproxy/protoc-gen-validate#constraint-rules, such as:
        uint64 id = 1 [(validate.rules).uint64.gte  = 1];

If used to generate code that supports the HTTP protocol, notes for defining message fields:
    1. If the route contains the path parameter, such as /api/v1/coreObjecttype/{id}, the defined
        message must contain the name of the path parameter and the name should be added
        with a new tag, such as int64 id = 1 [(tagger.tags) = "uri:\"id\""];
    2. If the request url is followed by a query parameter, such as /api/v1/getCoreObjecttype?name=Tom,
        a form tag must be added when defining the query parameter in the message, such as:
        string name = 1 [(tagger.tags) = "form:\"name\""].
    3. When the message fields use snake_case naming (e.g., order_id), the generated swagger.json file
