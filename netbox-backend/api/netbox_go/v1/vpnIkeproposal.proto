syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service vpnIkeproposal {
  // Create a new vpnIkeproposal
  rpc Create(CreateVpnIkeproposalRequest) returns (CreateVpnIkeproposalReply) {
    option (google.api.http) = {
      post: "/api/vpn/ikeproposals"
      body: "*"
    };
  }

  // Delete a vpnIkeproposal by id
  rpc DeleteByID(DeleteVpnIkeproposalByIDRequest) returns (DeleteVpnIkeproposalByIDReply) {
    option (google.api.http) = {
      delete: "/api/vpn/ikeproposals/{id}"
    };
  }

  // Update a vpnIkeproposal by id
  rpc UpdateByID(UpdateVpnIkeproposalByIDRequest) returns (UpdateVpnIkeproposalByIDReply) {
    option (google.api.http) = {
      put: "/api/vpn/ikeproposals/{id}"
      body: "*"
    };
  }

  // Get a vpnIkeproposal by id
  rpc GetByID(GetVpnIkeproposalByIDRequest) returns (GetVpnIkeproposalByIDReply) {
    option (google.api.http) = {
      get: "/api/vpn/ikeproposals/{id}"
    };
  }

  // Get a paginated list of vpnIkeproposal by custom conditions
  rpc List(ListVpnIkeproposalRequest) returns (ListVpnIkeproposalReply) {
    option (google.api.http) = {
      post: "/api/vpn/ikeproposals/list"
      body: "*"
    };
  }

  // Batch delete vpnIkeproposal by ids
  rpc DeleteByIDs(DeleteVpnIkeproposalByIDsRequest) returns (DeleteVpnIkeproposalByIDsReply) {
    option (google.api.http) = {
      post: "/api/vpn/ikeproposals/delete/ids"
      body: "*"
    };
  }

  // Get a vpnIkeproposal by custom condition
  rpc GetByCondition(GetVpnIkeproposalByConditionRequest) returns (GetVpnIkeproposalByConditionReply) {
    option (google.api.http) = {
      post: "/api/vpn/ikeproposals/condition"
      body: "*"
    };
  }

  // Batch get vpnIkeproposal by ids
  rpc ListByIDs(ListVpnIkeproposalByIDsRequest) returns (ListVpnIkeproposalByIDsReply) {
    option (google.api.http) = {
      post: "/api/vpn/ikeproposals/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of vpnIkeproposal by last id
  rpc ListByLastID(ListVpnIkeproposalByLastIDRequest) returns (ListVpnIkeproposalByLastIDReply) {
    option (google.api.http) = {
      get: "/api/vpn/ikeproposals"
    };
  }
}


