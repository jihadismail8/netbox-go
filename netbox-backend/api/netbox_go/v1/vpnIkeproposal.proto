message CreateVpnIkeproposalRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	string description = 4; 
	string comments = 5; 
	string name = 6; 
	string authenticationMethod = 7; 
	string encryptionAlgorithm = 8; 
	string authenticationAlgorithm = 9; 
	int32 group = 10; 
	int32 saLifetime = 11; 
}

message CreateVpnIkeproposalReply {
  uint64 id = 1;
}

message DeleteVpnIkeproposalByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteVpnIkeproposalByIDReply {

}

message UpdateVpnIkeproposalByIDRequest {
	uint64 id = 1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	string created = 2; 
	string lastUpdated = 3; 
	string customFieldData = 4; 
	string description = 5; 
	string comments = 6; 
	string name = 7; 
	string authenticationMethod = 8; 
	string encryptionAlgorithm = 9; 
	string authenticationAlgorithm = 10; 
	int32 group = 11; 
	int32 saLifetime = 12; 
}

message UpdateVpnIkeproposalByIDReply {

}

message VpnIkeproposal {
	uint64 id = 1; 
	string created = 2; 
	string lastUpdated = 3; 
	string customFieldData = 4; 
	string description = 5; 
	string comments = 6; 
	string name = 7; 
	string authenticationMethod = 8; 
	string encryptionAlgorithm = 9; 
	string authenticationAlgorithm = 10; 
	int32 group = 11; 
	int32 saLifetime = 12; 
}

message GetVpnIkeproposalByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\"" ];
}

message GetVpnIkeproposalByIDReply {
  VpnIkeproposal vpnIkeproposal = 1;
}

message ListVpnIkeproposalRequest {
  api.types.Params params = 1;
}

message ListVpnIkeproposalReply {
  int64 total = 1;
  repeated VpnIkeproposal vpnIkeproposals = 2;
}

message DeleteVpnIkeproposalByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteVpnIkeproposalByIDsReply {

}

message GetVpnIkeproposalByConditionRequest {
  types.Conditions conditions = 1;
}

message GetVpnIkeproposalByConditionReply {
  VpnIkeproposal vpnIkeproposal = 1;
}

message ListVpnIkeproposalByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message ListVpnIkeproposalByIDsReply {
  repeated VpnIkeproposal vpnIkeproposals = 1;
}

message ListVpnIkeproposalByLastIDRequest {
  uint64 lastID = 1 [(tagger.tags) = "form:\"lastID\""]; // last id
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -id, the - sign indicates descending order.
}

message ListVpnIkeproposalByLastIDReply {
  repeated VpnIkeproposal vpnIkeproposals = 1;
}


