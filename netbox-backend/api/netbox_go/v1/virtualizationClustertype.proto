syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service virtualizationClustertype {
  // Create a new virtualizationClustertype
  rpc Create(CreateVirtualizationClustertypeRequest) returns (CreateVirtualizationClustertypeReply) {
    option (google.api.http) = {
      post: "/api/virtualization/clustertypes"
      body: "*"
    };
  }

  // Delete a virtualizationClustertype by id
  rpc DeleteByID(DeleteVirtualizationClustertypeByIDRequest) returns (DeleteVirtualizationClustertypeByIDReply) {
    option (google.api.http) = {
      delete: "/api/virtualization/clustertypes/{id}"
    };
  }

  // Update a virtualizationClustertype by id
  rpc UpdateByID(UpdateVirtualizationClustertypeByIDRequest) returns (UpdateVirtualizationClustertypeByIDReply) {
    option (google.api.http) = {
      put: "/api/virtualization/clustertypes/{id}"
      body: "*"
    };
  }

  // Get a virtualizationClustertype by id
  rpc GetByID(GetVirtualizationClustertypeByIDRequest) returns (GetVirtualizationClustertypeByIDReply) {
    option (google.api.http) = {
      get: "/api/virtualization/clustertypes/{id}"
    };
  }

  // Get a paginated list of virtualizationClustertype by custom conditions
  rpc List(ListVirtualizationClustertypeRequest) returns (ListVirtualizationClustertypeReply) {
    option (google.api.http) = {
      post: "/api/virtualization/clustertypes/list"
      body: "*"
    };
  }

  // Batch delete virtualizationClustertype by ids
  rpc DeleteByIDs(DeleteVirtualizationClustertypeByIDsRequest) returns (DeleteVirtualizationClustertypeByIDsReply) {
    option (google.api.http) = {
      post: "/api/virtualization/clustertypes/delete/ids"
      body: "*"
    };
  }

  // Get a virtualizationClustertype by custom condition
  rpc GetByCondition(GetVirtualizationClustertypeByConditionRequest) returns (GetVirtualizationClustertypeByConditionReply) {
    option (google.api.http) = {
      post: "/api/virtualization/clustertypes/condition"
      body: "*"
    };
  }

  // Batch get virtualizationClustertype by ids
  rpc ListByIDs(ListVirtualizationClustertypeByIDsRequest) returns (ListVirtualizationClustertypeByIDsReply) {
    option (google.api.http) = {
      post: "/api/virtualization/clustertypes/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of virtualizationClustertype by last id
  rpc ListByLastID(ListVirtualizationClustertypeByLastIDRequest) returns (ListVirtualizationClustertypeByLastIDReply) {
    option (google.api.http) = {
      get: "/api/virtualization/clustertypes"
    };
  }
}


