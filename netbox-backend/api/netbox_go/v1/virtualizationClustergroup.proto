syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service virtualizationClustergroup {
  // Create a new virtualizationClustergroup
  rpc Create(CreateVirtualizationClustergroupRequest) returns (CreateVirtualizationClustergroupReply) {
    option (google.api.http) = {
      post: "/api/virtualization/clustergroups"
      body: "*"
    };
  }

  // Delete a virtualizationClustergroup by id
  rpc DeleteByID(DeleteVirtualizationClustergroupByIDRequest) returns (DeleteVirtualizationClustergroupByIDReply) {
    option (google.api.http) = {
      delete: "/api/virtualization/clustergroups/{id}"
    };
  }

  // Update a virtualizationClustergroup by id
  rpc UpdateByID(UpdateVirtualizationClustergroupByIDRequest) returns (UpdateVirtualizationClustergroupByIDReply) {
    option (google.api.http) = {
      put: "/api/virtualization/clustergroups/{id}"
      body: "*"
    };
  }

  // Get a virtualizationClustergroup by id
  rpc GetByID(GetVirtualizationClustergroupByIDRequest) returns (GetVirtualizationClustergroupByIDReply) {
    option (google.api.http) = {
      get: "/api/virtualization/clustergroups/{id}"
    };
  }

  // Get a paginated list of virtualizationClustergroup by custom conditions
  rpc List(ListVirtualizationClustergroupRequest) returns (ListVirtualizationClustergroupReply) {
    option (google.api.http) = {
      post: "/api/virtualization/clustergroups/list"
      body: "*"
    };
  }

  // Batch delete virtualizationClustergroup by ids
  rpc DeleteByIDs(DeleteVirtualizationClustergroupByIDsRequest) returns (DeleteVirtualizationClustergroupByIDsReply) {
    option (google.api.http) = {
      post: "/api/virtualization/clustergroups/delete/ids"
      body: "*"
    };
  }

  // Get a virtualizationClustergroup by custom condition
  rpc GetByCondition(GetVirtualizationClustergroupByConditionRequest) returns (GetVirtualizationClustergroupByConditionReply) {
    option (google.api.http) = {
      post: "/api/virtualization/clustergroups/condition"
      body: "*"
    };
  }

  // Batch get virtualizationClustergroup by ids
  rpc ListByIDs(ListVirtualizationClustergroupByIDsRequest) returns (ListVirtualizationClustergroupByIDsReply) {
    option (google.api.http) = {
      post: "/api/virtualization/clustergroups/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of virtualizationClustergroup by last id
  rpc ListByLastID(ListVirtualizationClustergroupByLastIDRequest) returns (ListVirtualizationClustergroupByLastIDReply) {
    option (google.api.http) = {
      get: "/api/virtualization/clustergroups"
    };
  }
}


