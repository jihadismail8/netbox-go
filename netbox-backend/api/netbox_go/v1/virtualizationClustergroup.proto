message CreateVirtualizationClustergroupRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	string name = 4; 
	string slug = 5; 
	string description = 6; 
}

message CreateVirtualizationClustergroupReply {
  uint64 id = 1;
}

message DeleteVirtualizationClustergroupByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteVirtualizationClustergroupByIDReply {

}

message UpdateVirtualizationClustergroupByIDRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	uint64 id = 4 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	string name = 5; 
	string slug = 6; 
	string description = 7; 
}

message UpdateVirtualizationClustergroupByIDReply {

}

message VirtualizationClustergroup {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	uint64 id = 4; 
	string name = 5; 
	string slug = 6; 
	string description = 7; 
}

message GetVirtualizationClustergroupByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\"" ];
}

message GetVirtualizationClustergroupByIDReply {
  VirtualizationClustergroup virtualizationClustergroup = 1;
}

message ListVirtualizationClustergroupRequest {
  api.types.Params params = 1;
}

message ListVirtualizationClustergroupReply {
  int64 total = 1;
  repeated VirtualizationClustergroup virtualizationClustergroups = 2;
}

message DeleteVirtualizationClustergroupByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteVirtualizationClustergroupByIDsReply {

}

message GetVirtualizationClustergroupByConditionRequest {
  types.Conditions conditions = 1;
}

message GetVirtualizationClustergroupByConditionReply {
  VirtualizationClustergroup virtualizationClustergroup = 1;
}

message ListVirtualizationClustergroupByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message ListVirtualizationClustergroupByIDsReply {
  repeated VirtualizationClustergroup virtualizationClustergroups = 1;
}

message ListVirtualizationClustergroupByLastIDRequest {
  uint64 lastID = 1 [(tagger.tags) = "form:\"lastID\""]; // last id
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -id, the - sign indicates descending order.
}

message ListVirtualizationClustergroupByLastIDReply {
