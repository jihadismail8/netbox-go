syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user details by id",
      description: "Gets detailed information of a djangoSession specified by the given id in the path.",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service djangoSession {
  // Create a new djangoSession
  rpc Create(CreateDjangoSessionRequest) returns (CreateDjangoSessionReply) {
    option (google.api.http) = {
      post: "/api/_sessions"
      body: "*"
    };
  }

  // Delete a djangoSession by sessionKey
  rpc DeleteBySessionKey(DeleteDjangoSessionBySessionKeyRequest) returns (DeleteDjangoSessionBySessionKeyReply) {
    option (google.api.http) = {
      delete: "/api/v1/djangoSession/{sessionKey}"
    };
  }

  // Update a djangoSession by sessionKey
  rpc UpdateBySessionKey(UpdateDjangoSessionBySessionKeyRequest) returns (UpdateDjangoSessionBySessionKeyReply) {
    option (google.api.http) = {
      put: "/api/v1/djangoSession/{sessionKey}"
      body: "*"
    };
  }

  // Get a djangoSession by sessionKey
  rpc GetBySessionKey(GetDjangoSessionBySessionKeyRequest) returns (GetDjangoSessionBySessionKeyReply) {
    option (google.api.http) = {
      get: "/api/v1/djangoSession/{sessionKey}"
    };
  }

  // Get a paginated list of djangoSession by custom conditions
  rpc List(ListDjangoSessionRequest) returns (ListDjangoSessionReply) {
    option (google.api.http) = {
      post: "/api/_sessions/list"
      body: "*"
    };
  }

  // Batch delete djangoSession by sessionKey
  rpc DeleteBySessionKeys(DeleteDjangoSessionBySessionKeysRequest) returns (DeleteDjangoSessionBySessionKeysReply) {
    option (google.api.http) = {
      post: "/api/_sessions/delete/ids"
      body: "*"
    };
  }

  // Get a djangoSession by custom conditions
  rpc GetByCondition(GetDjangoSessionByConditionRequest) returns (GetDjangoSessionByConditionReply) {
    option (google.api.http) = {
      post: "/api/_sessions/condition"
      body: "*"
    };
  }

  // Batch get djangoSession by sessionKey
  rpc ListBySessionKeys(ListDjangoSessionBySessionKeysRequest) returns (ListDjangoSessionBySessionKeysReply) {
    option (google.api.http) = {
      post: "/api/_sessions/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of djangoSession by last sessionKey
  rpc ListByLastSessionKey(ListDjangoSessionByLastSessionKeyRequest) returns (ListDjangoSessionByLastSessionKeyReply) {
    option (google.api.http) = {
      get: "/api/_sessions"
    };
  }
}


/*
Notes for defining message fields:
    1. Suggest using camel case style naming for message field names, such as firstName, lastName, etc.
    2. If the message field name ending in 'id', it is recommended to use xxxID naming format, such as userID, orderID, etc.
    3. Add validate rules https://github.com/envoyproxy/protoc-gen-validate#constraint-rules, such as:
        uint64 id = 1 [(validate.rules).uint64.gte  = 1];

If used to generate code that supports the HTTP protocol, notes for defining message fields:
    1. If the route contains the path parameter, such as /api/v1/djangoSession/{id}, the defined
        message must contain the name of the path parameter and the name should be added
        with a new tag, such as int64 id = 1 [(tagger.tags) = "uri:\"id\""];
    2. If the request url is followed by a query parameter, such as /api/v1/getDjangoSession?name=Tom,
        a form tag must be added when defining the query parameter in the message, such as:
        string name = 1 [(tagger.tags) = "form:\"name\""].
    3. When the message fields use snake_case naming (e.g., order_id), the generated swagger.json file
        will use camelCase (e.g., orderId) instead of the expected snake_case. This behavior aligns with
        the JSON tag names used by gRPC, but it can cause the Gin framework to fail to correctly bind and
        retrieve parameter values. There are two ways to resolve this issue:
            (1) Explicitly specify the JSON tag name using the json_name option, such as:
                 string order_id = 1 [json_name = "order_id"];
            (2) If you want to switch to camelCase naming and update the JSON tag name accordingly, such as:
                 string order_id = 1 [json_name = "orderID", (tagger.tags) = "json:\"orderID\""];
*/


message CreateDjangoSessionRequest {
	string sessionKey = 1; 
	string sessionData = 2; 
	string expireDate = 3; 
}

message CreateDjangoSessionReply {
  string sessionKey = 1;
}

message DeleteDjangoSessionBySessionKeyRequest {
  string sessionKey = 1 [(validate.rules).string.min_len = 1, (tagger.tags) = "uri:\"sessionKey\""];
}

message DeleteDjangoSessionBySessionKeyReply {

}

message UpdateDjangoSessionBySessionKeyRequest {
	string sessionKey = 1 [(validate.rules).string.min_len = 1, (tagger.tags) = "uri:\"sessionKey\""]; 
	string sessionData = 2; 
	string expireDate = 3; 
}

message UpdateDjangoSessionBySessionKeyReply {

}

message DjangoSession {
	string sessionKey = 1; 
	string sessionData = 2; 
	string expireDate = 3; 
}

message GetDjangoSessionBySessionKeyRequest {
  string sessionKey = 1 [(validate.rules).string.min_len = 1, (tagger.tags) = "uri:\"sessionKey\""];
}

message GetDjangoSessionBySessionKeyReply {
  DjangoSession djangoSession = 1;
}

message ListDjangoSessionRequest {
  api.types.Params params = 1;
}

message ListDjangoSessionReply {
  int64 total = 1;
  repeated DjangoSession djangoSessions = 2;
}

message DeleteDjangoSessionBySessionKeysRequest {
  repeated string sessionKeys = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteDjangoSessionBySessionKeysReply {

}

message GetDjangoSessionByConditionRequest {
  types.Conditions conditions = 1;
}

message GetDjangoSessionByConditionReply {
  DjangoSession djangoSession = 1;
}

message ListDjangoSessionBySessionKeysRequest {
  repeated string sessionKeys = 1 [(validate.rules).repeated.min_items = 1];
}

message ListDjangoSessionBySessionKeysReply {
  repeated DjangoSession djangoSessions = 1;
}

message ListDjangoSessionByLastSessionKeyRequest {
  string lastSessionKey = 1 [(tagger.tags) = "form:\"lastSessionKey\""];
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -session_key, the - sign indicates descending order.
}

message ListDjangoSessionByLastSessionKeyReply {
  repeated DjangoSession djangoSessions = 1;
}


