syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service dcimVirtualchassis {
  // Create a new dcimVirtualchassis
  rpc Create(CreateDcimVirtualchassisRequest) returns (CreateDcimVirtualchassisReply) {
    option (google.api.http) = {
      post: "/api/dcim/virtualchassis"
      body: "*"
    };
  }

  // Delete a dcimVirtualchassis by id
  rpc DeleteByID(DeleteDcimVirtualchassisByIDRequest) returns (DeleteDcimVirtualchassisByIDReply) {
    option (google.api.http) = {
      delete: "/api/dcim/virtualchassis/{id}"
    };
  }

  // Update a dcimVirtualchassis by id
  rpc UpdateByID(UpdateDcimVirtualchassisByIDRequest) returns (UpdateDcimVirtualchassisByIDReply) {
    option (google.api.http) = {
      put: "/api/dcim/virtualchassis/{id}"
      body: "*"
    };
  }

  // Get a dcimVirtualchassis by id
  rpc GetByID(GetDcimVirtualchassisByIDRequest) returns (GetDcimVirtualchassisByIDReply) {
    option (google.api.http) = {
      get: "/api/dcim/virtualchassis/{id}"
    };
  }

  // Get a paginated list of dcimVirtualchassis by custom conditions
  rpc List(ListDcimVirtualchassisRequest) returns (ListDcimVirtualchassisReply) {
    option (google.api.http) = {
      post: "/api/dcim/virtualchassis/list"
      body: "*"
    };
  }

  // Batch delete dcimVirtualchassis by ids
  rpc DeleteByIDs(DeleteDcimVirtualchassisByIDsRequest) returns (DeleteDcimVirtualchassisByIDsReply) {
    option (google.api.http) = {
      post: "/api/dcim/virtualchassis/delete/ids"
      body: "*"
    };
  }

  // Get a dcimVirtualchassis by custom condition
  rpc GetByCondition(GetDcimVirtualchassisByConditionRequest) returns (GetDcimVirtualchassisByConditionReply) {
    option (google.api.http) = {
      post: "/api/dcim/virtualchassis/condition"
      body: "*"
    };
  }

  // Batch get dcimVirtualchassis by ids
  rpc ListByIDs(ListDcimVirtualchassisByIDsRequest) returns (ListDcimVirtualchassisByIDsReply) {
    option (google.api.http) = {
      post: "/api/dcim/virtualchassis/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of dcimVirtualchassis by last id
  rpc ListByLastID(ListDcimVirtualchassisByLastIDRequest) returns (ListDcimVirtualchassisByLastIDReply) {
    option (google.api.http) = {
      get: "/api/dcim/virtualchassis"
    };
  }
}


