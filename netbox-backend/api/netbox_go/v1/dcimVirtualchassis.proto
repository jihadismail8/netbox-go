message CreateDcimVirtualchassisRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	string name = 4; 
	string domain = 5; 
	int64 masterID = 6; 
	string comments = 7; 
	string description = 8; 
	int64 memberCount = 9; 
}

message CreateDcimVirtualchassisReply {
  uint64 id = 1;
}

message DeleteDcimVirtualchassisByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteDcimVirtualchassisByIDReply {

}

message UpdateDcimVirtualchassisByIDRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	uint64 id = 4 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	string name = 5; 
	string domain = 6; 
	int64 masterID = 7; 
	string comments = 8; 
	string description = 9; 
	int64 memberCount = 10; 
}

message UpdateDcimVirtualchassisByIDReply {

}

message DcimVirtualchassis {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	uint64 id = 4; 
	string name = 5; 
	string domain = 6; 
	int64 masterID = 7; 
	string comments = 8; 
	string description = 9; 
	int64 memberCount = 10; 
}

message GetDcimVirtualchassisByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\"" ];
}

message GetDcimVirtualchassisByIDReply {
  DcimVirtualchassis dcimVirtualchassis = 1;
}

message ListDcimVirtualchassisRequest {
  api.types.Params params = 1;
}

message ListDcimVirtualchassisReply {
  int64 total = 1;
  repeated DcimVirtualchassis dcimVirtualchassiss = 2;
}

message DeleteDcimVirtualchassisByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteDcimVirtualchassisByIDsReply {

}

message GetDcimVirtualchassisByConditionRequest {
  types.Conditions conditions = 1;
}

message GetDcimVirtualchassisByConditionReply {
  DcimVirtualchassis dcimVirtualchassis = 1;
}

message ListDcimVirtualchassisByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message ListDcimVirtualchassisByIDsReply {
  repeated DcimVirtualchassis dcimVirtualchassiss = 1;
}

message ListDcimVirtualchassisByLastIDRequest {
  uint64 lastID = 1 [(tagger.tags) = "form:\"lastID\""]; // last id
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -id, the - sign indicates descending order.
}

message ListDcimVirtualchassisByLastIDReply {
  repeated DcimVirtualchassis dcimVirtualchassiss = 1;
}


