syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service wirelessWirelesslan {
  // Create a new wirelessWirelesslan
  rpc Create(CreateWirelessWirelesslanRequest) returns (CreateWirelessWirelesslanReply) {
    option (google.api.http) = {
      post: "/api/wireless/wirelesslans"
      body: "*"
    };
  }

  // Delete a wirelessWirelesslan by id
  rpc DeleteByID(DeleteWirelessWirelesslanByIDRequest) returns (DeleteWirelessWirelesslanByIDReply) {
    option (google.api.http) = {
      delete: "/api/wireless/wirelesslans/{id}"
    };
  }

  // Update a wirelessWirelesslan by id
  rpc UpdateByID(UpdateWirelessWirelesslanByIDRequest) returns (UpdateWirelessWirelesslanByIDReply) {
    option (google.api.http) = {
      put: "/api/wireless/wirelesslans/{id}"
      body: "*"
    };
  }

  // Get a wirelessWirelesslan by id
  rpc GetByID(GetWirelessWirelesslanByIDRequest) returns (GetWirelessWirelesslanByIDReply) {
    option (google.api.http) = {
      get: "/api/wireless/wirelesslans/{id}"
    };
  }

  // Get a paginated list of wirelessWirelesslan by custom conditions
  rpc List(ListWirelessWirelesslanRequest) returns (ListWirelessWirelesslanReply) {
    option (google.api.http) = {
      post: "/api/wireless/wirelesslans/list"
      body: "*"
    };
  }

  // Batch delete wirelessWirelesslan by ids
  rpc DeleteByIDs(DeleteWirelessWirelesslanByIDsRequest) returns (DeleteWirelessWirelesslanByIDsReply) {
    option (google.api.http) = {
      post: "/api/wireless/wirelesslans/delete/ids"
      body: "*"
    };
  }

  // Get a wirelessWirelesslan by custom condition
  rpc GetByCondition(GetWirelessWirelesslanByConditionRequest) returns (GetWirelessWirelesslanByConditionReply) {
    option (google.api.http) = {
      post: "/api/wireless/wirelesslans/condition"
      body: "*"
    };
  }

  // Batch get wirelessWirelesslan by ids
  rpc ListByIDs(ListWirelessWirelesslanByIDsRequest) returns (ListWirelessWirelesslanByIDsReply) {
    option (google.api.http) = {
      post: "/api/wireless/wirelesslans/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of wirelessWirelesslan by last id
  rpc ListByLastID(ListWirelessWirelesslanByLastIDRequest) returns (ListWirelessWirelesslanByLastIDReply) {
    option (google.api.http) = {
      get: "/api/wireless/wirelesslans"
    };
  }
}


/*
Notes for defining message fields:
    1. Suggest using camel case style naming for message field names, such as firstName, lastName, etc.
    2. If the message field name ending in 'id', it is recommended to use xxxID naming format, such as userID, orderID, etc.
    3. Add validate rules https://github.com/envoyproxy/protoc-gen-validate#constraint-rules, such as:
        uint64 id = 1 [(validate.rules).uint64.gte  = 1];

If used to generate code that supports the HTTP protocol, notes for defining message fields:
    1. If the route contains the path parameter, such as /api/v1/wirelessWirelesslan/{id}, the defined
        message must contain the name of the path parameter and the name should be added
        with a new tag, such as int64 id = 1 [(tagger.tags) = "uri:\"id\""];
    2. If the request url is followed by a query parameter, such as /api/v1/getWirelessWirelesslan?name=Tom,
        a form tag must be added when defining the query parameter in the message, such as:
        string name = 1 [(tagger.tags) = "form:\"name\""].
    3. When the message fields use snake_case naming (e.g., order_id), the generated swagger.json file
        will use camelCase (e.g., orderId) instead of the expected snake_case. This behavior aligns with
        the JSON tag names used by gRPC, but it can cause the Gin framework to fail to correctly bind and
        retrieve parameter values. There are two ways to resolve this issue:
            (1) Explicitly specify the JSON tag name using the json_name option, such as:
                 string order_id = 1 [json_name = "order_id"];
            (2) If you want to switch to camelCase naming and update the JSON tag name accordingly, such as:
                 string order_id = 1 [json_name = "orderID", (tagger.tags) = "json:\"orderID\""];
*/


message CreateWirelessWirelesslanRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	string ssid = 4; 
	int64 groupID = 5; 
	string description = 6; 
	string authCipher = 7; 
	string authPsk = 8; 
	string authType = 9; 
	int64 vlanID = 10; 
	int64 tenantID = 11; 
	string comments = 12; 
	string status = 13; 
	int64 xLocationID = 14; 
	int64 xRegionID = 15; 
	int64 xSiteID = 16; 
	int64 xSiteGroupID = 17; 
	int64 scopeID = 18; 
	int32 scopeTypeID = 19; 
}

message CreateWirelessWirelesslanReply {
  uint64 id = 1;
}

message DeleteWirelessWirelesslanByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteWirelessWirelesslanByIDReply {

}

message UpdateWirelessWirelesslanByIDRequest {
	uint64 id = 1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	string created = 2; 
	string lastUpdated = 3; 
	string customFieldData = 4; 
	string ssid = 5; 
	int64 groupID = 6; 
	string description = 7; 
	string authCipher = 8; 
	string authPsk = 9; 
	string authType = 10; 
	int64 vlanID = 11; 
	int64 tenantID = 12; 
	string comments = 13; 
	string status = 14; 
	int64 xLocationID = 15; 
	int64 xRegionID = 16; 
	int64 xSiteID = 17; 
	int64 xSiteGroupID = 18; 
	int64 scopeID = 19; 
	int32 scopeTypeID = 20; 
}

message UpdateWirelessWirelesslanByIDReply {

}

message WirelessWirelesslan {
	uint64 id = 1; 
	string created = 2; 
	string lastUpdated = 3; 
	string customFieldData = 4; 
	string ssid = 5; 
	int64 groupID = 6; 
	string description = 7; 
	string authCipher = 8; 
	string authPsk = 9; 
	string authType = 10; 
	int64 vlanID = 11; 
	int64 tenantID = 12; 
	string comments = 13; 
	string status = 14; 
	int64 xLocationID = 15; 
	int64 xRegionID = 16; 
	int64 xSiteID = 17; 
	int64 xSiteGroupID = 18; 
	int64 scopeID = 19; 
	int32 scopeTypeID = 20; 
}

message GetWirelessWirelesslanByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\"" ];
}

message GetWirelessWirelesslanByIDReply {
  WirelessWirelesslan wirelessWirelesslan = 1;
}

message ListWirelessWirelesslanRequest {
  api.types.Params params = 1;
}

message ListWirelessWirelesslanReply {
  int64 total = 1;
  repeated WirelessWirelesslan wirelessWirelesslans = 2;
}

message DeleteWirelessWirelesslanByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteWirelessWirelesslanByIDsReply {

}

message GetWirelessWirelesslanByConditionRequest {
  types.Conditions conditions = 1;
}

message GetWirelessWirelesslanByConditionReply {
  WirelessWirelesslan wirelessWirelesslan = 1;
}

message ListWirelessWirelesslanByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message ListWirelessWirelesslanByIDsReply {
  repeated WirelessWirelesslan wirelessWirelesslans = 1;
}

message ListWirelessWirelesslanByLastIDRequest {
  uint64 lastID = 1 [(tagger.tags) = "form:\"lastID\""]; // last id
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -id, the - sign indicates descending order.
}

message ListWirelessWirelesslanByLastIDReply {
  repeated WirelessWirelesslan wirelessWirelesslans = 1;
}


