syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service tenancyContactGroups {
  // Create a new tenancyContactGroups
  rpc Create(CreateTenancyContactGroupsRequest) returns (CreateTenancyContactGroupsReply) {
    option (google.api.http) = {
      post: "/api/tenancy/tenancyContactGroups"
      body: "*"
    };
  }

  // Delete a tenancyContactGroups by id
  rpc DeleteByID(DeleteTenancyContactGroupsByIDRequest) returns (DeleteTenancyContactGroupsByIDReply) {
    option (google.api.http) = {
      delete: "/api/tenancy/tenancyContactGroups/{id}"
    };
  }

  // Update a tenancyContactGroups by id
  rpc UpdateByID(UpdateTenancyContactGroupsByIDRequest) returns (UpdateTenancyContactGroupsByIDReply) {
    option (google.api.http) = {
      put: "/api/tenancy/tenancyContactGroups/{id}"
      body: "*"
    };
  }

  // Get a tenancyContactGroups by id
  rpc GetByID(GetTenancyContactGroupsByIDRequest) returns (GetTenancyContactGroupsByIDReply) {
    option (google.api.http) = {
      get: "/api/tenancy/tenancyContactGroups/{id}"
    };
  }

  // Get a paginated list of tenancyContactGroups by custom conditions
  rpc List(ListTenancyContactGroupsRequest) returns (ListTenancyContactGroupsReply) {
    option (google.api.http) = {
      post: "/api/tenancy/tenancyContactGroups/list"
      body: "*"
    };
  }

  // Batch delete tenancyContactGroups by ids
  rpc DeleteByIDs(DeleteTenancyContactGroupsByIDsRequest) returns (DeleteTenancyContactGroupsByIDsReply) {
    option (google.api.http) = {
      post: "/api/tenancy/tenancyContactGroups/delete/ids"
      body: "*"
    };
  }

  // Get a tenancyContactGroups by custom condition
  rpc GetByCondition(GetTenancyContactGroupsByConditionRequest) returns (GetTenancyContactGroupsByConditionReply) {
    option (google.api.http) = {
      post: "/api/tenancy/tenancyContactGroups/condition"
      body: "*"
    };
  }

  // Batch get tenancyContactGroups by ids
  rpc ListByIDs(ListTenancyContactGroupsByIDsRequest) returns (ListTenancyContactGroupsByIDsReply) {
    option (google.api.http) = {
      post: "/api/tenancy/tenancyContactGroups/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of tenancyContactGroups by last id
  rpc ListByLastID(ListTenancyContactGroupsByLastIDRequest) returns (ListTenancyContactGroupsByLastIDReply) {
    option (google.api.http) = {
      get: "/api/tenancy/tenancyContactGroups"
    };
  }
}


