message CreateTenancyContactGroupsRequest {
	int64 contactID = 1; 
	int64 contactgroupID = 2; 
}

message CreateTenancyContactGroupsReply {
  uint64 id = 1;
}

message DeleteTenancyContactGroupsByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteTenancyContactGroupsByIDReply {

}

message UpdateTenancyContactGroupsByIDRequest {
	uint64 id = 1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	int64 contactID = 2; 
	int64 contactgroupID = 3; 
}

message UpdateTenancyContactGroupsByIDReply {

}

message TenancyContactGroups {
	uint64 id = 1; 
	int64 contactID = 2; 
	int64 contactgroupID = 3; 
}

message GetTenancyContactGroupsByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\"" ];
}

message GetTenancyContactGroupsByIDReply {
  TenancyContactGroups tenancyContactGroups = 1;
}

message ListTenancyContactGroupsRequest {
  api.types.Params params = 1;
}

message ListTenancyContactGroupsReply {
  int64 total = 1;
  repeated TenancyContactGroups tenancyContactGroupss = 2;
}

message DeleteTenancyContactGroupsByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteTenancyContactGroupsByIDsReply {

}

message GetTenancyContactGroupsByConditionRequest {
  types.Conditions conditions = 1;
}

message GetTenancyContactGroupsByConditionReply {
  TenancyContactGroups tenancyContactGroups = 1;
}

message ListTenancyContactGroupsByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message ListTenancyContactGroupsByIDsReply {
  repeated TenancyContactGroups tenancyContactGroupss = 1;
}

message ListTenancyContactGroupsByLastIDRequest {
  uint64 lastID = 1 [(tagger.tags) = "form:\"lastID\""]; // last id
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -id, the - sign indicates descending order.
}

message ListTenancyContactGroupsByLastIDReply {
  repeated TenancyContactGroups tenancyContactGroupss = 1;
}


