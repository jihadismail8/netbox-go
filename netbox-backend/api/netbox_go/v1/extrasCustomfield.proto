            (2) If you want to switch to camelCase naming and update the JSON tag name accordingly, such as:
                 string order_id = 1 [json_name = "orderID", (tagger.tags) = "json:\"orderID\""];
*/


message CreateExtrasCustomfieldRequest {
	string type = 1; 
	string name = 2; 
	string label = 3; 
	string description = 4; 
	bool required = 5; 
	string filterLogic = 6; 
	string default = 7; 
	int32 weight = 8; 
	string validationMinimum = 9; 
	string validationMaximum = 10; 
	string validationRegex = 11; 
	string created = 12; 
	string lastUpdated = 13; 
	int32 relatedObjectTypeID = 14; 
	string groupName = 15; 
	int32 searchWeight = 16; 
	bool isCloneable = 17; 
	int64 choiceSetID = 18; 
	string uiEditable = 19; 
	string uiVisible = 20; 
	string comments = 21; 
	bool unique = 22; 
	string relatedObjectFilter = 23; 
}

message CreateExtrasCustomfieldReply {
  uint64 id = 1;
}

message DeleteExtrasCustomfieldByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteExtrasCustomfieldByIDReply {

}

message UpdateExtrasCustomfieldByIDRequest {
	uint64 id = 1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	string type = 2; 
	string name = 3; 
	string label = 4; 
	string description = 5; 
	bool required = 6; 
	string filterLogic = 7; 
	string default = 8; 
	int32 weight = 9; 
	string validationMinimum = 10; 
	string validationMaximum = 11; 
	string validationRegex = 12; 
	string created = 13; 
	string lastUpdated = 14; 
	int32 relatedObjectTypeID = 15; 
	string groupName = 16; 
	int32 searchWeight = 17; 
	bool isCloneable = 18; 
	int64 choiceSetID = 19; 
	string uiEditable = 20; 
	string uiVisible = 21; 
	string comments = 22; 
	bool unique = 23; 
	string relatedObjectFilter = 24; 
}

message UpdateExtrasCustomfieldByIDReply {

}

message ExtrasCustomfield {
	uint64 id = 1; 
	string type = 2; 
	string name = 3; 
	string label = 4; 
	string description = 5; 
	bool required = 6; 
	string filterLogic = 7; 
	string default = 8; 
	int32 weight = 9; 
	string validationMinimum = 10; 
	string validationMaximum = 11; 
	string validationRegex = 12; 
	string created = 13; 
	string lastUpdated = 14; 
	int32 relatedObjectTypeID = 15; 
	string groupName = 16; 
	int32 searchWeight = 17; 
	bool isCloneable = 18; 
	int64 choiceSetID = 19; 
	string uiEditable = 20; 
	string uiVisible = 21; 
	string comments = 22; 
	bool unique = 23; 
	string relatedObjectFilter = 24; 
}

message GetExtrasCustomfieldByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\"" ];
}

message GetExtrasCustomfieldByIDReply {
  ExtrasCustomfield extrasCustomfield = 1;
}

message ListExtrasCustomfieldRequest {
  api.types.Params params = 1;
}

message ListExtrasCustomfieldReply {
  int64 total = 1;
  repeated ExtrasCustomfield extrasCustomfields = 2;
}

message DeleteExtrasCustomfieldByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteExtrasCustomfieldByIDsReply {

}

message GetExtrasCustomfieldByConditionRequest {
  types.Conditions conditions = 1;
}

message GetExtrasCustomfieldByConditionReply {
  ExtrasCustomfield extrasCustomfield = 1;
}

message ListExtrasCustomfieldByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message ListExtrasCustomfieldByIDsReply {
  repeated ExtrasCustomfield extrasCustomfields = 1;
}

message ListExtrasCustomfieldByLastIDRequest {
  uint64 lastID = 1 [(tagger.tags) = "form:\"lastID\""]; // last id
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -id, the - sign indicates descending order.
}

message ListExtrasCustomfieldByLastIDReply {
  repeated ExtrasCustomfield extrasCustomfields = 1;
}


