syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service dcimPowerpanel {
  // Create a new dcimPowerpanel
  rpc Create(CreateDcimPowerpanelRequest) returns (CreateDcimPowerpanelReply) {
    option (google.api.http) = {
      post: "/api/dcim/powerpanels"
      body: "*"
    };
  }

  // Delete a dcimPowerpanel by id
  rpc DeleteByID(DeleteDcimPowerpanelByIDRequest) returns (DeleteDcimPowerpanelByIDReply) {
    option (google.api.http) = {
      delete: "/api/dcim/powerpanels/{id}"
    };
  }

  // Update a dcimPowerpanel by id
  rpc UpdateByID(UpdateDcimPowerpanelByIDRequest) returns (UpdateDcimPowerpanelByIDReply) {
    option (google.api.http) = {
      put: "/api/dcim/powerpanels/{id}"
      body: "*"
    };
  }

  // Get a dcimPowerpanel by id
  rpc GetByID(GetDcimPowerpanelByIDRequest) returns (GetDcimPowerpanelByIDReply) {
    option (google.api.http) = {
      get: "/api/dcim/powerpanels/{id}"
    };
  }

  // Get a paginated list of dcimPowerpanel by custom conditions
  rpc List(ListDcimPowerpanelRequest) returns (ListDcimPowerpanelReply) {
    option (google.api.http) = {
      post: "/api/dcim/powerpanels/list"
      body: "*"
    };
  }

  // Batch delete dcimPowerpanel by ids
  rpc DeleteByIDs(DeleteDcimPowerpanelByIDsRequest) returns (DeleteDcimPowerpanelByIDsReply) {
    option (google.api.http) = {
      post: "/api/dcim/powerpanels/delete/ids"
      body: "*"
    };
  }

  // Get a dcimPowerpanel by custom condition
  rpc GetByCondition(GetDcimPowerpanelByConditionRequest) returns (GetDcimPowerpanelByConditionReply) {
    option (google.api.http) = {
      post: "/api/dcim/powerpanels/condition"
      body: "*"
    };
  }

  // Batch get dcimPowerpanel by ids
  rpc ListByIDs(ListDcimPowerpanelByIDsRequest) returns (ListDcimPowerpanelByIDsReply) {
    option (google.api.http) = {
      post: "/api/dcim/powerpanels/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of dcimPowerpanel by last id
  rpc ListByLastID(ListDcimPowerpanelByLastIDRequest) returns (ListDcimPowerpanelByLastIDReply) {
    option (google.api.http) = {
      get: "/api/dcim/powerpanels"
    };
  }
}


/*
Notes for defining message fields:
    1. Suggest using camel case style naming for message field names, such as firstName, lastName, etc.
    2. If the message field name ending in 'id', it is recommended to use xxxID naming format, such as userID, orderID, etc.
    3. Add validate rules https://github.com/envoyproxy/protoc-gen-validate#constraint-rules, such as:
        uint64 id = 1 [(validate.rules).uint64.gte  = 1];

If used to generate code that supports the HTTP protocol, notes for defining message fields:
    1. If the route contains the path parameter, such as /api/v1/dcimPowerpanel/{id}, the defined
        message must contain the name of the path parameter and the name should be added
        with a new tag, such as int64 id = 1 [(tagger.tags) = "uri:\"id\""];
    2. If the request url is followed by a query parameter, such as /api/v1/getDcimPowerpanel?name=Tom,
        a form tag must be added when defining the query parameter in the message, such as:
        string name = 1 [(tagger.tags) = "form:\"name\""].
    3. When the message fields use snake_case naming (e.g., order_id), the generated swagger.json file
        will use camelCase (e.g., orderId) instead of the expected snake_case. This behavior aligns with
        the JSON tag names used by gRPC, but it can cause the Gin framework to fail to correctly bind and
        retrieve parameter values. There are two ways to resolve this issue:
            (1) Explicitly specify the JSON tag name using the json_name option, such as:
                 string order_id = 1 [json_name = "order_id"];
            (2) If you want to switch to camelCase naming and update the JSON tag name accordingly, such as:
                 string order_id = 1 [json_name = "orderID", (tagger.tags) = "json:\"orderID\""];
*/


message CreateDcimPowerpanelRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	string name = 4; 
	int64 locationID = 5; 
	int64 siteID = 6; 
	string comments = 7; 
	string description = 8; 
}

message CreateDcimPowerpanelReply {
  uint64 id = 1;
}

message DeleteDcimPowerpanelByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteDcimPowerpanelByIDReply {

}

message UpdateDcimPowerpanelByIDRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	uint64 id = 4 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	string name = 5; 
	int64 locationID = 6; 
	int64 siteID = 7; 
	string comments = 8; 
	string description = 9; 
}

message UpdateDcimPowerpanelByIDReply {

}

message DcimPowerpanel {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	uint64 id = 4; 
	string name = 5; 
	int64 locationID = 6; 
	int64 siteID = 7; 
	string comments = 8; 
	string description = 9; 
}

message GetDcimPowerpanelByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\"" ];
}

message GetDcimPowerpanelByIDReply {
  DcimPowerpanel dcimPowerpanel = 1;
}

message ListDcimPowerpanelRequest {
  api.types.Params params = 1;
}

message ListDcimPowerpanelReply {
  int64 total = 1;
  repeated DcimPowerpanel dcimPowerpanels = 2;
}

message DeleteDcimPowerpanelByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteDcimPowerpanelByIDsReply {

}

message GetDcimPowerpanelByConditionRequest {
  types.Conditions conditions = 1;
}

message GetDcimPowerpanelByConditionReply {
  DcimPowerpanel dcimPowerpanel = 1;
}

message ListDcimPowerpanelByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message ListDcimPowerpanelByIDsReply {
  repeated DcimPowerpanel dcimPowerpanels = 1;
}

message ListDcimPowerpanelByLastIDRequest {
  uint64 lastID = 1 [(tagger.tags) = "form:\"lastID\""]; // last id
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -id, the - sign indicates descending order.
}

message ListDcimPowerpanelByLastIDReply {
  repeated DcimPowerpanel dcimPowerpanels = 1;
}


