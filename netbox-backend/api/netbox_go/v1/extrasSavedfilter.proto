message CreateExtrasSavedfilterRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string name = 3; 
	string slug = 4; 
	string description = 5; 
	int32 weight = 6; 
	bool enabled = 7; 
	bool shared = 8; 
	string parameters = 9; 
	int64 userID = 10; 
}

message CreateExtrasSavedfilterReply {
  uint64 id = 1;
}

message DeleteExtrasSavedfilterByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteExtrasSavedfilterByIDReply {

}

message UpdateExtrasSavedfilterByIDRequest {
	uint64 id = 1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	string created = 2; 
	string lastUpdated = 3; 
	string name = 4; 
	string slug = 5; 
	string description = 6; 
	int32 weight = 7; 
	bool enabled = 8; 
	bool shared = 9; 
	string parameters = 10; 
	int64 userID = 11; 
}

message UpdateExtrasSavedfilterByIDReply {

}

message ExtrasSavedfilter {
	uint64 id = 1; 
	string created = 2; 
	string lastUpdated = 3; 
	string name = 4; 
	string slug = 5; 
	string description = 6; 
	int32 weight = 7; 
	bool enabled = 8; 
	bool shared = 9; 
	string parameters = 10; 
	int64 userID = 11; 
}

message GetExtrasSavedfilterByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\"" ];
}

message GetExtrasSavedfilterByIDReply {
  ExtrasSavedfilter extrasSavedfilter = 1;
}

message ListExtrasSavedfilterRequest {
  api.types.Params params = 1;
}

message ListExtrasSavedfilterReply {
  int64 total = 1;
  repeated ExtrasSavedfilter extrasSavedfilters = 2;
}

message DeleteExtrasSavedfilterByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteExtrasSavedfilterByIDsReply {

}

message GetExtrasSavedfilterByConditionRequest {
  types.Conditions conditions = 1;
}

message GetExtrasSavedfilterByConditionReply {
  ExtrasSavedfilter extrasSavedfilter = 1;
}

message ListExtrasSavedfilterByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message ListExtrasSavedfilterByIDsReply {
  repeated ExtrasSavedfilter extrasSavedfilters = 1;
}

message ListExtrasSavedfilterByLastIDRequest {
  uint64 lastID = 1 [(tagger.tags) = "form:\"lastID\""]; // last id
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -id, the - sign indicates descending order.
}

message ListExtrasSavedfilterByLastIDReply {
  repeated ExtrasSavedfilter extrasSavedfilters = 1;
}


