syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service extrasSavedfilter {
  // Create a new extrasSavedfilter
  rpc Create(CreateExtrasSavedfilterRequest) returns (CreateExtrasSavedfilterReply) {
    option (google.api.http) = {
      post: "/api/extras/savedfilters"
      body: "*"
    };
  }

  // Delete a extrasSavedfilter by id
  rpc DeleteByID(DeleteExtrasSavedfilterByIDRequest) returns (DeleteExtrasSavedfilterByIDReply) {
    option (google.api.http) = {
      delete: "/api/extras/savedfilters/{id}"
    };
  }

  // Update a extrasSavedfilter by id
  rpc UpdateByID(UpdateExtrasSavedfilterByIDRequest) returns (UpdateExtrasSavedfilterByIDReply) {
    option (google.api.http) = {
      put: "/api/extras/savedfilters/{id}"
      body: "*"
    };
  }

  // Get a extrasSavedfilter by id
  rpc GetByID(GetExtrasSavedfilterByIDRequest) returns (GetExtrasSavedfilterByIDReply) {
    option (google.api.http) = {
      get: "/api/extras/savedfilters/{id}"
    };
  }

  // Get a paginated list of extrasSavedfilter by custom conditions
  rpc List(ListExtrasSavedfilterRequest) returns (ListExtrasSavedfilterReply) {
    option (google.api.http) = {
      post: "/api/extras/savedfilters/list"
      body: "*"
    };
  }

  // Batch delete extrasSavedfilter by ids
  rpc DeleteByIDs(DeleteExtrasSavedfilterByIDsRequest) returns (DeleteExtrasSavedfilterByIDsReply) {
    option (google.api.http) = {
      post: "/api/extras/savedfilters/delete/ids"
      body: "*"
    };
  }

  // Get a extrasSavedfilter by custom condition
  rpc GetByCondition(GetExtrasSavedfilterByConditionRequest) returns (GetExtrasSavedfilterByConditionReply) {
    option (google.api.http) = {
      post: "/api/extras/savedfilters/condition"
      body: "*"
    };
  }

  // Batch get extrasSavedfilter by ids
  rpc ListByIDs(ListExtrasSavedfilterByIDsRequest) returns (ListExtrasSavedfilterByIDsReply) {
    option (google.api.http) = {
      post: "/api/extras/savedfilters/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of extrasSavedfilter by last id
  rpc ListByLastID(ListExtrasSavedfilterByLastIDRequest) returns (ListExtrasSavedfilterByLastIDReply) {
    option (google.api.http) = {
      get: "/api/extras/savedfilters"
    };
  }
}


