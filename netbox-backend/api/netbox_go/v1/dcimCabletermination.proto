syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service dcimCabletermination {
  // Create a new dcimCabletermination
  rpc Create(CreateDcimCableterminationRequest) returns (CreateDcimCableterminationReply) {
    option (google.api.http) = {
      post: "/api/dcim/cableterminations"
      body: "*"
    };
  }

  // Delete a dcimCabletermination by id
  rpc DeleteByID(DeleteDcimCableterminationByIDRequest) returns (DeleteDcimCableterminationByIDReply) {
    option (google.api.http) = {
      delete: "/api/dcim/cableterminations/{id}"
    };
  }

  // Update a dcimCabletermination by id
  rpc UpdateByID(UpdateDcimCableterminationByIDRequest) returns (UpdateDcimCableterminationByIDReply) {
    option (google.api.http) = {
      put: "/api/dcim/cableterminations/{id}"
      body: "*"
    };
  }

  // Get a dcimCabletermination by id
  rpc GetByID(GetDcimCableterminationByIDRequest) returns (GetDcimCableterminationByIDReply) {
    option (google.api.http) = {
      get: "/api/dcim/cableterminations/{id}"
    };
  }

  // Get a paginated list of dcimCabletermination by custom conditions
  rpc List(ListDcimCableterminationRequest) returns (ListDcimCableterminationReply) {
    option (google.api.http) = {
      post: "/api/dcim/cableterminations/list"
      body: "*"
    };
  }

  // Batch delete dcimCabletermination by ids
  rpc DeleteByIDs(DeleteDcimCableterminationByIDsRequest) returns (DeleteDcimCableterminationByIDsReply) {
    option (google.api.http) = {
      post: "/api/dcim/cableterminations/delete/ids"
      body: "*"
    };
  }

  // Get a dcimCabletermination by custom condition
  rpc GetByCondition(GetDcimCableterminationByConditionRequest) returns (GetDcimCableterminationByConditionReply) {
    option (google.api.http) = {
      post: "/api/dcim/cableterminations/condition"
      body: "*"
    };
  }

  // Batch get dcimCabletermination by ids
  rpc ListByIDs(ListDcimCableterminationByIDsRequest) returns (ListDcimCableterminationByIDsReply) {
    option (google.api.http) = {
      post: "/api/dcim/cableterminations/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of dcimCabletermination by last id
  rpc ListByLastID(ListDcimCableterminationByLastIDRequest) returns (ListDcimCableterminationByLastIDReply) {
    option (google.api.http) = {
      get: "/api/dcim/cableterminations"
    };
  }
}


