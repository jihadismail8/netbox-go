message CreateDcimCableterminationRequest {
	string cableEnd = 1; 
	int64 terminationID = 2; 
	int64 cableID = 3; 
	int32 terminationTypeID = 4; 
	int64 xDeviceID = 5; 
	int64 xRackID = 6; 
	int64 xLocationID = 7; 
	int64 xSiteID = 8; 
	string created = 9; 
	string lastUpdated = 10; 
}

message CreateDcimCableterminationReply {
  uint64 id = 1;
}

message DeleteDcimCableterminationByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteDcimCableterminationByIDReply {

}

message UpdateDcimCableterminationByIDRequest {
	uint64 id = 1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	string cableEnd = 2; 
	int64 terminationID = 3; 
	int64 cableID = 4; 
	int32 terminationTypeID = 5; 
	int64 xDeviceID = 6; 
	int64 xRackID = 7; 
	int64 xLocationID = 8; 
	int64 xSiteID = 9; 
	string created = 10; 
	string lastUpdated = 11; 
}

message UpdateDcimCableterminationByIDReply {

}

message DcimCabletermination {
	uint64 id = 1; 
	string cableEnd = 2; 
	int64 terminationID = 3; 
	int64 cableID = 4; 
	int32 terminationTypeID = 5; 
	int64 xDeviceID = 6; 
	int64 xRackID = 7; 
	int64 xLocationID = 8; 
	int64 xSiteID = 9; 
	string created = 10; 
	string lastUpdated = 11; 
}

message GetDcimCableterminationByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\"" ];
}

message GetDcimCableterminationByIDReply {
  DcimCabletermination dcimCabletermination = 1;
}

message ListDcimCableterminationRequest {
  api.types.Params params = 1;
}

message ListDcimCableterminationReply {
  int64 total = 1;
  repeated DcimCabletermination dcimCableterminations = 2;
}

message DeleteDcimCableterminationByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteDcimCableterminationByIDsReply {

}

message GetDcimCableterminationByConditionRequest {
