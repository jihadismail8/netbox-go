syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service extrasWebhook {
  // Create a new extrasWebhook
  rpc Create(CreateExtrasWebhookRequest) returns (CreateExtrasWebhookReply) {
    option (google.api.http) = {
      post: "/api/extras/webhooks"
      body: "*"
    };
  }

  // Delete a extrasWebhook by id
  rpc DeleteByID(DeleteExtrasWebhookByIDRequest) returns (DeleteExtrasWebhookByIDReply) {
    option (google.api.http) = {
      delete: "/api/extras/webhooks/{id}"
    };
  }

  // Update a extrasWebhook by id
  rpc UpdateByID(UpdateExtrasWebhookByIDRequest) returns (UpdateExtrasWebhookByIDReply) {
    option (google.api.http) = {
      put: "/api/extras/webhooks/{id}"
      body: "*"
    };
  }

  // Get a extrasWebhook by id
  rpc GetByID(GetExtrasWebhookByIDRequest) returns (GetExtrasWebhookByIDReply) {
    option (google.api.http) = {
      get: "/api/extras/webhooks/{id}"
    };
  }

  // Get a paginated list of extrasWebhook by custom conditions
  rpc List(ListExtrasWebhookRequest) returns (ListExtrasWebhookReply) {
    option (google.api.http) = {
      post: "/api/extras/webhooks/list"
      body: "*"
    };
  }

  // Batch delete extrasWebhook by ids
  rpc DeleteByIDs(DeleteExtrasWebhookByIDsRequest) returns (DeleteExtrasWebhookByIDsReply) {
    option (google.api.http) = {
      post: "/api/extras/webhooks/delete/ids"
      body: "*"
    };
  }

  // Get a extrasWebhook by custom condition
  rpc GetByCondition(GetExtrasWebhookByConditionRequest) returns (GetExtrasWebhookByConditionReply) {
    option (google.api.http) = {
      post: "/api/extras/webhooks/condition"
      body: "*"
    };
  }

  // Batch get extrasWebhook by ids
  rpc ListByIDs(ListExtrasWebhookByIDsRequest) returns (ListExtrasWebhookByIDsReply) {
    option (google.api.http) = {
      post: "/api/extras/webhooks/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of extrasWebhook by last id
  rpc ListByLastID(ListExtrasWebhookByLastIDRequest) returns (ListExtrasWebhookByLastIDReply) {
    option (google.api.http) = {
      get: "/api/extras/webhooks"
    };
  }
}


