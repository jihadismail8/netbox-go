message CreateExtrasWebhookRequest {
	string name = 1; 
	string payloadURL = 2; 
	string httpMethod = 3; 
	string httpContentType = 4; 
	string additionalHeaders = 5; 
	string bodyTemplate = 6; 
	string secret = 7; 
	bool sslVerification = 8; 
	string caFilePath = 9; 
	string created = 10; 
	string lastUpdated = 11; 
	string customFieldData = 12; 
	string description = 13; 
}

message CreateExtrasWebhookReply {
  uint64 id = 1;
}

message DeleteExtrasWebhookByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteExtrasWebhookByIDReply {

}

message UpdateExtrasWebhookByIDRequest {
	uint64 id = 1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	string name = 2; 
	string payloadURL = 3; 
	string httpMethod = 4; 
	string httpContentType = 5; 
	string additionalHeaders = 6; 
	string bodyTemplate = 7; 
	string secret = 8; 
	bool sslVerification = 9; 
	string caFilePath = 10; 
	string created = 11; 
	string lastUpdated = 12; 
	string customFieldData = 13; 
	string description = 14; 
}

message UpdateExtrasWebhookByIDReply {

}

message ExtrasWebhook {
	uint64 id = 1; 
	string name = 2; 
	string payloadURL = 3; 
	string httpMethod = 4; 
	string httpContentType = 5; 
	string additionalHeaders = 6; 
	string bodyTemplate = 7; 
	string secret = 8; 
	bool sslVerification = 9; 
	string caFilePath = 10; 
	string created = 11; 
	string lastUpdated = 12; 
	string customFieldData = 13; 
	string description = 14; 
}

message GetExtrasWebhookByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\"" ];
}

message GetExtrasWebhookByIDReply {
  ExtrasWebhook extrasWebhook = 1;
}

message ListExtrasWebhookRequest {
  api.types.Params params = 1;
}

message ListExtrasWebhookReply {
  int64 total = 1;
  repeated ExtrasWebhook extrasWebhooks = 2;
}

message DeleteExtrasWebhookByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteExtrasWebhookByIDsReply {

}

message GetExtrasWebhookByConditionRequest {
  types.Conditions conditions = 1;
}

message GetExtrasWebhookByConditionReply {
  ExtrasWebhook extrasWebhook = 1;
}

message ListExtrasWebhookByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message ListExtrasWebhookByIDsReply {
  repeated ExtrasWebhook extrasWebhooks = 1;
}

message ListExtrasWebhookByLastIDRequest {
  uint64 lastID = 1 [(tagger.tags) = "form:\"lastID\""]; // last id
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -id, the - sign indicates descending order.
}

message ListExtrasWebhookByLastIDReply {
