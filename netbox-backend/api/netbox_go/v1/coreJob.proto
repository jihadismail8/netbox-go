syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service coreJob {
  // Create a new coreJob
  rpc Create(CreateCoreJobRequest) returns (CreateCoreJobReply) {
    option (google.api.http) = {
      post: "/api/core/jobs"
      body: "*"
    };
  }

  // Delete a coreJob by id
  rpc DeleteByID(DeleteCoreJobByIDRequest) returns (DeleteCoreJobByIDReply) {
    option (google.api.http) = {
      delete: "/api/core/jobs/{id}"
    };
  }

  // Update a coreJob by id
  rpc UpdateByID(UpdateCoreJobByIDRequest) returns (UpdateCoreJobByIDReply) {
    option (google.api.http) = {
      put: "/api/core/jobs/{id}"
      body: "*"
    };
  }

  // Get a coreJob by id
  rpc GetByID(GetCoreJobByIDRequest) returns (GetCoreJobByIDReply) {
    option (google.api.http) = {
      get: "/api/core/jobs/{id}"
    };
  }

  // Get a paginated list of coreJob by custom conditions
  rpc List(ListCoreJobRequest) returns (ListCoreJobReply) {
    option (google.api.http) = {
      post: "/api/core/jobs/list"
      body: "*"
    };
  }

  // Batch delete coreJob by ids
  rpc DeleteByIDs(DeleteCoreJobByIDsRequest) returns (DeleteCoreJobByIDsReply) {
    option (google.api.http) = {
      post: "/api/core/jobs/delete/ids"
      body: "*"
    };
  }

  // Get a coreJob by custom condition
  rpc GetByCondition(GetCoreJobByConditionRequest) returns (GetCoreJobByConditionReply) {
    option (google.api.http) = {
      post: "/api/core/jobs/condition"
      body: "*"
    };
  }

  // Batch get coreJob by ids
  rpc ListByIDs(ListCoreJobByIDsRequest) returns (ListCoreJobByIDsReply) {
    option (google.api.http) = {
      post: "/api/core/jobs/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of coreJob by last id
  rpc ListByLastID(ListCoreJobByLastIDRequest) returns (ListCoreJobByLastIDReply) {
    option (google.api.http) = {
      get: "/api/core/jobs"
    };
  }
}


/*
Notes for defining message fields:
    1. Suggest using camel case style naming for message field names, such as firstName, lastName, etc.
    2. If the message field name ending in 'id', it is recommended to use xxxID naming format, such as userID, orderID, etc.
    3. Add validate rules https://github.com/envoyproxy/protoc-gen-validate#constraint-rules, such as:
        uint64 id = 1 [(validate.rules).uint64.gte  = 1];

If used to generate code that supports the HTTP protocol, notes for defining message fields:
    1. If the route contains the path parameter, such as /api/v1/coreJob/{id}, the defined
        message must contain the name of the path parameter and the name should be added
        with a new tag, such as int64 id = 1 [(tagger.tags) = "uri:\"id\""];
    2. If the request url is followed by a query parameter, such as /api/v1/getCoreJob?name=Tom,
        a form tag must be added when defining the query parameter in the message, such as:
        string name = 1 [(tagger.tags) = "form:\"name\""].
    3. When the message fields use snake_case naming (e.g., order_id), the generated swagger.json file
        will use camelCase (e.g., orderId) instead of the expected snake_case. This behavior aligns with
        the JSON tag names used by gRPC, but it can cause the Gin framework to fail to correctly bind and
        retrieve parameter values. There are two ways to resolve this issue:
            (1) Explicitly specify the JSON tag name using the json_name option, such as:
                 string order_id = 1 [json_name = "order_id"];
            (2) If you want to switch to camelCase naming and update the JSON tag name accordingly, such as:
                 string order_id = 1 [json_name = "orderID", (tagger.tags) = "json:\"orderID\""];
*/


message CreateCoreJobRequest {
	int64 objectID = 1; 
	string name = 2; 
	string created = 3; 
	string scheduled = 4; 
	int32 interval = 5; 
	string started = 6; 
	string completed = 7; 
	string status = 8; 
	string data = 9; 
	string jobID = 10; 
	int32 objectTypeID = 11; 
	int64 userID = 12; 
	string error = 13; 
	string logEntries = 14; 
}

message CreateCoreJobReply {
  uint64 id = 1;
}

message DeleteCoreJobByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteCoreJobByIDReply {

}

message UpdateCoreJobByIDRequest {
	uint64 id = 1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	int64 objectID = 2; 
	string name = 3; 
	string created = 4; 
	string scheduled = 5; 
	int32 interval = 6; 
	string started = 7; 
	string completed = 8; 
	string status = 9; 
	string data = 10; 
	string jobID = 11; 
	int32 objectTypeID = 12; 
	int64 userID = 13; 
	string error = 14; 
	string logEntries = 15; 
}

message UpdateCoreJobByIDReply {

}

message CoreJob {
	uint64 id = 1; 
	int64 objectID = 2; 
	string name = 3; 
	string created = 4; 
	string scheduled = 5; 
	int32 interval = 6; 
	string started = 7; 
	string completed = 8; 
	string status = 9; 
	string data = 10; 
	string jobID = 11; 
	int32 objectTypeID = 12; 
	int64 userID = 13; 
	string error = 14; 
	string logEntries = 15; 
}

message GetCoreJobByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\"" ];
}

message GetCoreJobByIDReply {
  CoreJob coreJob = 1;
}

message ListCoreJobRequest {
  api.types.Params params = 1;
}

message ListCoreJobReply {
  int64 total = 1;
  repeated CoreJob coreJobs = 2;
}

message DeleteCoreJobByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteCoreJobByIDsReply {

}

message GetCoreJobByConditionRequest {
  types.Conditions conditions = 1;
}

message GetCoreJobByConditionReply {
  CoreJob coreJob = 1;
}

message ListCoreJobByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message ListCoreJobByIDsReply {
  repeated CoreJob coreJobs = 1;
}

message ListCoreJobByLastIDRequest {
  uint64 lastID = 1 [(tagger.tags) = "form:\"lastID\""]; // last id
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -id, the - sign indicates descending order.
}

message ListCoreJobByLastIDReply {
  repeated CoreJob coreJobs = 1;
}


