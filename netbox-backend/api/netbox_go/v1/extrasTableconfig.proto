syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service extrasTableconfig {
  // Create a new extrasTableconfig
  rpc Create(CreateExtrasTableconfigRequest) returns (CreateExtrasTableconfigReply) {
    option (google.api.http) = {
      post: "/api/extras/tableconfigs"
      body: "*"
    };
  }

  // Delete a extrasTableconfig by id
  rpc DeleteByID(DeleteExtrasTableconfigByIDRequest) returns (DeleteExtrasTableconfigByIDReply) {
    option (google.api.http) = {
      delete: "/api/extras/tableconfigs/{id}"
    };
  }

  // Update a extrasTableconfig by id
  rpc UpdateByID(UpdateExtrasTableconfigByIDRequest) returns (UpdateExtrasTableconfigByIDReply) {
    option (google.api.http) = {
      put: "/api/extras/tableconfigs/{id}"
      body: "*"
    };
  }

  // Get a extrasTableconfig by id
  rpc GetByID(GetExtrasTableconfigByIDRequest) returns (GetExtrasTableconfigByIDReply) {
    option (google.api.http) = {
      get: "/api/extras/tableconfigs/{id}"
    };
  }

  // Get a paginated list of extrasTableconfig by custom conditions
  rpc List(ListExtrasTableconfigRequest) returns (ListExtrasTableconfigReply) {
    option (google.api.http) = {
      post: "/api/extras/tableconfigs/list"
      body: "*"
    };
  }

  // Batch delete extrasTableconfig by ids
  rpc DeleteByIDs(DeleteExtrasTableconfigByIDsRequest) returns (DeleteExtrasTableconfigByIDsReply) {
    option (google.api.http) = {
      post: "/api/extras/tableconfigs/delete/ids"
      body: "*"
    };
  }

  // Get a extrasTableconfig by custom condition
  rpc GetByCondition(GetExtrasTableconfigByConditionRequest) returns (GetExtrasTableconfigByConditionReply) {
    option (google.api.http) = {
      post: "/api/extras/tableconfigs/condition"
      body: "*"
    };
  }

  // Batch get extrasTableconfig by ids
  rpc ListByIDs(ListExtrasTableconfigByIDsRequest) returns (ListExtrasTableconfigByIDsReply) {
    option (google.api.http) = {
      post: "/api/extras/tableconfigs/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of extrasTableconfig by last id
  rpc ListByLastID(ListExtrasTableconfigByLastIDRequest) returns (ListExtrasTableconfigByLastIDReply) {
    option (google.api.http) = {
      get: "/api/extras/tableconfigs"
    };
  }
}


