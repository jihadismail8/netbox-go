message CreateExtrasTableconfigRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string table = 3; 
	string name = 4; 
	string description = 5; 
	int32 weight = 6; 
	bool enabled = 7; 
	bool shared = 8; 
	string columns = 9; 
	string ordering = 10; 
	int32 objectTypeID = 11; 
	int64 userID = 12; 
}

message CreateExtrasTableconfigReply {
  uint64 id = 1;
}

message DeleteExtrasTableconfigByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteExtrasTableconfigByIDReply {

}

message UpdateExtrasTableconfigByIDRequest {
	uint64 id = 1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	string created = 2; 
	string lastUpdated = 3; 
	string table = 4; 
	string name = 5; 
	string description = 6; 
	int32 weight = 7; 
	bool enabled = 8; 
	bool shared = 9; 
	string columns = 10; 
	string ordering = 11; 
	int32 objectTypeID = 12; 
	int64 userID = 13; 
}

message UpdateExtrasTableconfigByIDReply {

}

message ExtrasTableconfig {
	uint64 id = 1; 
	string created = 2; 
	string lastUpdated = 3; 
	string table = 4; 
	string name = 5; 
	string description = 6; 
	int32 weight = 7; 
	bool enabled = 8; 
	bool shared = 9; 
	string columns = 10; 
	string ordering = 11; 
	int32 objectTypeID = 12; 
	int64 userID = 13; 
}

message GetExtrasTableconfigByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\"" ];
}

message GetExtrasTableconfigByIDReply {
  ExtrasTableconfig extrasTableconfig = 1;
}

message ListExtrasTableconfigRequest {
  api.types.Params params = 1;
}

message ListExtrasTableconfigReply {
  int64 total = 1;
  repeated ExtrasTableconfig extrasTableconfigs = 2;
}

message DeleteExtrasTableconfigByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteExtrasTableconfigByIDsReply {

}

message GetExtrasTableconfigByConditionRequest {
  types.Conditions conditions = 1;
}

message GetExtrasTableconfigByConditionReply {
  ExtrasTableconfig extrasTableconfig = 1;
}

message ListExtrasTableconfigByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message ListExtrasTableconfigByIDsReply {
  repeated ExtrasTableconfig extrasTableconfigs = 1;
}

message ListExtrasTableconfigByLastIDRequest {
  uint64 lastID = 1 [(tagger.tags) = "form:\"lastID\""]; // last id
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -id, the - sign indicates descending order.
