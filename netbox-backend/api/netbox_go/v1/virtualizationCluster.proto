syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service virtualizationCluster {
  // Create a new virtualizationCluster
  rpc Create(CreateVirtualizationClusterRequest) returns (CreateVirtualizationClusterReply) {
    option (google.api.http) = {
      post: "/api/virtualization/clusters"
      body: "*"
    };
  }

  // Delete a virtualizationCluster by id
  rpc DeleteByID(DeleteVirtualizationClusterByIDRequest) returns (DeleteVirtualizationClusterByIDReply) {
    option (google.api.http) = {
      delete: "/api/virtualization/clusters/{id}"
    };
  }

  // Update a virtualizationCluster by id
  rpc UpdateByID(UpdateVirtualizationClusterByIDRequest) returns (UpdateVirtualizationClusterByIDReply) {
    option (google.api.http) = {
      put: "/api/virtualization/clusters/{id}"
      body: "*"
    };
  }

  // Get a virtualizationCluster by id
  rpc GetByID(GetVirtualizationClusterByIDRequest) returns (GetVirtualizationClusterByIDReply) {
    option (google.api.http) = {
      get: "/api/virtualization/clusters/{id}"
    };
  }

  // Get a paginated list of virtualizationCluster by custom conditions
  rpc List(ListVirtualizationClusterRequest) returns (ListVirtualizationClusterReply) {
    option (google.api.http) = {
      post: "/api/virtualization/clusters/list"
      body: "*"
    };
  }

  // Batch delete virtualizationCluster by ids
  rpc DeleteByIDs(DeleteVirtualizationClusterByIDsRequest) returns (DeleteVirtualizationClusterByIDsReply) {
    option (google.api.http) = {
      post: "/api/virtualization/clusters/delete/ids"
      body: "*"
    };
  }

  // Get a virtualizationCluster by custom condition
  rpc GetByCondition(GetVirtualizationClusterByConditionRequest) returns (GetVirtualizationClusterByConditionReply) {
    option (google.api.http) = {
      post: "/api/virtualization/clusters/condition"
      body: "*"
    };
  }

  // Batch get virtualizationCluster by ids
  rpc ListByIDs(ListVirtualizationClusterByIDsRequest) returns (ListVirtualizationClusterByIDsReply) {
    option (google.api.http) = {
      post: "/api/virtualization/clusters/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of virtualizationCluster by last id
  rpc ListByLastID(ListVirtualizationClusterByLastIDRequest) returns (ListVirtualizationClusterByLastIDReply) {
    option (google.api.http) = {
      get: "/api/virtualization/clusters"
    };
  }
}


/*
Notes for defining message fields:
    1. Suggest using camel case style naming for message field names, such as firstName, lastName, etc.
    2. If the message field name ending in 'id', it is recommended to use xxxID naming format, such as userID, orderID, etc.
    3. Add validate rules https://github.com/envoyproxy/protoc-gen-validate#constraint-rules, such as:
        uint64 id = 1 [(validate.rules).uint64.gte  = 1];

If used to generate code that supports the HTTP protocol, notes for defining message fields:
    1. If the route contains the path parameter, such as /api/v1/virtualizationCluster/{id}, the defined
        message must contain the name of the path parameter and the name should be added
        with a new tag, such as int64 id = 1 [(tagger.tags) = "uri:\"id\""];
    2. If the request url is followed by a query parameter, such as /api/v1/getVirtualizationCluster?name=Tom,
        a form tag must be added when defining the query parameter in the message, such as:
        string name = 1 [(tagger.tags) = "form:\"name\""].
    3. When the message fields use snake_case naming (e.g., order_id), the generated swagger.json file
        will use camelCase (e.g., orderId) instead of the expected snake_case. This behavior aligns with
        the JSON tag names used by gRPC, but it can cause the Gin framework to fail to correctly bind and
        retrieve parameter values. There are two ways to resolve this issue:
            (1) Explicitly specify the JSON tag name using the json_name option, such as:
                 string order_id = 1 [json_name = "order_id"];
            (2) If you want to switch to camelCase naming and update the JSON tag name accordingly, such as:
                 string order_id = 1 [json_name = "orderID", (tagger.tags) = "json:\"orderID\""];
*/


message CreateVirtualizationClusterRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	string name = 4; 
	string comments = 5; 
	int64 groupID = 6; 
	int64 tenantID = 7; 
	int64 typeID = 8; 
	string status = 9; 
	string description = 10; 
	int64 scopeID = 11; 
	int32 scopeTypeID = 12; 
	int64 xLocationID = 13; 
	int64 xRegionID = 14; 
	int64 xSiteID = 15; 
	int64 xSiteGroupID = 16; 
}

message CreateVirtualizationClusterReply {
  uint64 id = 1;
}

message DeleteVirtualizationClusterByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteVirtualizationClusterByIDReply {

}

message UpdateVirtualizationClusterByIDRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	uint64 id = 4 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	string name = 5; 
	string comments = 6; 
	int64 groupID = 7; 
	int64 tenantID = 8; 
	int64 typeID = 9; 
	string status = 10; 
	string description = 11; 
	int64 scopeID = 12; 
	int32 scopeTypeID = 13; 
	int64 xLocationID = 14; 
	int64 xRegionID = 15; 
	int64 xSiteID = 16; 
	int64 xSiteGroupID = 17; 
}

message UpdateVirtualizationClusterByIDReply {

}

message VirtualizationCluster {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	uint64 id = 4; 
	string name = 5; 
	string comments = 6; 
	int64 groupID = 7; 
	int64 tenantID = 8; 
	int64 typeID = 9; 
	string status = 10; 
	string description = 11; 
	int64 scopeID = 12; 
	int32 scopeTypeID = 13; 
	int64 xLocationID = 14; 
	int64 xRegionID = 15; 
	int64 xSiteID = 16; 
	int64 xSiteGroupID = 17; 
}

message GetVirtualizationClusterByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\"" ];
}

message GetVirtualizationClusterByIDReply {
  VirtualizationCluster virtualizationCluster = 1;
}

message ListVirtualizationClusterRequest {
  api.types.Params params = 1;
}

message ListVirtualizationClusterReply {
  int64 total = 1;
  repeated VirtualizationCluster virtualizationClusters = 2;
}

message DeleteVirtualizationClusterByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteVirtualizationClusterByIDsReply {

}

message GetVirtualizationClusterByConditionRequest {
  types.Conditions conditions = 1;
}

message GetVirtualizationClusterByConditionReply {
  VirtualizationCluster virtualizationCluster = 1;
}

message ListVirtualizationClusterByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message ListVirtualizationClusterByIDsReply {
  repeated VirtualizationCluster virtualizationClusters = 1;
}

message ListVirtualizationClusterByLastIDRequest {
  uint64 lastID = 1 [(tagger.tags) = "form:\"lastID\""]; // last id
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -id, the - sign indicates descending order.
}

message ListVirtualizationClusterByLastIDReply {
  repeated VirtualizationCluster virtualizationClusters = 1;
}


