syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service dcimModuletype {
  // Create a new dcimModuletype
  rpc Create(CreateDcimModuletypeRequest) returns (CreateDcimModuletypeReply) {
    option (google.api.http) = {
      post: "/api/dcim/moduletypes"
      body: "*"
    };
  }

  // Delete a dcimModuletype by id
  rpc DeleteByID(DeleteDcimModuletypeByIDRequest) returns (DeleteDcimModuletypeByIDReply) {
    option (google.api.http) = {
      delete: "/api/dcim/moduletypes/{id}"
    };
  }

  // Update a dcimModuletype by id
  rpc UpdateByID(UpdateDcimModuletypeByIDRequest) returns (UpdateDcimModuletypeByIDReply) {
    option (google.api.http) = {
      put: "/api/dcim/moduletypes/{id}"
      body: "*"
    };
  }

  // Get a dcimModuletype by id
  rpc GetByID(GetDcimModuletypeByIDRequest) returns (GetDcimModuletypeByIDReply) {
    option (google.api.http) = {
      get: "/api/dcim/moduletypes/{id}"
    };
  }

  // Get a paginated list of dcimModuletype by custom conditions
  rpc List(ListDcimModuletypeRequest) returns (ListDcimModuletypeReply) {
    option (google.api.http) = {
      post: "/api/dcim/moduletypes/list"
      body: "*"
    };
  }

  // Batch delete dcimModuletype by ids
  rpc DeleteByIDs(DeleteDcimModuletypeByIDsRequest) returns (DeleteDcimModuletypeByIDsReply) {
    option (google.api.http) = {
      post: "/api/dcim/moduletypes/delete/ids"
      body: "*"
    };
  }

  // Get a dcimModuletype by custom condition
  rpc GetByCondition(GetDcimModuletypeByConditionRequest) returns (GetDcimModuletypeByConditionReply) {
    option (google.api.http) = {
      post: "/api/dcim/moduletypes/condition"
      body: "*"
    };
  }

  // Batch get dcimModuletype by ids
  rpc ListByIDs(ListDcimModuletypeByIDsRequest) returns (ListDcimModuletypeByIDsReply) {
    option (google.api.http) = {
      post: "/api/dcim/moduletypes/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of dcimModuletype by last id
  rpc ListByLastID(ListDcimModuletypeByLastIDRequest) returns (ListDcimModuletypeByLastIDReply) {
    option (google.api.http) = {
      get: "/api/dcim/moduletypes"
    };
  }
}


