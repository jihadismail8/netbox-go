*/


message CreateDcimModuletypeRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	string model = 4; 
	string partNumber = 5; 
	string comments = 6; 
	int64 manufacturerID = 7; 
	string weight = 8; 
	string weightUnit = 9; 
	int64 xAbsWeight = 10; 
	string description = 11; 
	string airflow = 12; 
	string attributeData = 13; 
	int64 profileID = 14; 
}

message CreateDcimModuletypeReply {
  uint64 id = 1;
}

message DeleteDcimModuletypeByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteDcimModuletypeByIDReply {

}

message UpdateDcimModuletypeByIDRequest {
	uint64 id = 1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	string created = 2; 
	string lastUpdated = 3; 
	string customFieldData = 4; 
	string model = 5; 
	string partNumber = 6; 
	string comments = 7; 
	int64 manufacturerID = 8; 
	string weight = 9; 
	string weightUnit = 10; 
	int64 xAbsWeight = 11; 
	string description = 12; 
	string airflow = 13; 
	string attributeData = 14; 
	int64 profileID = 15; 
}

message UpdateDcimModuletypeByIDReply {

}

message DcimModuletype {
	uint64 id = 1; 
	string created = 2; 
	string lastUpdated = 3; 
	string customFieldData = 4; 
	string model = 5; 
	string partNumber = 6; 
	string comments = 7; 
	int64 manufacturerID = 8; 
	string weight = 9; 
	string weightUnit = 10; 
	int64 xAbsWeight = 11; 
	string description = 12; 
	string airflow = 13; 
	string attributeData = 14; 
	int64 profileID = 15; 
}

message GetDcimModuletypeByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\"" ];
}

message GetDcimModuletypeByIDReply {
  DcimModuletype dcimModuletype = 1;
}

message ListDcimModuletypeRequest {
  api.types.Params params = 1;
}

message ListDcimModuletypeReply {
  int64 total = 1;
  repeated DcimModuletype dcimModuletypes = 2;
}

message DeleteDcimModuletypeByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteDcimModuletypeByIDsReply {

}

message GetDcimModuletypeByConditionRequest {
  types.Conditions conditions = 1;
}

message GetDcimModuletypeByConditionReply {
  DcimModuletype dcimModuletype = 1;
}

message ListDcimModuletypeByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message ListDcimModuletypeByIDsReply {
  repeated DcimModuletype dcimModuletypes = 1;
}

message ListDcimModuletypeByLastIDRequest {
  uint64 lastID = 1 [(tagger.tags) = "form:\"lastID\""]; // last id
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -id, the - sign indicates descending order.
}

message ListDcimModuletypeByLastIDReply {
  repeated DcimModuletype dcimModuletypes = 1;
}


