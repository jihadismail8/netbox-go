    };
  }

  // Update a coreAutosyncrecord by id
  rpc UpdateByID(UpdateCoreAutosyncrecordByIDRequest) returns (UpdateCoreAutosyncrecordByIDReply) {
    option (google.api.http) = {
      put: "/api/core/autosyncrecords/{id}"
      body: "*"
    };
  }

  // Get a coreAutosyncrecord by id
  rpc GetByID(GetCoreAutosyncrecordByIDRequest) returns (GetCoreAutosyncrecordByIDReply) {
    option (google.api.http) = {
      get: "/api/core/autosyncrecords/{id}"
    };
  }

  // Get a paginated list of coreAutosyncrecord by custom conditions
  rpc List(ListCoreAutosyncrecordRequest) returns (ListCoreAutosyncrecordReply) {
    option (google.api.http) = {
      post: "/api/core/autosyncrecords/list"
      body: "*"
    };
  }

  // Batch delete coreAutosyncrecord by ids
  rpc DeleteByIDs(DeleteCoreAutosyncrecordByIDsRequest) returns (DeleteCoreAutosyncrecordByIDsReply) {
    option (google.api.http) = {
      post: "/api/core/autosyncrecords/delete/ids"
      body: "*"
    };
  }

  // Get a coreAutosyncrecord by custom condition
  rpc GetByCondition(GetCoreAutosyncrecordByConditionRequest) returns (GetCoreAutosyncrecordByConditionReply) {
    option (google.api.http) = {
      post: "/api/core/autosyncrecords/condition"
      body: "*"
    };
  }

  // Batch get coreAutosyncrecord by ids
  rpc ListByIDs(ListCoreAutosyncrecordByIDsRequest) returns (ListCoreAutosyncrecordByIDsReply) {
    option (google.api.http) = {
      post: "/api/core/autosyncrecords/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of coreAutosyncrecord by last id
  rpc ListByLastID(ListCoreAutosyncrecordByLastIDRequest) returns (ListCoreAutosyncrecordByLastIDReply) {
    option (google.api.http) = {
      get: "/api/core/autosyncrecords"
    };
  }
}


