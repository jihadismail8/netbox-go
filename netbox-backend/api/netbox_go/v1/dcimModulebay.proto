syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service dcimModulebay {
  // Create a new dcimModulebay
  rpc Create(CreateDcimModulebayRequest) returns (CreateDcimModulebayReply) {
    option (google.api.http) = {
      post: "/api/dcim/modulebays"
      body: "*"
    };
  }

  // Delete a dcimModulebay by id
  rpc DeleteByID(DeleteDcimModulebayByIDRequest) returns (DeleteDcimModulebayByIDReply) {
    option (google.api.http) = {
      delete: "/api/dcim/modulebays/{id}"
    };
  }

  // Update a dcimModulebay by id
  rpc UpdateByID(UpdateDcimModulebayByIDRequest) returns (UpdateDcimModulebayByIDReply) {
    option (google.api.http) = {
      put: "/api/dcim/modulebays/{id}"
      body: "*"
    };
  }

  // Get a dcimModulebay by id
  rpc GetByID(GetDcimModulebayByIDRequest) returns (GetDcimModulebayByIDReply) {
    option (google.api.http) = {
      get: "/api/dcim/modulebays/{id}"
    };
  }

  // Get a paginated list of dcimModulebay by custom conditions
  rpc List(ListDcimModulebayRequest) returns (ListDcimModulebayReply) {
    option (google.api.http) = {
      post: "/api/dcim/modulebays/list"
      body: "*"
    };
  }

  // Batch delete dcimModulebay by ids
  rpc DeleteByIDs(DeleteDcimModulebayByIDsRequest) returns (DeleteDcimModulebayByIDsReply) {
    option (google.api.http) = {
      post: "/api/dcim/modulebays/delete/ids"
      body: "*"
    };
  }

  // Get a dcimModulebay by custom condition
  rpc GetByCondition(GetDcimModulebayByConditionRequest) returns (GetDcimModulebayByConditionReply) {
    option (google.api.http) = {
      post: "/api/dcim/modulebays/condition"
      body: "*"
    };
  }

  // Batch get dcimModulebay by ids
  rpc ListByIDs(ListDcimModulebayByIDsRequest) returns (ListDcimModulebayByIDsReply) {
    option (google.api.http) = {
      post: "/api/dcim/modulebays/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of dcimModulebay by last id
  rpc ListByLastID(ListDcimModulebayByLastIDRequest) returns (ListDcimModulebayByLastIDReply) {
    option (google.api.http) = {
      get: "/api/dcim/modulebays"
    };
  }
}


