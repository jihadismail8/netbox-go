message CreateDcimModulebayRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	string name = 4; 
	string label = 5; 
	string position = 6; 
	string description = 7; 
	int64 deviceID = 8; 
	int32 level = 9; 
	int32 lft = 10; 
	int64 moduleID = 11; 
	int64 parentID = 12; 
	int32 rght = 13; 
	int32 treeID = 14; 
	int64 xLocationID = 15; 
	int64 xRackID = 16; 
	int64 xSiteID = 17; 
}

message CreateDcimModulebayReply {
  uint64 id = 1;
}

message DeleteDcimModulebayByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteDcimModulebayByIDReply {

}

message UpdateDcimModulebayByIDRequest {
	uint64 id = 1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	string created = 2; 
	string lastUpdated = 3; 
	string customFieldData = 4; 
	string name = 5; 
	string label = 6; 
	string position = 7; 
	string description = 8; 
	int64 deviceID = 9; 
	int32 level = 10; 
	int32 lft = 11; 
	int64 moduleID = 12; 
	int64 parentID = 13; 
	int32 rght = 14; 
	int32 treeID = 15; 
	int64 xLocationID = 16; 
	int64 xRackID = 17; 
	int64 xSiteID = 18; 
}

message UpdateDcimModulebayByIDReply {

}

message DcimModulebay {
	uint64 id = 1; 
	string created = 2; 
	string lastUpdated = 3; 
	string customFieldData = 4; 
	string name = 5; 
	string label = 6; 
	string position = 7; 
	string description = 8; 
	int64 deviceID = 9; 
	int32 level = 10; 
	int32 lft = 11; 
	int64 moduleID = 12; 
	int64 parentID = 13; 
	int32 rght = 14; 
	int32 treeID = 15; 
	int64 xLocationID = 16; 
	int64 xRackID = 17; 
	int64 xSiteID = 18; 
}

message GetDcimModulebayByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\"" ];
}

message GetDcimModulebayByIDReply {
  DcimModulebay dcimModulebay = 1;
}

message ListDcimModulebayRequest {
  api.types.Params params = 1;
}

message ListDcimModulebayReply {
  int64 total = 1;
  repeated DcimModulebay dcimModulebays = 2;
}

message DeleteDcimModulebayByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteDcimModulebayByIDsReply {

}

message GetDcimModulebayByConditionRequest {
  types.Conditions conditions = 1;
}

message GetDcimModulebayByConditionReply {
  DcimModulebay dcimModulebay = 1;
}

message ListDcimModulebayByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message ListDcimModulebayByIDsReply {
  repeated DcimModulebay dcimModulebays = 1;
}

message ListDcimModulebayByLastIDRequest {
  uint64 lastID = 1 [(tagger.tags) = "form:\"lastID\""]; // last id
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -id, the - sign indicates descending order.
}

message ListDcimModulebayByLastIDReply {
  repeated DcimModulebay dcimModulebays = 1;
}


