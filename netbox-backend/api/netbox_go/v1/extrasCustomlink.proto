syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service extrasCustomlink {
  // Create a new extrasCustomlink
  rpc Create(CreateExtrasCustomlinkRequest) returns (CreateExtrasCustomlinkReply) {
    option (google.api.http) = {
      post: "/api/extras/customlinks"
      body: "*"
    };
  }

  // Delete a extrasCustomlink by id
  rpc DeleteByID(DeleteExtrasCustomlinkByIDRequest) returns (DeleteExtrasCustomlinkByIDReply) {
    option (google.api.http) = {
      delete: "/api/extras/customlinks/{id}"
    };
  }

  // Update a extrasCustomlink by id
  rpc UpdateByID(UpdateExtrasCustomlinkByIDRequest) returns (UpdateExtrasCustomlinkByIDReply) {
    option (google.api.http) = {
      put: "/api/extras/customlinks/{id}"
      body: "*"
    };
  }

  // Get a extrasCustomlink by id
  rpc GetByID(GetExtrasCustomlinkByIDRequest) returns (GetExtrasCustomlinkByIDReply) {
    option (google.api.http) = {
      get: "/api/extras/customlinks/{id}"
    };
  }

  // Get a paginated list of extrasCustomlink by custom conditions
  rpc List(ListExtrasCustomlinkRequest) returns (ListExtrasCustomlinkReply) {
    option (google.api.http) = {
      post: "/api/extras/customlinks/list"
      body: "*"
    };
  }

  // Batch delete extrasCustomlink by ids
  rpc DeleteByIDs(DeleteExtrasCustomlinkByIDsRequest) returns (DeleteExtrasCustomlinkByIDsReply) {
    option (google.api.http) = {
      post: "/api/extras/customlinks/delete/ids"
      body: "*"
    };
  }

  // Get a extrasCustomlink by custom condition
  rpc GetByCondition(GetExtrasCustomlinkByConditionRequest) returns (GetExtrasCustomlinkByConditionReply) {
    option (google.api.http) = {
      post: "/api/extras/customlinks/condition"
      body: "*"
    };
  }

  // Batch get extrasCustomlink by ids
  rpc ListByIDs(ListExtrasCustomlinkByIDsRequest) returns (ListExtrasCustomlinkByIDsReply) {
    option (google.api.http) = {
      post: "/api/extras/customlinks/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of extrasCustomlink by last id
  rpc ListByLastID(ListExtrasCustomlinkByLastIDRequest) returns (ListExtrasCustomlinkByLastIDReply) {
    option (google.api.http) = {
      get: "/api/extras/customlinks"
    };
  }
}


