message CreateExtrasCustomlinkRequest {
	string name = 1; 
	string linkText = 2; 
	string linkURL = 3; 
	int32 weight = 4; 
	string groupName = 5; 
	string buttonClass = 6; 
	bool newWindow = 7; 
	string created = 8; 
	string lastUpdated = 9; 
	bool enabled = 10; 
}

message CreateExtrasCustomlinkReply {
  uint64 id = 1;
}

message DeleteExtrasCustomlinkByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteExtrasCustomlinkByIDReply {

}

message UpdateExtrasCustomlinkByIDRequest {
	uint64 id = 1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	string name = 2; 
	string linkText = 3; 
	string linkURL = 4; 
	int32 weight = 5; 
	string groupName = 6; 
	string buttonClass = 7; 
	bool newWindow = 8; 
	string created = 9; 
	string lastUpdated = 10; 
	bool enabled = 11; 
}

message UpdateExtrasCustomlinkByIDReply {

}

message ExtrasCustomlink {
	uint64 id = 1; 
	string name = 2; 
	string linkText = 3; 
	string linkURL = 4; 
	int32 weight = 5; 
	string groupName = 6; 
	string buttonClass = 7; 
	bool newWindow = 8; 
	string created = 9; 
	string lastUpdated = 10; 
	bool enabled = 11; 
}

message GetExtrasCustomlinkByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\"" ];
}

message GetExtrasCustomlinkByIDReply {
  ExtrasCustomlink extrasCustomlink = 1;
}

message ListExtrasCustomlinkRequest {
  api.types.Params params = 1;
}

message ListExtrasCustomlinkReply {
  int64 total = 1;
  repeated ExtrasCustomlink extrasCustomlinks = 2;
}

message DeleteExtrasCustomlinkByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteExtrasCustomlinkByIDsReply {

}

message GetExtrasCustomlinkByConditionRequest {
  types.Conditions conditions = 1;
}

message GetExtrasCustomlinkByConditionReply {
  ExtrasCustomlink extrasCustomlink = 1;
}

message ListExtrasCustomlinkByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message ListExtrasCustomlinkByIDsReply {
  repeated ExtrasCustomlink extrasCustomlinks = 1;
}

message ListExtrasCustomlinkByLastIDRequest {
  uint64 lastID = 1 [(tagger.tags) = "form:\"lastID\""]; // last id
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -id, the - sign indicates descending order.
}

message ListExtrasCustomlinkByLastIDReply {
  repeated ExtrasCustomlink extrasCustomlinks = 1;
}


