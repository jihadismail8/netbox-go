syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service circuitsCircuittype {
  // Create a new circuitsCircuittype
  rpc Create(CreateCircuitsCircuittypeRequest) returns (CreateCircuitsCircuittypeReply) {
    option (google.api.http) = {
      post: "/api/circuits/circuittypes"
      body: "*"
    };
  }

  // Delete a circuitsCircuittype by id
  rpc DeleteByID(DeleteCircuitsCircuittypeByIDRequest) returns (DeleteCircuitsCircuittypeByIDReply) {
    option (google.api.http) = {
      delete: "/api/circuits/circuittypes/{id}"
    };
  }

  // Update a circuitsCircuittype by id
  rpc UpdateByID(UpdateCircuitsCircuittypeByIDRequest) returns (UpdateCircuitsCircuittypeByIDReply) {
    option (google.api.http) = {
      put: "/api/circuits/circuittypes/{id}"
      body: "*"
    };
  }

  // Get a circuitsCircuittype by id
  rpc GetByID(GetCircuitsCircuittypeByIDRequest) returns (GetCircuitsCircuittypeByIDReply) {
    option (google.api.http) = {
      get: "/api/circuits/circuittypes/{id}"
    };
  }

  // Get a paginated list of circuitsCircuittype by custom conditions
  rpc List(ListCircuitsCircuittypeRequest) returns (ListCircuitsCircuittypeReply) {
    option (google.api.http) = {
      post: "/api/circuits/circuittypes/list"
      body: "*"
    };
  }

  // Batch delete circuitsCircuittype by ids
  rpc DeleteByIDs(DeleteCircuitsCircuittypeByIDsRequest) returns (DeleteCircuitsCircuittypeByIDsReply) {
    option (google.api.http) = {
      post: "/api/circuits/circuittypes/delete/ids"
      body: "*"
    };
  }

  // Get a circuitsCircuittype by custom condition
  rpc GetByCondition(GetCircuitsCircuittypeByConditionRequest) returns (GetCircuitsCircuittypeByConditionReply) {
    option (google.api.http) = {
      post: "/api/circuits/circuittypes/condition"
      body: "*"
    };
  }

  // Batch get circuitsCircuittype by ids
  rpc ListByIDs(ListCircuitsCircuittypeByIDsRequest) returns (ListCircuitsCircuittypeByIDsReply) {
    option (google.api.http) = {
      post: "/api/circuits/circuittypes/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of circuitsCircuittype by last id
  rpc ListByLastID(ListCircuitsCircuittypeByLastIDRequest) returns (ListCircuitsCircuittypeByLastIDReply) {
    option (google.api.http) = {
      get: "/api/circuits/circuittypes"
    };
  }
}


/*
Notes for defining message fields:
    1. Suggest using camel case style naming for message field names, such as firstName, lastName, etc.
    2. If the message field name ending in 'id', it is recommended to use xxxID naming format, such as userID, orderID, etc.
    3. Add validate rules https://github.com/envoyproxy/protoc-gen-validate#constraint-rules, such as:
        uint64 id = 1 [(validate.rules).uint64.gte  = 1];

If used to generate code that supports the HTTP protocol, notes for defining message fields:
    1. If the route contains the path parameter, such as /api/v1/circuitsCircuittype/{id}, the defined
        message must contain the name of the path parameter and the name should be added
        with a new tag, such as int64 id = 1 [(tagger.tags) = "uri:\"id\""];
    2. If the request url is followed by a query parameter, such as /api/v1/getCircuitsCircuittype?name=Tom,
        a form tag must be added when defining the query parameter in the message, such as:
        string name = 1 [(tagger.tags) = "form:\"name\""].
    3. When the message fields use snake_case naming (e.g., order_id), the generated swagger.json file
