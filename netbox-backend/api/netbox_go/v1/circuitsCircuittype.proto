*/


message CreateCircuitsCircuittypeRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	string name = 4; 
	string slug = 5; 
	string description = 6; 
	string color = 7; 
}

message CreateCircuitsCircuittypeReply {
  uint64 id = 1;
}

message DeleteCircuitsCircuittypeByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteCircuitsCircuittypeByIDReply {

}

message UpdateCircuitsCircuittypeByIDRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	uint64 id = 4 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	string name = 5; 
	string slug = 6; 
	string description = 7; 
	string color = 8; 
}

message UpdateCircuitsCircuittypeByIDReply {

}

message CircuitsCircuittype {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	uint64 id = 4; 
	string name = 5; 
	string slug = 6; 
	string description = 7; 
	string color = 8; 
}

message GetCircuitsCircuittypeByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\"" ];
}

message GetCircuitsCircuittypeByIDReply {
  CircuitsCircuittype circuitsCircuittype = 1;
}

message ListCircuitsCircuittypeRequest {
  api.types.Params params = 1;
}

message ListCircuitsCircuittypeReply {
  int64 total = 1;
  repeated CircuitsCircuittype circuitsCircuittypes = 2;
}

message DeleteCircuitsCircuittypeByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteCircuitsCircuittypeByIDsReply {

}

message GetCircuitsCircuittypeByConditionRequest {
  types.Conditions conditions = 1;
}

message GetCircuitsCircuittypeByConditionReply {
  CircuitsCircuittype circuitsCircuittype = 1;
}

message ListCircuitsCircuittypeByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message ListCircuitsCircuittypeByIDsReply {
  repeated CircuitsCircuittype circuitsCircuittypes = 1;
}

message ListCircuitsCircuittypeByLastIDRequest {
  uint64 lastID = 1 [(tagger.tags) = "form:\"lastID\""]; // last id
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -id, the - sign indicates descending order.
}

message ListCircuitsCircuittypeByLastIDReply {
  repeated CircuitsCircuittype circuitsCircuittypes = 1;
}


