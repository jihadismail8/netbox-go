            (1) Explicitly specify the JSON tag name using the json_name option, such as:
                 string order_id = 1 [json_name = "order_id"];
            (2) If you want to switch to camelCase naming and update the JSON tag name accordingly, such as:
                 string order_id = 1 [json_name = "orderID", (tagger.tags) = "json:\"orderID\""];
*/


message CreateDcimInventoryitemRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	string name = 4; 
	string label = 5; 
	string description = 6; 
	string partID = 7; 
	string serial = 8; 
	string assetTag = 9; 
	bool discovered = 10; 
	int32 lft = 11; 
	int32 rght = 12; 
	int32 treeID = 13; 
	int32 level = 14; 
	int64 deviceID = 15; 
	int64 manufacturerID = 16; 
	int64 parentID = 17; 
	int64 roleID = 18; 
	int64 componentID = 19; 
	int32 componentTypeID = 20; 
	string status = 21; 
	int64 xLocationID = 22; 
	int64 xRackID = 23; 
	int64 xSiteID = 24; 
}

message CreateDcimInventoryitemReply {
  uint64 id = 1;
}

message DeleteDcimInventoryitemByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteDcimInventoryitemByIDReply {

}

message UpdateDcimInventoryitemByIDRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	uint64 id = 4 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	string name = 5; 
	string label = 6; 
	string description = 7; 
	string partID = 8; 
	string serial = 9; 
	string assetTag = 10; 
	bool discovered = 11; 
	int32 lft = 12; 
	int32 rght = 13; 
	int32 treeID = 14; 
	int32 level = 15; 
	int64 deviceID = 16; 
	int64 manufacturerID = 17; 
	int64 parentID = 18; 
	int64 roleID = 19; 
	int64 componentID = 20; 
	int32 componentTypeID = 21; 
	string status = 22; 
	int64 xLocationID = 23; 
	int64 xRackID = 24; 
	int64 xSiteID = 25; 
}

message UpdateDcimInventoryitemByIDReply {

}

message DcimInventoryitem {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	uint64 id = 4; 
	string name = 5; 
	string label = 6; 
	string description = 7; 
	string partID = 8; 
	string serial = 9; 
	string assetTag = 10; 
	bool discovered = 11; 
	int32 lft = 12; 
	int32 rght = 13; 
	int32 treeID = 14; 
	int32 level = 15; 
	int64 deviceID = 16; 
	int64 manufacturerID = 17; 
	int64 parentID = 18; 
	int64 roleID = 19; 
	int64 componentID = 20; 
	int32 componentTypeID = 21; 
	string status = 22; 
	int64 xLocationID = 23; 
	int64 xRackID = 24; 
	int64 xSiteID = 25; 
}

message GetDcimInventoryitemByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\"" ];
}

message GetDcimInventoryitemByIDReply {
  DcimInventoryitem dcimInventoryitem = 1;
}

message ListDcimInventoryitemRequest {
  api.types.Params params = 1;
}

message ListDcimInventoryitemReply {
  int64 total = 1;
  repeated DcimInventoryitem dcimInventoryitems = 2;
}

message DeleteDcimInventoryitemByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteDcimInventoryitemByIDsReply {

}

message GetDcimInventoryitemByConditionRequest {
  types.Conditions conditions = 1;
}

message GetDcimInventoryitemByConditionReply {
  DcimInventoryitem dcimInventoryitem = 1;
}

message ListDcimInventoryitemByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message ListDcimInventoryitemByIDsReply {
  repeated DcimInventoryitem dcimInventoryitems = 1;
}

message ListDcimInventoryitemByLastIDRequest {
  uint64 lastID = 1 [(tagger.tags) = "form:\"lastID\""]; // last id
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -id, the - sign indicates descending order.
}

message ListDcimInventoryitemByLastIDReply {
  repeated DcimInventoryitem dcimInventoryitems = 1;
}


