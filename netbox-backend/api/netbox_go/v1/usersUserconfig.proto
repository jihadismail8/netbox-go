message CreateUsersUserconfigRequest {
	string data = 1; 
	int64 userID = 2; 
}

message CreateUsersUserconfigReply {
  uint64 id = 1;
}

message DeleteUsersUserconfigByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteUsersUserconfigByIDReply {

}

message UpdateUsersUserconfigByIDRequest {
	uint64 id = 1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	string data = 2; 
	int64 userID = 3; 
}

message UpdateUsersUserconfigByIDReply {

}

message UsersUserconfig {
	uint64 id = 1; 
	string data = 2; 
	int64 userID = 3; 
}

message GetUsersUserconfigByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\"" ];
}

message GetUsersUserconfigByIDReply {
  UsersUserconfig usersUserconfig = 1;
}

message ListUsersUserconfigRequest {
  api.types.Params params = 1;
}

message ListUsersUserconfigReply {
  int64 total = 1;
  repeated UsersUserconfig usersUserconfigs = 2;
}

message DeleteUsersUserconfigByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteUsersUserconfigByIDsReply {

}

message GetUsersUserconfigByConditionRequest {
  types.Conditions conditions = 1;
}

message GetUsersUserconfigByConditionReply {
  UsersUserconfig usersUserconfig = 1;
}

message ListUsersUserconfigByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message ListUsersUserconfigByIDsReply {
  repeated UsersUserconfig usersUserconfigs = 1;
}

message ListUsersUserconfigByLastIDRequest {
  uint64 lastID = 1 [(tagger.tags) = "form:\"lastID\""]; // last id
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -id, the - sign indicates descending order.
}

message ListUsersUserconfigByLastIDReply {
  repeated UsersUserconfig usersUserconfigs = 1;
}


