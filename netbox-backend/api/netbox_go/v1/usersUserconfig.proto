syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service usersUserconfig {
  // Create a new usersUserconfig
  rpc Create(CreateUsersUserconfigRequest) returns (CreateUsersUserconfigReply) {
    option (google.api.http) = {
      post: "/api/users/userconfigs"
      body: "*"
    };
  }

  // Delete a usersUserconfig by id
  rpc DeleteByID(DeleteUsersUserconfigByIDRequest) returns (DeleteUsersUserconfigByIDReply) {
    option (google.api.http) = {
      delete: "/api/users/userconfigs/{id}"
    };
  }

  // Update a usersUserconfig by id
  rpc UpdateByID(UpdateUsersUserconfigByIDRequest) returns (UpdateUsersUserconfigByIDReply) {
    option (google.api.http) = {
      put: "/api/users/userconfigs/{id}"
      body: "*"
    };
  }

  // Get a usersUserconfig by id
  rpc GetByID(GetUsersUserconfigByIDRequest) returns (GetUsersUserconfigByIDReply) {
    option (google.api.http) = {
      get: "/api/users/userconfigs/{id}"
    };
  }

  // Get a paginated list of usersUserconfig by custom conditions
  rpc List(ListUsersUserconfigRequest) returns (ListUsersUserconfigReply) {
    option (google.api.http) = {
      post: "/api/users/userconfigs/list"
      body: "*"
    };
  }

  // Batch delete usersUserconfig by ids
  rpc DeleteByIDs(DeleteUsersUserconfigByIDsRequest) returns (DeleteUsersUserconfigByIDsReply) {
    option (google.api.http) = {
      post: "/api/users/userconfigs/delete/ids"
      body: "*"
    };
  }

  // Get a usersUserconfig by custom condition
  rpc GetByCondition(GetUsersUserconfigByConditionRequest) returns (GetUsersUserconfigByConditionReply) {
    option (google.api.http) = {
      post: "/api/users/userconfigs/condition"
      body: "*"
    };
  }

  // Batch get usersUserconfig by ids
  rpc ListByIDs(ListUsersUserconfigByIDsRequest) returns (ListUsersUserconfigByIDsReply) {
    option (google.api.http) = {
      post: "/api/users/userconfigs/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of usersUserconfig by last id
  rpc ListByLastID(ListUsersUserconfigByLastIDRequest) returns (ListUsersUserconfigByLastIDReply) {
    option (google.api.http) = {
      get: "/api/users/userconfigs"
    };
  }
}


