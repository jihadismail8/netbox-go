*/


message CreateIpamRoutetargetRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	string name = 4; 
	string description = 5; 
	int64 tenantID = 6; 
	string comments = 7; 
}

message CreateIpamRoutetargetReply {
  uint64 id = 1;
}

message DeleteIpamRoutetargetByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteIpamRoutetargetByIDReply {

}

message UpdateIpamRoutetargetByIDRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	uint64 id = 4 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	string name = 5; 
	string description = 6; 
	int64 tenantID = 7; 
	string comments = 8; 
}

message UpdateIpamRoutetargetByIDReply {

}

message IpamRoutetarget {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	uint64 id = 4; 
	string name = 5; 
	string description = 6; 
	int64 tenantID = 7; 
	string comments = 8; 
}

message GetIpamRoutetargetByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\"" ];
}

message GetIpamRoutetargetByIDReply {
  IpamRoutetarget ipamRoutetarget = 1;
}

message ListIpamRoutetargetRequest {
  api.types.Params params = 1;
}

message ListIpamRoutetargetReply {
  int64 total = 1;
  repeated IpamRoutetarget ipamRoutetargets = 2;
}

message DeleteIpamRoutetargetByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteIpamRoutetargetByIDsReply {

}

message GetIpamRoutetargetByConditionRequest {
  types.Conditions conditions = 1;
}

message GetIpamRoutetargetByConditionReply {
  IpamRoutetarget ipamRoutetarget = 1;
}

message ListIpamRoutetargetByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message ListIpamRoutetargetByIDsReply {
  repeated IpamRoutetarget ipamRoutetargets = 1;
}

message ListIpamRoutetargetByLastIDRequest {
  uint64 lastID = 1 [(tagger.tags) = "form:\"lastID\""]; // last id
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -id, the - sign indicates descending order.
}

message ListIpamRoutetargetByLastIDReply {
  repeated IpamRoutetarget ipamRoutetargets = 1;
}


