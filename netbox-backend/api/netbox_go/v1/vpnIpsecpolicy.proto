message CreateVpnIpsecpolicyRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	string description = 4; 
	string comments = 5; 
	string name = 6; 
	int32 pfsGroup = 7; 
}

message CreateVpnIpsecpolicyReply {
  uint64 id = 1;
}

message DeleteVpnIpsecpolicyByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteVpnIpsecpolicyByIDReply {

}

message UpdateVpnIpsecpolicyByIDRequest {
	uint64 id = 1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	string created = 2; 
	string lastUpdated = 3; 
	string customFieldData = 4; 
	string description = 5; 
	string comments = 6; 
	string name = 7; 
	int32 pfsGroup = 8; 
}

message UpdateVpnIpsecpolicyByIDReply {

}

message VpnIpsecpolicy {
	uint64 id = 1; 
	string created = 2; 
	string lastUpdated = 3; 
	string customFieldData = 4; 
	string description = 5; 
	string comments = 6; 
	string name = 7; 
	int32 pfsGroup = 8; 
}

message GetVpnIpsecpolicyByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\"" ];
}

message GetVpnIpsecpolicyByIDReply {
  VpnIpsecpolicy vpnIpsecpolicy = 1;
}

message ListVpnIpsecpolicyRequest {
  api.types.Params params = 1;
}

message ListVpnIpsecpolicyReply {
  int64 total = 1;
  repeated VpnIpsecpolicy vpnIpsecpolicys = 2;
}

message DeleteVpnIpsecpolicyByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteVpnIpsecpolicyByIDsReply {

}

message GetVpnIpsecpolicyByConditionRequest {
  types.Conditions conditions = 1;
}

message GetVpnIpsecpolicyByConditionReply {
  VpnIpsecpolicy vpnIpsecpolicy = 1;
}

message ListVpnIpsecpolicyByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message ListVpnIpsecpolicyByIDsReply {
  repeated VpnIpsecpolicy vpnIpsecpolicys = 1;
}

message ListVpnIpsecpolicyByLastIDRequest {
  uint64 lastID = 1 [(tagger.tags) = "form:\"lastID\""]; // last id
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -id, the - sign indicates descending order.
}

message ListVpnIpsecpolicyByLastIDReply {
  repeated VpnIpsecpolicy vpnIpsecpolicys = 1;
}


