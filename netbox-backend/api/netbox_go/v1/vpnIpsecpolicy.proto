syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service vpnIpsecpolicy {
  // Create a new vpnIpsecpolicy
  rpc Create(CreateVpnIpsecpolicyRequest) returns (CreateVpnIpsecpolicyReply) {
    option (google.api.http) = {
      post: "/api/vpn/ipsecpolicys"
      body: "*"
    };
  }

  // Delete a vpnIpsecpolicy by id
  rpc DeleteByID(DeleteVpnIpsecpolicyByIDRequest) returns (DeleteVpnIpsecpolicyByIDReply) {
    option (google.api.http) = {
      delete: "/api/vpn/ipsecpolicys/{id}"
    };
  }

  // Update a vpnIpsecpolicy by id
  rpc UpdateByID(UpdateVpnIpsecpolicyByIDRequest) returns (UpdateVpnIpsecpolicyByIDReply) {
    option (google.api.http) = {
      put: "/api/vpn/ipsecpolicys/{id}"
      body: "*"
    };
  }

  // Get a vpnIpsecpolicy by id
  rpc GetByID(GetVpnIpsecpolicyByIDRequest) returns (GetVpnIpsecpolicyByIDReply) {
    option (google.api.http) = {
      get: "/api/vpn/ipsecpolicys/{id}"
    };
  }

  // Get a paginated list of vpnIpsecpolicy by custom conditions
  rpc List(ListVpnIpsecpolicyRequest) returns (ListVpnIpsecpolicyReply) {
    option (google.api.http) = {
      post: "/api/vpn/ipsecpolicys/list"
      body: "*"
    };
  }

  // Batch delete vpnIpsecpolicy by ids
  rpc DeleteByIDs(DeleteVpnIpsecpolicyByIDsRequest) returns (DeleteVpnIpsecpolicyByIDsReply) {
    option (google.api.http) = {
      post: "/api/vpn/ipsecpolicys/delete/ids"
      body: "*"
    };
  }

  // Get a vpnIpsecpolicy by custom condition
  rpc GetByCondition(GetVpnIpsecpolicyByConditionRequest) returns (GetVpnIpsecpolicyByConditionReply) {
    option (google.api.http) = {
      post: "/api/vpn/ipsecpolicys/condition"
      body: "*"
    };
  }

  // Batch get vpnIpsecpolicy by ids
  rpc ListByIDs(ListVpnIpsecpolicyByIDsRequest) returns (ListVpnIpsecpolicyByIDsReply) {
    option (google.api.http) = {
      post: "/api/vpn/ipsecpolicys/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of vpnIpsecpolicy by last id
  rpc ListByLastID(ListVpnIpsecpolicyByLastIDRequest) returns (ListVpnIpsecpolicyByLastIDReply) {
    option (google.api.http) = {
      get: "/api/vpn/ipsecpolicys"
    };
  }
}


