syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service dcimPoweroutlet {
  // Create a new dcimPoweroutlet
  rpc Create(CreateDcimPoweroutletRequest) returns (CreateDcimPoweroutletReply) {
    option (google.api.http) = {
      post: "/api/dcim/poweroutlets"
      body: "*"
    };
  }

  // Delete a dcimPoweroutlet by id
  rpc DeleteByID(DeleteDcimPoweroutletByIDRequest) returns (DeleteDcimPoweroutletByIDReply) {
    option (google.api.http) = {
      delete: "/api/dcim/poweroutlets/{id}"
    };
  }

  // Update a dcimPoweroutlet by id
  rpc UpdateByID(UpdateDcimPoweroutletByIDRequest) returns (UpdateDcimPoweroutletByIDReply) {
    option (google.api.http) = {
      put: "/api/dcim/poweroutlets/{id}"
      body: "*"
    };
  }

  // Get a dcimPoweroutlet by id
  rpc GetByID(GetDcimPoweroutletByIDRequest) returns (GetDcimPoweroutletByIDReply) {
    option (google.api.http) = {
      get: "/api/dcim/poweroutlets/{id}"
    };
  }

  // Get a paginated list of dcimPoweroutlet by custom conditions
  rpc List(ListDcimPoweroutletRequest) returns (ListDcimPoweroutletReply) {
    option (google.api.http) = {
      post: "/api/dcim/poweroutlets/list"
      body: "*"
    };
  }

  // Batch delete dcimPoweroutlet by ids
  rpc DeleteByIDs(DeleteDcimPoweroutletByIDsRequest) returns (DeleteDcimPoweroutletByIDsReply) {
    option (google.api.http) = {
      post: "/api/dcim/poweroutlets/delete/ids"
      body: "*"
    };
  }

  // Get a dcimPoweroutlet by custom condition
  rpc GetByCondition(GetDcimPoweroutletByConditionRequest) returns (GetDcimPoweroutletByConditionReply) {
    option (google.api.http) = {
      post: "/api/dcim/poweroutlets/condition"
      body: "*"
    };
  }

  // Batch get dcimPoweroutlet by ids
  rpc ListByIDs(ListDcimPoweroutletByIDsRequest) returns (ListDcimPoweroutletByIDsReply) {
    option (google.api.http) = {
      post: "/api/dcim/poweroutlets/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of dcimPoweroutlet by last id
  rpc ListByLastID(ListDcimPoweroutletByLastIDRequest) returns (ListDcimPoweroutletByLastIDReply) {
    option (google.api.http) = {
      get: "/api/dcim/poweroutlets"
    };
  }
}


/*
Notes for defining message fields:
    1. Suggest using camel case style naming for message field names, such as firstName, lastName, etc.
    2. If the message field name ending in 'id', it is recommended to use xxxID naming format, such as userID, orderID, etc.
    3. Add validate rules https://github.com/envoyproxy/protoc-gen-validate#constraint-rules, such as:
        uint64 id = 1 [(validate.rules).uint64.gte  = 1];

If used to generate code that supports the HTTP protocol, notes for defining message fields:
    1. If the route contains the path parameter, such as /api/v1/dcimPoweroutlet/{id}, the defined
        message must contain the name of the path parameter and the name should be added
        with a new tag, such as int64 id = 1 [(tagger.tags) = "uri:\"id\""];
    2. If the request url is followed by a query parameter, such as /api/v1/getDcimPoweroutlet?name=Tom,
        a form tag must be added when defining the query parameter in the message, such as:
        string name = 1 [(tagger.tags) = "form:\"name\""].
    3. When the message fields use snake_case naming (e.g., order_id), the generated swagger.json file
        will use camelCase (e.g., orderId) instead of the expected snake_case. This behavior aligns with
        the JSON tag names used by gRPC, but it can cause the Gin framework to fail to correctly bind and
        retrieve parameter values. There are two ways to resolve this issue:
            (1) Explicitly specify the JSON tag name using the json_name option, such as:
                 string order_id = 1 [json_name = "order_id"];
            (2) If you want to switch to camelCase naming and update the JSON tag name accordingly, such as:
                 string order_id = 1 [json_name = "orderID", (tagger.tags) = "json:\"orderID\""];
*/


message CreateDcimPoweroutletRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	string name = 4; 
	string label = 5; 
	string description = 6; 
	bool markConnected = 7; 
	string type = 8; 
	string feedLeg = 9; 
	int64 xPathID = 10; 
	int64 cableID = 11; 
	int64 deviceID = 12; 
	int64 powerPortID = 13; 
	int64 moduleID = 14; 
	string cableEnd = 15; 
	string color = 16; 
	string status = 17; 
	int64 xLocationID = 18; 
	int64 xRackID = 19; 
	int64 xSiteID = 20; 
}

message CreateDcimPoweroutletReply {
  uint64 id = 1;
}

message DeleteDcimPoweroutletByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteDcimPoweroutletByIDReply {

}

message UpdateDcimPoweroutletByIDRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	uint64 id = 4 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	string name = 5; 
	string label = 6; 
	string description = 7; 
	bool markConnected = 8; 
	string type = 9; 
	string feedLeg = 10; 
	int64 xPathID = 11; 
	int64 cableID = 12; 
	int64 deviceID = 13; 
	int64 powerPortID = 14; 
	int64 moduleID = 15; 
	string cableEnd = 16; 
	string color = 17; 
	string status = 18; 
	int64 xLocationID = 19; 
	int64 xRackID = 20; 
	int64 xSiteID = 21; 
}

message UpdateDcimPoweroutletByIDReply {

}

message DcimPoweroutlet {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	uint64 id = 4; 
	string name = 5; 
	string label = 6; 
	string description = 7; 
	bool markConnected = 8; 
	string type = 9; 
	string feedLeg = 10; 
	int64 xPathID = 11; 
	int64 cableID = 12; 
	int64 deviceID = 13; 
	int64 powerPortID = 14; 
	int64 moduleID = 15; 
	string cableEnd = 16; 
	string color = 17; 
	string status = 18; 
	int64 xLocationID = 19; 
	int64 xRackID = 20; 
	int64 xSiteID = 21; 
}

message GetDcimPoweroutletByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\"" ];
}

message GetDcimPoweroutletByIDReply {
  DcimPoweroutlet dcimPoweroutlet = 1;
}

message ListDcimPoweroutletRequest {
  api.types.Params params = 1;
}

message ListDcimPoweroutletReply {
  int64 total = 1;
  repeated DcimPoweroutlet dcimPoweroutlets = 2;
}

message DeleteDcimPoweroutletByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteDcimPoweroutletByIDsReply {

}

message GetDcimPoweroutletByConditionRequest {
  types.Conditions conditions = 1;
}

message GetDcimPoweroutletByConditionReply {
  DcimPoweroutlet dcimPoweroutlet = 1;
}

message ListDcimPoweroutletByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message ListDcimPoweroutletByIDsReply {
  repeated DcimPoweroutlet dcimPoweroutlets = 1;
}

message ListDcimPoweroutletByLastIDRequest {
  uint64 lastID = 1 [(tagger.tags) = "form:\"lastID\""]; // last id
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -id, the - sign indicates descending order.
}

message ListDcimPoweroutletByLastIDReply {
  repeated DcimPoweroutlet dcimPoweroutlets = 1;
}


