syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service extrasTaggeditem {
  // Create a new extrasTaggeditem
  rpc Create(CreateExtrasTaggeditemRequest) returns (CreateExtrasTaggeditemReply) {
    option (google.api.http) = {
      post: "/api/extras/taggeditems"
      body: "*"
    };
  }

  // Delete a extrasTaggeditem by id
  rpc DeleteByID(DeleteExtrasTaggeditemByIDRequest) returns (DeleteExtrasTaggeditemByIDReply) {
    option (google.api.http) = {
      delete: "/api/extras/taggeditems/{id}"
    };
  }

  // Update a extrasTaggeditem by id
  rpc UpdateByID(UpdateExtrasTaggeditemByIDRequest) returns (UpdateExtrasTaggeditemByIDReply) {
    option (google.api.http) = {
      put: "/api/extras/taggeditems/{id}"
      body: "*"
    };
  }

  // Get a extrasTaggeditem by id
  rpc GetByID(GetExtrasTaggeditemByIDRequest) returns (GetExtrasTaggeditemByIDReply) {
    option (google.api.http) = {
      get: "/api/extras/taggeditems/{id}"
    };
  }

  // Get a paginated list of extrasTaggeditem by custom conditions
  rpc List(ListExtrasTaggeditemRequest) returns (ListExtrasTaggeditemReply) {
    option (google.api.http) = {
      post: "/api/extras/taggeditems/list"
      body: "*"
    };
  }

  // Batch delete extrasTaggeditem by ids
  rpc DeleteByIDs(DeleteExtrasTaggeditemByIDsRequest) returns (DeleteExtrasTaggeditemByIDsReply) {
    option (google.api.http) = {
      post: "/api/extras/taggeditems/delete/ids"
      body: "*"
    };
  }

  // Get a extrasTaggeditem by custom condition
  rpc GetByCondition(GetExtrasTaggeditemByConditionRequest) returns (GetExtrasTaggeditemByConditionReply) {
    option (google.api.http) = {
      post: "/api/extras/taggeditems/condition"
      body: "*"
    };
  }

  // Batch get extrasTaggeditem by ids
  rpc ListByIDs(ListExtrasTaggeditemByIDsRequest) returns (ListExtrasTaggeditemByIDsReply) {
    option (google.api.http) = {
      post: "/api/extras/taggeditems/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of extrasTaggeditem by last id
  rpc ListByLastID(ListExtrasTaggeditemByLastIDRequest) returns (ListExtrasTaggeditemByLastIDReply) {
    option (google.api.http) = {
      get: "/api/extras/taggeditems"
    };
  }
}


/*
Notes for defining message fields:
    1. Suggest using camel case style naming for message field names, such as firstName, lastName, etc.
    2. If the message field name ending in 'id', it is recommended to use xxxID naming format, such as userID, orderID, etc.
    3. Add validate rules https://github.com/envoyproxy/protoc-gen-validate#constraint-rules, such as:
        uint64 id = 1 [(validate.rules).uint64.gte  = 1];

If used to generate code that supports the HTTP protocol, notes for defining message fields:
    1. If the route contains the path parameter, such as /api/v1/extrasTaggeditem/{id}, the defined
        message must contain the name of the path parameter and the name should be added
        with a new tag, such as int64 id = 1 [(tagger.tags) = "uri:\"id\""];
    2. If the request url is followed by a query parameter, such as /api/v1/getExtrasTaggeditem?name=Tom,
        a form tag must be added when defining the query parameter in the message, such as:
        string name = 1 [(tagger.tags) = "form:\"name\""].
    3. When the message fields use snake_case naming (e.g., order_id), the generated swagger.json file
        will use camelCase (e.g., orderId) instead of the expected snake_case. This behavior aligns with
        the JSON tag names used by gRPC, but it can cause the Gin framework to fail to correctly bind and
        retrieve parameter values. There are two ways to resolve this issue:
            (1) Explicitly specify the JSON tag name using the json_name option, such as:
                 string order_id = 1 [json_name = "order_id"];
            (2) If you want to switch to camelCase naming and update the JSON tag name accordingly, such as:
                 string order_id = 1 [json_name = "orderID", (tagger.tags) = "json:\"orderID\""];
*/


message CreateExtrasTaggeditemRequest {
	int32 objectID = 1; 
	int32 contentTypeID = 2; 
	int64 tagID = 3; 
}

message CreateExtrasTaggeditemReply {
  uint64 id = 1;
}

message DeleteExtrasTaggeditemByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteExtrasTaggeditemByIDReply {

}

message UpdateExtrasTaggeditemByIDRequest {
	int32 objectID = 1; 
	uint64 id = 2 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	int32 contentTypeID = 3; 
	int64 tagID = 4; 
}

message UpdateExtrasTaggeditemByIDReply {

}

message ExtrasTaggeditem {
	int32 objectID = 1; 
	uint64 id = 2; 
	int32 contentTypeID = 3; 
	int64 tagID = 4; 
}

message GetExtrasTaggeditemByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\"" ];
}

message GetExtrasTaggeditemByIDReply {
  ExtrasTaggeditem extrasTaggeditem = 1;
}

message ListExtrasTaggeditemRequest {
  api.types.Params params = 1;
}

message ListExtrasTaggeditemReply {
  int64 total = 1;
  repeated ExtrasTaggeditem extrasTaggeditems = 2;
}

message DeleteExtrasTaggeditemByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteExtrasTaggeditemByIDsReply {

}

message GetExtrasTaggeditemByConditionRequest {
  types.Conditions conditions = 1;
}

message GetExtrasTaggeditemByConditionReply {
  ExtrasTaggeditem extrasTaggeditem = 1;
}

message ListExtrasTaggeditemByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message ListExtrasTaggeditemByIDsReply {
  repeated ExtrasTaggeditem extrasTaggeditems = 1;
}

message ListExtrasTaggeditemByLastIDRequest {
  uint64 lastID = 1 [(tagger.tags) = "form:\"lastID\""]; // last id
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -id, the - sign indicates descending order.
}

message ListExtrasTaggeditemByLastIDReply {
  repeated ExtrasTaggeditem extrasTaggeditems = 1;
}


