syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service ipamVlangroup {
  // Create a new ipamVlangroup
  rpc Create(CreateIpamVlangroupRequest) returns (CreateIpamVlangroupReply) {
    option (google.api.http) = {
      post: "/api/ipam/vlangroups"
      body: "*"
    };
  }

  // Delete a ipamVlangroup by id
  rpc DeleteByID(DeleteIpamVlangroupByIDRequest) returns (DeleteIpamVlangroupByIDReply) {
    option (google.api.http) = {
      delete: "/api/ipam/vlangroups/{id}"
    };
  }

  // Update a ipamVlangroup by id
  rpc UpdateByID(UpdateIpamVlangroupByIDRequest) returns (UpdateIpamVlangroupByIDReply) {
    option (google.api.http) = {
      put: "/api/ipam/vlangroups/{id}"
      body: "*"
    };
  }

  // Get a ipamVlangroup by id
  rpc GetByID(GetIpamVlangroupByIDRequest) returns (GetIpamVlangroupByIDReply) {
    option (google.api.http) = {
      get: "/api/ipam/vlangroups/{id}"
    };
  }

  // Get a paginated list of ipamVlangroup by custom conditions
  rpc List(ListIpamVlangroupRequest) returns (ListIpamVlangroupReply) {
    option (google.api.http) = {
      post: "/api/ipam/vlangroups/list"
      body: "*"
    };
  }

  // Batch delete ipamVlangroup by ids
  rpc DeleteByIDs(DeleteIpamVlangroupByIDsRequest) returns (DeleteIpamVlangroupByIDsReply) {
    option (google.api.http) = {
      post: "/api/ipam/vlangroups/delete/ids"
      body: "*"
    };
  }

  // Get a ipamVlangroup by custom condition
  rpc GetByCondition(GetIpamVlangroupByConditionRequest) returns (GetIpamVlangroupByConditionReply) {
    option (google.api.http) = {
      post: "/api/ipam/vlangroups/condition"
      body: "*"
    };
  }

  // Batch get ipamVlangroup by ids
  rpc ListByIDs(ListIpamVlangroupByIDsRequest) returns (ListIpamVlangroupByIDsReply) {
    option (google.api.http) = {
      post: "/api/ipam/vlangroups/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of ipamVlangroup by last id
  rpc ListByLastID(ListIpamVlangroupByLastIDRequest) returns (ListIpamVlangroupByLastIDReply) {
    option (google.api.http) = {
      get: "/api/ipam/vlangroups"
    };
  }
}


