message CreateIpamVlangroupRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	string name = 4; 
	string slug = 5; 
	int64 scopeID = 6; 
	string description = 7; 
	int32 scopeTypeID = 8; 
	string vidRanges = 9; 
	int64 xTotalVlanIds = 10; 
	int64 tenantID = 11; 
}

message CreateIpamVlangroupReply {
  uint64 id = 1;
}

message DeleteIpamVlangroupByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteIpamVlangroupByIDReply {

}

message UpdateIpamVlangroupByIDRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	uint64 id = 4 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	string name = 5; 
	string slug = 6; 
	int64 scopeID = 7; 
	string description = 8; 
	int32 scopeTypeID = 9; 
	string vidRanges = 10; 
	int64 xTotalVlanIds = 11; 
	int64 tenantID = 12; 
}

message UpdateIpamVlangroupByIDReply {

}

message IpamVlangroup {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	uint64 id = 4; 
	string name = 5; 
	string slug = 6; 
	int64 scopeID = 7; 
	string description = 8; 
	int32 scopeTypeID = 9; 
	string vidRanges = 10; 
	int64 xTotalVlanIds = 11; 
	int64 tenantID = 12; 
}

message GetIpamVlangroupByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\"" ];
}

message GetIpamVlangroupByIDReply {
  IpamVlangroup ipamVlangroup = 1;
}

message ListIpamVlangroupRequest {
  api.types.Params params = 1;
}

message ListIpamVlangroupReply {
  int64 total = 1;
  repeated IpamVlangroup ipamVlangroups = 2;
}

message DeleteIpamVlangroupByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteIpamVlangroupByIDsReply {

}

message GetIpamVlangroupByConditionRequest {
  types.Conditions conditions = 1;
}

message GetIpamVlangroupByConditionReply {
  IpamVlangroup ipamVlangroup = 1;
}

message ListIpamVlangroupByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message ListIpamVlangroupByIDsReply {
  repeated IpamVlangroup ipamVlangroups = 1;
}

message ListIpamVlangroupByLastIDRequest {
  uint64 lastID = 1 [(tagger.tags) = "form:\"lastID\""]; // last id
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -id, the - sign indicates descending order.
}

message ListIpamVlangroupByLastIDReply {
  repeated IpamVlangroup ipamVlangroups = 1;
}


