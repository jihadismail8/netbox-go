syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service dcimRearport {
  // Create a new dcimRearport
  rpc Create(CreateDcimRearportRequest) returns (CreateDcimRearportReply) {
    option (google.api.http) = {
      post: "/api/dcim/rearports"
      body: "*"
    };
  }

  // Delete a dcimRearport by id
  rpc DeleteByID(DeleteDcimRearportByIDRequest) returns (DeleteDcimRearportByIDReply) {
    option (google.api.http) = {
      delete: "/api/dcim/rearports/{id}"
    };
  }

  // Update a dcimRearport by id
  rpc UpdateByID(UpdateDcimRearportByIDRequest) returns (UpdateDcimRearportByIDReply) {
    option (google.api.http) = {
      put: "/api/dcim/rearports/{id}"
      body: "*"
    };
  }

  // Get a dcimRearport by id
  rpc GetByID(GetDcimRearportByIDRequest) returns (GetDcimRearportByIDReply) {
    option (google.api.http) = {
      get: "/api/dcim/rearports/{id}"
    };
  }

  // Get a paginated list of dcimRearport by custom conditions
  rpc List(ListDcimRearportRequest) returns (ListDcimRearportReply) {
    option (google.api.http) = {
      post: "/api/dcim/rearports/list"
      body: "*"
    };
  }

  // Batch delete dcimRearport by ids
  rpc DeleteByIDs(DeleteDcimRearportByIDsRequest) returns (DeleteDcimRearportByIDsReply) {
    option (google.api.http) = {
      post: "/api/dcim/rearports/delete/ids"
      body: "*"
    };
  }

  // Get a dcimRearport by custom condition
  rpc GetByCondition(GetDcimRearportByConditionRequest) returns (GetDcimRearportByConditionReply) {
    option (google.api.http) = {
      post: "/api/dcim/rearports/condition"
      body: "*"
    };
  }

  // Batch get dcimRearport by ids
  rpc ListByIDs(ListDcimRearportByIDsRequest) returns (ListDcimRearportByIDsReply) {
    option (google.api.http) = {
      post: "/api/dcim/rearports/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of dcimRearport by last id
  rpc ListByLastID(ListDcimRearportByLastIDRequest) returns (ListDcimRearportByLastIDReply) {
    option (google.api.http) = {
      get: "/api/dcim/rearports"
    };
  }
}


/*
Notes for defining message fields:
    1. Suggest using camel case style naming for message field names, such as firstName, lastName, etc.
    2. If the message field name ending in 'id', it is recommended to use xxxID naming format, such as userID, orderID, etc.
    3. Add validate rules https://github.com/envoyproxy/protoc-gen-validate#constraint-rules, such as:
        uint64 id = 1 [(validate.rules).uint64.gte  = 1];

If used to generate code that supports the HTTP protocol, notes for defining message fields:
    1. If the route contains the path parameter, such as /api/v1/dcimRearport/{id}, the defined
        message must contain the name of the path parameter and the name should be added
        with a new tag, such as int64 id = 1 [(tagger.tags) = "uri:\"id\""];
    2. If the request url is followed by a query parameter, such as /api/v1/getDcimRearport?name=Tom,
        a form tag must be added when defining the query parameter in the message, such as:
        string name = 1 [(tagger.tags) = "form:\"name\""].
    3. When the message fields use snake_case naming (e.g., order_id), the generated swagger.json file
        will use camelCase (e.g., orderId) instead of the expected snake_case. This behavior aligns with
        the JSON tag names used by gRPC, but it can cause the Gin framework to fail to correctly bind and
        retrieve parameter values. There are two ways to resolve this issue:
            (1) Explicitly specify the JSON tag name using the json_name option, such as:
                 string order_id = 1 [json_name = "order_id"];
            (2) If you want to switch to camelCase naming and update the JSON tag name accordingly, such as:
                 string order_id = 1 [json_name = "orderID", (tagger.tags) = "json:\"orderID\""];
*/


message CreateDcimRearportRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	string name = 4; 
	string label = 5; 
	string description = 6; 
	bool markConnected = 7; 
	string type = 8; 
	int32 positions = 9; 
	int64 cableID = 10; 
	int64 deviceID = 11; 
	string color = 12; 
	int64 moduleID = 13; 
	string cableEnd = 14; 
	int64 xLocationID = 15; 
	int64 xRackID = 16; 
	int64 xSiteID = 17; 
}

message CreateDcimRearportReply {
  uint64 id = 1;
}

message DeleteDcimRearportByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteDcimRearportByIDReply {

}

message UpdateDcimRearportByIDRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	uint64 id = 4 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	string name = 5; 
	string label = 6; 
	string description = 7; 
	bool markConnected = 8; 
	string type = 9; 
	int32 positions = 10; 
	int64 cableID = 11; 
	int64 deviceID = 12; 
	string color = 13; 
	int64 moduleID = 14; 
	string cableEnd = 15; 
	int64 xLocationID = 16; 
	int64 xRackID = 17; 
	int64 xSiteID = 18; 
}

message UpdateDcimRearportByIDReply {

}

message DcimRearport {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	uint64 id = 4; 
	string name = 5; 
	string label = 6; 
	string description = 7; 
	bool markConnected = 8; 
	string type = 9; 
	int32 positions = 10; 
	int64 cableID = 11; 
	int64 deviceID = 12; 
	string color = 13; 
	int64 moduleID = 14; 
	string cableEnd = 15; 
	int64 xLocationID = 16; 
	int64 xRackID = 17; 
	int64 xSiteID = 18; 
}

message GetDcimRearportByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\"" ];
}

message GetDcimRearportByIDReply {
  DcimRearport dcimRearport = 1;
}

message ListDcimRearportRequest {
  api.types.Params params = 1;
}

message ListDcimRearportReply {
  int64 total = 1;
  repeated DcimRearport dcimRearports = 2;
}

message DeleteDcimRearportByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteDcimRearportByIDsReply {

}

message GetDcimRearportByConditionRequest {
  types.Conditions conditions = 1;
}

message GetDcimRearportByConditionReply {
  DcimRearport dcimRearport = 1;
}

message ListDcimRearportByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message ListDcimRearportByIDsReply {
  repeated DcimRearport dcimRearports = 1;
}

message ListDcimRearportByLastIDRequest {
  uint64 lastID = 1 [(tagger.tags) = "form:\"lastID\""]; // last id
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -id, the - sign indicates descending order.
}

message ListDcimRearportByLastIDReply {
  repeated DcimRearport dcimRearports = 1;
}


