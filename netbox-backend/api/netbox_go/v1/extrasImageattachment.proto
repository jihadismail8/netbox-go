syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service extrasImageattachment {
  // Create a new extrasImageattachment
  rpc Create(CreateExtrasImageattachmentRequest) returns (CreateExtrasImageattachmentReply) {
    option (google.api.http) = {
      post: "/api/extras/imageattachments"
      body: "*"
    };
  }

  // Delete a extrasImageattachment by id
  rpc DeleteByID(DeleteExtrasImageattachmentByIDRequest) returns (DeleteExtrasImageattachmentByIDReply) {
    option (google.api.http) = {
      delete: "/api/extras/imageattachments/{id}"
    };
  }

  // Update a extrasImageattachment by id
  rpc UpdateByID(UpdateExtrasImageattachmentByIDRequest) returns (UpdateExtrasImageattachmentByIDReply) {
    option (google.api.http) = {
      put: "/api/extras/imageattachments/{id}"
      body: "*"
    };
  }

  // Get a extrasImageattachment by id
  rpc GetByID(GetExtrasImageattachmentByIDRequest) returns (GetExtrasImageattachmentByIDReply) {
    option (google.api.http) = {
      get: "/api/extras/imageattachments/{id}"
    };
  }

  // Get a paginated list of extrasImageattachment by custom conditions
  rpc List(ListExtrasImageattachmentRequest) returns (ListExtrasImageattachmentReply) {
    option (google.api.http) = {
      post: "/api/extras/imageattachments/list"
      body: "*"
    };
  }

  // Batch delete extrasImageattachment by ids
  rpc DeleteByIDs(DeleteExtrasImageattachmentByIDsRequest) returns (DeleteExtrasImageattachmentByIDsReply) {
    option (google.api.http) = {
      post: "/api/extras/imageattachments/delete/ids"
      body: "*"
    };
  }

  // Get a extrasImageattachment by custom condition
  rpc GetByCondition(GetExtrasImageattachmentByConditionRequest) returns (GetExtrasImageattachmentByConditionReply) {
    option (google.api.http) = {
      post: "/api/extras/imageattachments/condition"
      body: "*"
    };
  }

  // Batch get extrasImageattachment by ids
  rpc ListByIDs(ListExtrasImageattachmentByIDsRequest) returns (ListExtrasImageattachmentByIDsReply) {
    option (google.api.http) = {
      post: "/api/extras/imageattachments/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of extrasImageattachment by last id
  rpc ListByLastID(ListExtrasImageattachmentByLastIDRequest) returns (ListExtrasImageattachmentByLastIDReply) {
    option (google.api.http) = {
      get: "/api/extras/imageattachments"
    };
  }
}


