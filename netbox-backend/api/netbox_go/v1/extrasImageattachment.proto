}

message DeleteExtrasImageattachmentByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteExtrasImageattachmentByIDsReply {

}

message GetExtrasImageattachmentByConditionRequest {
  types.Conditions conditions = 1;
}

message GetExtrasImageattachmentByConditionReply {
  ExtrasImageattachment extrasImageattachment = 1;
}

message ListExtrasImageattachmentByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message ListExtrasImageattachmentByIDsReply {
  repeated ExtrasImageattachment extrasImageattachments = 1;
}

message ListExtrasImageattachmentByLastIDRequest {
  uint64 lastID = 1 [(tagger.tags) = "form:\"lastID\""]; // last id
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -id, the - sign indicates descending order.
