message CreateExtrasImageattachmentRequest {
	int64 objectID = 1; 
	string image = 2; 
	int32 imageHeight = 3; 
	int32 imageWidth = 4; 
	string name = 5; 
	string created = 6; 
	int32 objectTypeID = 7; 
	string lastUpdated = 8; 
	string description = 9; 
}

message CreateExtrasImageattachmentReply {
  uint64 id = 1;
}

message DeleteExtrasImageattachmentByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteExtrasImageattachmentByIDReply {

}

message UpdateExtrasImageattachmentByIDRequest {
	uint64 id = 1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	int64 objectID = 2; 
	string image = 3; 
	int32 imageHeight = 4; 
	int32 imageWidth = 5; 
	string name = 6; 
	string created = 7; 
	int32 objectTypeID = 8; 
	string lastUpdated = 9; 
	string description = 10; 
}

message UpdateExtrasImageattachmentByIDReply {

}

message ExtrasImageattachment {
	uint64 id = 1; 
	int64 objectID = 2; 
	string image = 3; 
	int32 imageHeight = 4; 
	int32 imageWidth = 5; 
	string name = 6; 
	string created = 7; 
	int32 objectTypeID = 8; 
	string lastUpdated = 9; 
