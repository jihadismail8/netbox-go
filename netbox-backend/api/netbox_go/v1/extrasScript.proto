syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service extrasScript {
  // Create a new extrasScript
  rpc Create(CreateExtrasScriptRequest) returns (CreateExtrasScriptReply) {
    option (google.api.http) = {
      post: "/api/extras/scripts"
      body: "*"
    };
  }

  // Delete a extrasScript by id
  rpc DeleteByID(DeleteExtrasScriptByIDRequest) returns (DeleteExtrasScriptByIDReply) {
    option (google.api.http) = {
      delete: "/api/extras/scripts/{id}"
    };
  }

  // Update a extrasScript by id
  rpc UpdateByID(UpdateExtrasScriptByIDRequest) returns (UpdateExtrasScriptByIDReply) {
    option (google.api.http) = {
      put: "/api/extras/scripts/{id}"
      body: "*"
    };
  }

  // Get a extrasScript by id
  rpc GetByID(GetExtrasScriptByIDRequest) returns (GetExtrasScriptByIDReply) {
    option (google.api.http) = {
      get: "/api/extras/scripts/{id}"
    };
  }

  // Get a paginated list of extrasScript by custom conditions
  rpc List(ListExtrasScriptRequest) returns (ListExtrasScriptReply) {
    option (google.api.http) = {
      post: "/api/extras/scripts/list"
      body: "*"
    };
  }

  // Batch delete extrasScript by ids
  rpc DeleteByIDs(DeleteExtrasScriptByIDsRequest) returns (DeleteExtrasScriptByIDsReply) {
    option (google.api.http) = {
      post: "/api/extras/scripts/delete/ids"
      body: "*"
    };
  }

  // Get a extrasScript by custom condition
  rpc GetByCondition(GetExtrasScriptByConditionRequest) returns (GetExtrasScriptByConditionReply) {
    option (google.api.http) = {
      post: "/api/extras/scripts/condition"
      body: "*"
    };
  }

  // Batch get extrasScript by ids
  rpc ListByIDs(ListExtrasScriptByIDsRequest) returns (ListExtrasScriptByIDsReply) {
    option (google.api.http) = {
      post: "/api/extras/scripts/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of extrasScript by last id
  rpc ListByLastID(ListExtrasScriptByLastIDRequest) returns (ListExtrasScriptByLastIDReply) {
    option (google.api.http) = {
      get: "/api/extras/scripts"
    };
  }
}


/*
Notes for defining message fields:
    1. Suggest using camel case style naming for message field names, such as firstName, lastName, etc.
    2. If the message field name ending in 'id', it is recommended to use xxxID naming format, such as userID, orderID, etc.
    3. Add validate rules https://github.com/envoyproxy/protoc-gen-validate#constraint-rules, such as:
        uint64 id = 1 [(validate.rules).uint64.gte  = 1];

If used to generate code that supports the HTTP protocol, notes for defining message fields:
    1. If the route contains the path parameter, such as /api/v1/extrasScript/{id}, the defined
        message must contain the name of the path parameter and the name should be added
        with a new tag, such as int64 id = 1 [(tagger.tags) = "uri:\"id\""];
    2. If the request url is followed by a query parameter, such as /api/v1/getExtrasScript?name=Tom,
        a form tag must be added when defining the query parameter in the message, such as:
        string name = 1 [(tagger.tags) = "form:\"name\""].
    3. When the message fields use snake_case naming (e.g., order_id), the generated swagger.json file
        will use camelCase (e.g., orderId) instead of the expected snake_case. This behavior aligns with
        the JSON tag names used by gRPC, but it can cause the Gin framework to fail to correctly bind and
        retrieve parameter values. There are two ways to resolve this issue:
            (1) Explicitly specify the JSON tag name using the json_name option, such as:
                 string order_id = 1 [json_name = "order_id"];
            (2) If you want to switch to camelCase naming and update the JSON tag name accordingly, such as:
                 string order_id = 1 [json_name = "orderID", (tagger.tags) = "json:\"orderID\""];
*/


message CreateExtrasScriptRequest {
	string name = 1; 
	int64 moduleID = 2; 
	bool isExecutable = 3; 
}

message CreateExtrasScriptReply {
  uint64 id = 1;
}

message DeleteExtrasScriptByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteExtrasScriptByIDReply {

}

message UpdateExtrasScriptByIDRequest {
	uint64 id = 1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	string name = 2; 
	int64 moduleID = 3; 
	bool isExecutable = 4; 
}

message UpdateExtrasScriptByIDReply {

}

message ExtrasScript {
	uint64 id = 1; 
	string name = 2; 
	int64 moduleID = 3; 
	bool isExecutable = 4; 
}

message GetExtrasScriptByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\"" ];
}

message GetExtrasScriptByIDReply {
  ExtrasScript extrasScript = 1;
}

message ListExtrasScriptRequest {
  api.types.Params params = 1;
}

message ListExtrasScriptReply {
  int64 total = 1;
  repeated ExtrasScript extrasScripts = 2;
}

message DeleteExtrasScriptByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteExtrasScriptByIDsReply {

}

message GetExtrasScriptByConditionRequest {
  types.Conditions conditions = 1;
}

message GetExtrasScriptByConditionReply {
  ExtrasScript extrasScript = 1;
}

message ListExtrasScriptByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message ListExtrasScriptByIDsReply {
  repeated ExtrasScript extrasScripts = 1;
}

message ListExtrasScriptByLastIDRequest {
  uint64 lastID = 1 [(tagger.tags) = "form:\"lastID\""]; // last id
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -id, the - sign indicates descending order.
}

message ListExtrasScriptByLastIDReply {
  repeated ExtrasScript extrasScripts = 1;
}


