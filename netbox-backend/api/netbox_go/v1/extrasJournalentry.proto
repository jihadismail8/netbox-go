syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service extrasJournalentry {
  // Create a new extrasJournalentry
  rpc Create(CreateExtrasJournalentryRequest) returns (CreateExtrasJournalentryReply) {
    option (google.api.http) = {
      post: "/api/extras/journalentrys"
      body: "*"
    };
  }

  // Delete a extrasJournalentry by id
  rpc DeleteByID(DeleteExtrasJournalentryByIDRequest) returns (DeleteExtrasJournalentryByIDReply) {
    option (google.api.http) = {
      delete: "/api/extras/journalentrys/{id}"
    };
  }

  // Update a extrasJournalentry by id
  rpc UpdateByID(UpdateExtrasJournalentryByIDRequest) returns (UpdateExtrasJournalentryByIDReply) {
    option (google.api.http) = {
      put: "/api/extras/journalentrys/{id}"
      body: "*"
    };
  }

  // Get a extrasJournalentry by id
  rpc GetByID(GetExtrasJournalentryByIDRequest) returns (GetExtrasJournalentryByIDReply) {
    option (google.api.http) = {
      get: "/api/extras/journalentrys/{id}"
    };
  }

  // Get a paginated list of extrasJournalentry by custom conditions
  rpc List(ListExtrasJournalentryRequest) returns (ListExtrasJournalentryReply) {
    option (google.api.http) = {
      post: "/api/extras/journalentrys/list"
      body: "*"
    };
  }

  // Batch delete extrasJournalentry by ids
  rpc DeleteByIDs(DeleteExtrasJournalentryByIDsRequest) returns (DeleteExtrasJournalentryByIDsReply) {
    option (google.api.http) = {
      post: "/api/extras/journalentrys/delete/ids"
      body: "*"
    };
  }

  // Get a extrasJournalentry by custom condition
  rpc GetByCondition(GetExtrasJournalentryByConditionRequest) returns (GetExtrasJournalentryByConditionReply) {
    option (google.api.http) = {
      post: "/api/extras/journalentrys/condition"
      body: "*"
    };
  }

  // Batch get extrasJournalentry by ids
  rpc ListByIDs(ListExtrasJournalentryByIDsRequest) returns (ListExtrasJournalentryByIDsReply) {
    option (google.api.http) = {
      post: "/api/extras/journalentrys/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of extrasJournalentry by last id
  rpc ListByLastID(ListExtrasJournalentryByLastIDRequest) returns (ListExtrasJournalentryByLastIDReply) {
    option (google.api.http) = {
      get: "/api/extras/journalentrys"
    };
  }
}


/*
Notes for defining message fields:
    1. Suggest using camel case style naming for message field names, such as firstName, lastName, etc.
    2. If the message field name ending in 'id', it is recommended to use xxxID naming format, such as userID, orderID, etc.
    3. Add validate rules https://github.com/envoyproxy/protoc-gen-validate#constraint-rules, such as:
        uint64 id = 1 [(validate.rules).uint64.gte  = 1];

If used to generate code that supports the HTTP protocol, notes for defining message fields:
    1. If the route contains the path parameter, such as /api/v1/extrasJournalentry/{id}, the defined
        message must contain the name of the path parameter and the name should be added
        with a new tag, such as int64 id = 1 [(tagger.tags) = "uri:\"id\""];
    2. If the request url is followed by a query parameter, such as /api/v1/getExtrasJournalentry?name=Tom,
        a form tag must be added when defining the query parameter in the message, such as:
        string name = 1 [(tagger.tags) = "form:\"name\""].
    3. When the message fields use snake_case naming (e.g., order_id), the generated swagger.json file
        will use camelCase (e.g., orderId) instead of the expected snake_case. This behavior aligns with
        the JSON tag names used by gRPC, but it can cause the Gin framework to fail to correctly bind and
        retrieve parameter values. There are two ways to resolve this issue:
            (1) Explicitly specify the JSON tag name using the json_name option, such as:
                 string order_id = 1 [json_name = "order_id"];
            (2) If you want to switch to camelCase naming and update the JSON tag name accordingly, such as:
                 string order_id = 1 [json_name = "orderID", (tagger.tags) = "json:\"orderID\""];
*/


message CreateExtrasJournalentryRequest {
	string lastUpdated = 1; 
	int64 assignedObjectID = 2; 
	string created = 3; 
	string kind = 4; 
	string comments = 5; 
	int32 assignedObjectTypeID = 6; 
	int64 createdByID = 7; 
	string customFieldData = 8; 
}

message CreateExtrasJournalentryReply {
  uint64 id = 1;
}

message DeleteExtrasJournalentryByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteExtrasJournalentryByIDReply {

}

message UpdateExtrasJournalentryByIDRequest {
	string lastUpdated = 1; 
	uint64 id = 2 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	int64 assignedObjectID = 3; 
	string created = 4; 
	string kind = 5; 
	string comments = 6; 
	int32 assignedObjectTypeID = 7; 
	int64 createdByID = 8; 
	string customFieldData = 9; 
}

message UpdateExtrasJournalentryByIDReply {

}

message ExtrasJournalentry {
	string lastUpdated = 1; 
	uint64 id = 2; 
	int64 assignedObjectID = 3; 
	string created = 4; 
	string kind = 5; 
	string comments = 6; 
	int32 assignedObjectTypeID = 7; 
	int64 createdByID = 8; 
	string customFieldData = 9; 
}

message GetExtrasJournalentryByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\"" ];
}

message GetExtrasJournalentryByIDReply {
  ExtrasJournalentry extrasJournalentry = 1;
}

message ListExtrasJournalentryRequest {
  api.types.Params params = 1;
}

message ListExtrasJournalentryReply {
  int64 total = 1;
  repeated ExtrasJournalentry extrasJournalentrys = 2;
}

message DeleteExtrasJournalentryByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteExtrasJournalentryByIDsReply {

}

message GetExtrasJournalentryByConditionRequest {
  types.Conditions conditions = 1;
}

message GetExtrasJournalentryByConditionReply {
  ExtrasJournalentry extrasJournalentry = 1;
}

message ListExtrasJournalentryByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message ListExtrasJournalentryByIDsReply {
  repeated ExtrasJournalentry extrasJournalentrys = 1;
}

message ListExtrasJournalentryByLastIDRequest {
  uint64 lastID = 1 [(tagger.tags) = "form:\"lastID\""]; // last id
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -id, the - sign indicates descending order.
}

message ListExtrasJournalentryByLastIDReply {
  repeated ExtrasJournalentry extrasJournalentrys = 1;
}


