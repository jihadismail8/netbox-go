syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service tenancyContactgroup {
  // Create a new tenancyContactgroup
  rpc Create(CreateTenancyContactgroupRequest) returns (CreateTenancyContactgroupReply) {
    option (google.api.http) = {
      post: "/api/tenancy/contactgroups"
      body: "*"
    };
  }

  // Delete a tenancyContactgroup by id
  rpc DeleteByID(DeleteTenancyContactgroupByIDRequest) returns (DeleteTenancyContactgroupByIDReply) {
    option (google.api.http) = {
      delete: "/api/tenancy/contactgroups/{id}"
    };
  }

  // Update a tenancyContactgroup by id
  rpc UpdateByID(UpdateTenancyContactgroupByIDRequest) returns (UpdateTenancyContactgroupByIDReply) {
    option (google.api.http) = {
      put: "/api/tenancy/contactgroups/{id}"
      body: "*"
    };
  }

  // Get a tenancyContactgroup by id
  rpc GetByID(GetTenancyContactgroupByIDRequest) returns (GetTenancyContactgroupByIDReply) {
    option (google.api.http) = {
      get: "/api/tenancy/contactgroups/{id}"
    };
  }

  // Get a paginated list of tenancyContactgroup by custom conditions
  rpc List(ListTenancyContactgroupRequest) returns (ListTenancyContactgroupReply) {
    option (google.api.http) = {
      post: "/api/tenancy/contactgroups/list"
      body: "*"
    };
  }

  // Batch delete tenancyContactgroup by ids
  rpc DeleteByIDs(DeleteTenancyContactgroupByIDsRequest) returns (DeleteTenancyContactgroupByIDsReply) {
    option (google.api.http) = {
      post: "/api/tenancy/contactgroups/delete/ids"
      body: "*"
    };
  }

  // Get a tenancyContactgroup by custom condition
  rpc GetByCondition(GetTenancyContactgroupByConditionRequest) returns (GetTenancyContactgroupByConditionReply) {
    option (google.api.http) = {
      post: "/api/tenancy/contactgroups/condition"
      body: "*"
    };
  }

  // Batch get tenancyContactgroup by ids
  rpc ListByIDs(ListTenancyContactgroupByIDsRequest) returns (ListTenancyContactgroupByIDsReply) {
    option (google.api.http) = {
      post: "/api/tenancy/contactgroups/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of tenancyContactgroup by last id
  rpc ListByLastID(ListTenancyContactgroupByLastIDRequest) returns (ListTenancyContactgroupByLastIDReply) {
    option (google.api.http) = {
      get: "/api/tenancy/contactgroups"
    };
  }
}


/*
Notes for defining message fields:
    1. Suggest using camel case style naming for message field names, such as firstName, lastName, etc.
    2. If the message field name ending in 'id', it is recommended to use xxxID naming format, such as userID, orderID, etc.
    3. Add validate rules https://github.com/envoyproxy/protoc-gen-validate#constraint-rules, such as:
        uint64 id = 1 [(validate.rules).uint64.gte  = 1];

If used to generate code that supports the HTTP protocol, notes for defining message fields:
    1. If the route contains the path parameter, such as /api/v1/tenancyContactgroup/{id}, the defined
        message must contain the name of the path parameter and the name should be added
        with a new tag, such as int64 id = 1 [(tagger.tags) = "uri:\"id\""];
    2. If the request url is followed by a query parameter, such as /api/v1/getTenancyContactgroup?name=Tom,
        a form tag must be added when defining the query parameter in the message, such as:
        string name = 1 [(tagger.tags) = "form:\"name\""].
    3. When the message fields use snake_case naming (e.g., order_id), the generated swagger.json file
        will use camelCase (e.g., orderId) instead of the expected snake_case. This behavior aligns with
        the JSON tag names used by gRPC, but it can cause the Gin framework to fail to correctly bind and
        retrieve parameter values. There are two ways to resolve this issue:
            (1) Explicitly specify the JSON tag name using the json_name option, such as:
                 string order_id = 1 [json_name = "order_id"];
            (2) If you want to switch to camelCase naming and update the JSON tag name accordingly, such as:
                 string order_id = 1 [json_name = "orderID", (tagger.tags) = "json:\"orderID\""];
*/


message CreateTenancyContactgroupRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	string name = 4; 
	string slug = 5; 
	string description = 6; 
	int32 lft = 7; 
	int32 rght = 8; 
	int32 treeID = 9; 
	int32 level = 10; 
	int64 parentID = 11; 
	string comments = 12; 
}

message CreateTenancyContactgroupReply {
  uint64 id = 1;
}

message DeleteTenancyContactgroupByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteTenancyContactgroupByIDReply {

}

message UpdateTenancyContactgroupByIDRequest {
	uint64 id = 1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	string created = 2; 
	string lastUpdated = 3; 
	string customFieldData = 4; 
	string name = 5; 
	string slug = 6; 
	string description = 7; 
	int32 lft = 8; 
	int32 rght = 9; 
	int32 treeID = 10; 
	int32 level = 11; 
	int64 parentID = 12; 
	string comments = 13; 
}

message UpdateTenancyContactgroupByIDReply {

}

message TenancyContactgroup {
	uint64 id = 1; 
	string created = 2; 
	string lastUpdated = 3; 
	string customFieldData = 4; 
	string name = 5; 
	string slug = 6; 
	string description = 7; 
	int32 lft = 8; 
	int32 rght = 9; 
	int32 treeID = 10; 
	int32 level = 11; 
	int64 parentID = 12; 
	string comments = 13; 
}

message GetTenancyContactgroupByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\"" ];
}

message GetTenancyContactgroupByIDReply {
  TenancyContactgroup tenancyContactgroup = 1;
}

message ListTenancyContactgroupRequest {
  api.types.Params params = 1;
}

message ListTenancyContactgroupReply {
  int64 total = 1;
  repeated TenancyContactgroup tenancyContactgroups = 2;
}

message DeleteTenancyContactgroupByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteTenancyContactgroupByIDsReply {

}

message GetTenancyContactgroupByConditionRequest {
  types.Conditions conditions = 1;
}

message GetTenancyContactgroupByConditionReply {
  TenancyContactgroup tenancyContactgroup = 1;
}

message ListTenancyContactgroupByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message ListTenancyContactgroupByIDsReply {
  repeated TenancyContactgroup tenancyContactgroups = 1;
}

message ListTenancyContactgroupByLastIDRequest {
  uint64 lastID = 1 [(tagger.tags) = "form:\"lastID\""]; // last id
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -id, the - sign indicates descending order.
}

message ListTenancyContactgroupByLastIDReply {
  repeated TenancyContactgroup tenancyContactgroups = 1;
}


