*/


message CreateCircuitsProvideraccountRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	string description = 4; 
	string comments = 5; 
	string account = 6; 
	string name = 7; 
	int64 providerID = 8; 
}

message CreateCircuitsProvideraccountReply {
  uint64 id = 1;
}

message DeleteCircuitsProvideraccountByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteCircuitsProvideraccountByIDReply {

}

message UpdateCircuitsProvideraccountByIDRequest {
	uint64 id = 1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	string created = 2; 
	string lastUpdated = 3; 
	string customFieldData = 4; 
	string description = 5; 
	string comments = 6; 
	string account = 7; 
	string name = 8; 
	int64 providerID = 9; 
}

message UpdateCircuitsProvideraccountByIDReply {

}

message CircuitsProvideraccount {
	uint64 id = 1; 
	string created = 2; 
	string lastUpdated = 3; 
	string customFieldData = 4; 
	string description = 5; 
	string comments = 6; 
	string account = 7; 
	string name = 8; 
	int64 providerID = 9; 
}

message GetCircuitsProvideraccountByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\"" ];
}

message GetCircuitsProvideraccountByIDReply {
  CircuitsProvideraccount circuitsProvideraccount = 1;
}

message ListCircuitsProvideraccountRequest {
  api.types.Params params = 1;
}

message ListCircuitsProvideraccountReply {
  int64 total = 1;
  repeated CircuitsProvideraccount circuitsProvideraccounts = 2;
}

message DeleteCircuitsProvideraccountByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteCircuitsProvideraccountByIDsReply {

}

message GetCircuitsProvideraccountByConditionRequest {
  types.Conditions conditions = 1;
}

message GetCircuitsProvideraccountByConditionReply {
  CircuitsProvideraccount circuitsProvideraccount = 1;
}

message ListCircuitsProvideraccountByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message ListCircuitsProvideraccountByIDsReply {
  repeated CircuitsProvideraccount circuitsProvideraccounts = 1;
}

message ListCircuitsProvideraccountByLastIDRequest {
  uint64 lastID = 1 [(tagger.tags) = "form:\"lastID\""]; // last id
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -id, the - sign indicates descending order.
}

message ListCircuitsProvideraccountByLastIDReply {
  repeated CircuitsProvideraccount circuitsProvideraccounts = 1;
}


