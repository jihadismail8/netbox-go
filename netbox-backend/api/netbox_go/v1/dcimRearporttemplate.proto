message CreateDcimRearporttemplateRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string name = 3; 
	string label = 4; 
	string description = 5; 
	string type = 6; 
	int32 positions = 7; 
	int64 deviceTypeID = 8; 
	string color = 9; 
	int64 moduleTypeID = 10; 
}

message CreateDcimRearporttemplateReply {
  uint64 id = 1;
}

message DeleteDcimRearporttemplateByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteDcimRearporttemplateByIDReply {

}

message UpdateDcimRearporttemplateByIDRequest {
	string created = 1; 
	string lastUpdated = 2; 
	uint64 id = 3 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	string name = 4; 
	string label = 5; 
	string description = 6; 
	string type = 7; 
	int32 positions = 8; 
	int64 deviceTypeID = 9; 
	string color = 10; 
	int64 moduleTypeID = 11; 
}

message UpdateDcimRearporttemplateByIDReply {

}

message DcimRearporttemplate {
	string created = 1; 
	string lastUpdated = 2; 
	uint64 id = 3; 
	string name = 4; 
	string label = 5; 
	string description = 6; 
	string type = 7; 
	int32 positions = 8; 
	int64 deviceTypeID = 9; 
	string color = 10; 
	int64 moduleTypeID = 11; 
}

message GetDcimRearporttemplateByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\"" ];
}

message GetDcimRearporttemplateByIDReply {
  DcimRearporttemplate dcimRearporttemplate = 1;
}

message ListDcimRearporttemplateRequest {
  api.types.Params params = 1;
}

message ListDcimRearporttemplateReply {
  int64 total = 1;
  repeated DcimRearporttemplate dcimRearporttemplates = 2;
}

message DeleteDcimRearporttemplateByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteDcimRearporttemplateByIDsReply {

}

message GetDcimRearporttemplateByConditionRequest {
  types.Conditions conditions = 1;
}

message GetDcimRearporttemplateByConditionReply {
  DcimRearporttemplate dcimRearporttemplate = 1;
}

message ListDcimRearporttemplateByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message ListDcimRearporttemplateByIDsReply {
  repeated DcimRearporttemplate dcimRearporttemplates = 1;
}

message ListDcimRearporttemplateByLastIDRequest {
  uint64 lastID = 1 [(tagger.tags) = "form:\"lastID\""]; // last id
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -id, the - sign indicates descending order.
}

message ListDcimRearporttemplateByLastIDReply {
  repeated DcimRearporttemplate dcimRearporttemplates = 1;
}


