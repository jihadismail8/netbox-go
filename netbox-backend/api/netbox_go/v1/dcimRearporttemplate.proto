syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service dcimRearporttemplate {
  // Create a new dcimRearporttemplate
  rpc Create(CreateDcimRearporttemplateRequest) returns (CreateDcimRearporttemplateReply) {
    option (google.api.http) = {
      post: "/api/dcim/rearporttemplates"
      body: "*"
    };
  }

  // Delete a dcimRearporttemplate by id
  rpc DeleteByID(DeleteDcimRearporttemplateByIDRequest) returns (DeleteDcimRearporttemplateByIDReply) {
    option (google.api.http) = {
      delete: "/api/dcim/rearporttemplates/{id}"
    };
  }

  // Update a dcimRearporttemplate by id
  rpc UpdateByID(UpdateDcimRearporttemplateByIDRequest) returns (UpdateDcimRearporttemplateByIDReply) {
    option (google.api.http) = {
      put: "/api/dcim/rearporttemplates/{id}"
      body: "*"
    };
  }

  // Get a dcimRearporttemplate by id
  rpc GetByID(GetDcimRearporttemplateByIDRequest) returns (GetDcimRearporttemplateByIDReply) {
    option (google.api.http) = {
      get: "/api/dcim/rearporttemplates/{id}"
    };
  }

  // Get a paginated list of dcimRearporttemplate by custom conditions
  rpc List(ListDcimRearporttemplateRequest) returns (ListDcimRearporttemplateReply) {
    option (google.api.http) = {
      post: "/api/dcim/rearporttemplates/list"
      body: "*"
    };
  }

  // Batch delete dcimRearporttemplate by ids
  rpc DeleteByIDs(DeleteDcimRearporttemplateByIDsRequest) returns (DeleteDcimRearporttemplateByIDsReply) {
    option (google.api.http) = {
      post: "/api/dcim/rearporttemplates/delete/ids"
      body: "*"
    };
  }

  // Get a dcimRearporttemplate by custom condition
  rpc GetByCondition(GetDcimRearporttemplateByConditionRequest) returns (GetDcimRearporttemplateByConditionReply) {
    option (google.api.http) = {
      post: "/api/dcim/rearporttemplates/condition"
      body: "*"
    };
  }

  // Batch get dcimRearporttemplate by ids
  rpc ListByIDs(ListDcimRearporttemplateByIDsRequest) returns (ListDcimRearporttemplateByIDsReply) {
    option (google.api.http) = {
      post: "/api/dcim/rearporttemplates/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of dcimRearporttemplate by last id
  rpc ListByLastID(ListDcimRearporttemplateByLastIDRequest) returns (ListDcimRearporttemplateByLastIDReply) {
    option (google.api.http) = {
      get: "/api/dcim/rearporttemplates"
    };
  }
}


