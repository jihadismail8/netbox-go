message CreateDcimConsoleporttemplateRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string name = 3; 
	string label = 4; 
	string description = 5; 
	string type = 6; 
	int64 deviceTypeID = 7; 
	int64 moduleTypeID = 8; 
}

message CreateDcimConsoleporttemplateReply {
  uint64 id = 1;
}

message DeleteDcimConsoleporttemplateByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteDcimConsoleporttemplateByIDReply {

}

message UpdateDcimConsoleporttemplateByIDRequest {
	string created = 1; 
	string lastUpdated = 2; 
	uint64 id = 3 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	string name = 4; 
	string label = 5; 
	string description = 6; 
	string type = 7; 
	int64 deviceTypeID = 8; 
	int64 moduleTypeID = 9; 
}

message UpdateDcimConsoleporttemplateByIDReply {

}

message DcimConsoleporttemplate {
	string created = 1; 
	string lastUpdated = 2; 
	uint64 id = 3; 
	string name = 4; 
	string label = 5; 
	string description = 6; 
	string type = 7; 
	int64 deviceTypeID = 8; 
	int64 moduleTypeID = 9; 
}

message GetDcimConsoleporttemplateByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\"" ];
}

message GetDcimConsoleporttemplateByIDReply {
  DcimConsoleporttemplate dcimConsoleporttemplate = 1;
}

message ListDcimConsoleporttemplateRequest {
  api.types.Params params = 1;
}

message ListDcimConsoleporttemplateReply {
  int64 total = 1;
  repeated DcimConsoleporttemplate dcimConsoleporttemplates = 2;
}

message DeleteDcimConsoleporttemplateByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteDcimConsoleporttemplateByIDsReply {

}

message GetDcimConsoleporttemplateByConditionRequest {
  types.Conditions conditions = 1;
}

message GetDcimConsoleporttemplateByConditionReply {
  DcimConsoleporttemplate dcimConsoleporttemplate = 1;
}

message ListDcimConsoleporttemplateByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message ListDcimConsoleporttemplateByIDsReply {
  repeated DcimConsoleporttemplate dcimConsoleporttemplates = 1;
}

message ListDcimConsoleporttemplateByLastIDRequest {
  uint64 lastID = 1 [(tagger.tags) = "form:\"lastID\""]; // last id
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -id, the - sign indicates descending order.
