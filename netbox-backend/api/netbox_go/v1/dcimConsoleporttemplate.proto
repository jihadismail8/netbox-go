syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service dcimConsoleporttemplate {
  // Create a new dcimConsoleporttemplate
  rpc Create(CreateDcimConsoleporttemplateRequest) returns (CreateDcimConsoleporttemplateReply) {
    option (google.api.http) = {
      post: "/api/dcim/consoleporttemplates"
      body: "*"
    };
  }

  // Delete a dcimConsoleporttemplate by id
  rpc DeleteByID(DeleteDcimConsoleporttemplateByIDRequest) returns (DeleteDcimConsoleporttemplateByIDReply) {
    option (google.api.http) = {
      delete: "/api/dcim/consoleporttemplates/{id}"
    };
  }

  // Update a dcimConsoleporttemplate by id
  rpc UpdateByID(UpdateDcimConsoleporttemplateByIDRequest) returns (UpdateDcimConsoleporttemplateByIDReply) {
    option (google.api.http) = {
      put: "/api/dcim/consoleporttemplates/{id}"
      body: "*"
    };
  }

  // Get a dcimConsoleporttemplate by id
  rpc GetByID(GetDcimConsoleporttemplateByIDRequest) returns (GetDcimConsoleporttemplateByIDReply) {
    option (google.api.http) = {
      get: "/api/dcim/consoleporttemplates/{id}"
    };
  }

  // Get a paginated list of dcimConsoleporttemplate by custom conditions
  rpc List(ListDcimConsoleporttemplateRequest) returns (ListDcimConsoleporttemplateReply) {
    option (google.api.http) = {
      post: "/api/dcim/consoleporttemplates/list"
      body: "*"
    };
  }

  // Batch delete dcimConsoleporttemplate by ids
  rpc DeleteByIDs(DeleteDcimConsoleporttemplateByIDsRequest) returns (DeleteDcimConsoleporttemplateByIDsReply) {
    option (google.api.http) = {
      post: "/api/dcim/consoleporttemplates/delete/ids"
      body: "*"
    };
  }

  // Get a dcimConsoleporttemplate by custom condition
  rpc GetByCondition(GetDcimConsoleporttemplateByConditionRequest) returns (GetDcimConsoleporttemplateByConditionReply) {
    option (google.api.http) = {
      post: "/api/dcim/consoleporttemplates/condition"
      body: "*"
    };
  }

  // Batch get dcimConsoleporttemplate by ids
  rpc ListByIDs(ListDcimConsoleporttemplateByIDsRequest) returns (ListDcimConsoleporttemplateByIDsReply) {
    option (google.api.http) = {
      post: "/api/dcim/consoleporttemplates/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of dcimConsoleporttemplate by last id
  rpc ListByLastID(ListDcimConsoleporttemplateByLastIDRequest) returns (ListDcimConsoleporttemplateByLastIDReply) {
    option (google.api.http) = {
      get: "/api/dcim/consoleporttemplates"
    };
  }
}


