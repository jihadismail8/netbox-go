syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service ipamVlan {
  // Create a new ipamVlan
  rpc Create(CreateIpamVlanRequest) returns (CreateIpamVlanReply) {
    option (google.api.http) = {
      post: "/api/ipam/vlans"
      body: "*"
    };
  }

  // Delete a ipamVlan by id
  rpc DeleteByID(DeleteIpamVlanByIDRequest) returns (DeleteIpamVlanByIDReply) {
    option (google.api.http) = {
      delete: "/api/ipam/vlans/{id}"
    };
  }

  // Update a ipamVlan by id
  rpc UpdateByID(UpdateIpamVlanByIDRequest) returns (UpdateIpamVlanByIDReply) {
    option (google.api.http) = {
      put: "/api/ipam/vlans/{id}"
      body: "*"
    };
  }

  // Get a ipamVlan by id
  rpc GetByID(GetIpamVlanByIDRequest) returns (GetIpamVlanByIDReply) {
    option (google.api.http) = {
      get: "/api/ipam/vlans/{id}"
    };
  }

  // Get a paginated list of ipamVlan by custom conditions
  rpc List(ListIpamVlanRequest) returns (ListIpamVlanReply) {
    option (google.api.http) = {
      post: "/api/ipam/vlans/list"
      body: "*"
    };
  }

  // Batch delete ipamVlan by ids
  rpc DeleteByIDs(DeleteIpamVlanByIDsRequest) returns (DeleteIpamVlanByIDsReply) {
    option (google.api.http) = {
      post: "/api/ipam/vlans/delete/ids"
      body: "*"
    };
  }

  // Get a ipamVlan by custom condition
  rpc GetByCondition(GetIpamVlanByConditionRequest) returns (GetIpamVlanByConditionReply) {
    option (google.api.http) = {
      post: "/api/ipam/vlans/condition"
      body: "*"
    };
  }

  // Batch get ipamVlan by ids
  rpc ListByIDs(ListIpamVlanByIDsRequest) returns (ListIpamVlanByIDsReply) {
    option (google.api.http) = {
      post: "/api/ipam/vlans/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of ipamVlan by last id
  rpc ListByLastID(ListIpamVlanByLastIDRequest) returns (ListIpamVlanByLastIDReply) {
    option (google.api.http) = {
      get: "/api/ipam/vlans"
    };
  }
}


/*
Notes for defining message fields:
    1. Suggest using camel case style naming for message field names, such as firstName, lastName, etc.
    2. If the message field name ending in 'id', it is recommended to use xxxID naming format, such as userID, orderID, etc.
    3. Add validate rules https://github.com/envoyproxy/protoc-gen-validate#constraint-rules, such as:
        uint64 id = 1 [(validate.rules).uint64.gte  = 1];

If used to generate code that supports the HTTP protocol, notes for defining message fields:
    1. If the route contains the path parameter, such as /api/v1/ipamVlan/{id}, the defined
        message must contain the name of the path parameter and the name should be added
        with a new tag, such as int64 id = 1 [(tagger.tags) = "uri:\"id\""];
    2. If the request url is followed by a query parameter, such as /api/v1/getIpamVlan?name=Tom,
        a form tag must be added when defining the query parameter in the message, such as:
        string name = 1 [(tagger.tags) = "form:\"name\""].
    3. When the message fields use snake_case naming (e.g., order_id), the generated swagger.json file
        will use camelCase (e.g., orderId) instead of the expected snake_case. This behavior aligns with
        the JSON tag names used by gRPC, but it can cause the Gin framework to fail to correctly bind and
        retrieve parameter values. There are two ways to resolve this issue:
            (1) Explicitly specify the JSON tag name using the json_name option, such as:
                 string order_id = 1 [json_name = "order_id"];
            (2) If you want to switch to camelCase naming and update the JSON tag name accordingly, such as:
                 string order_id = 1 [json_name = "orderID", (tagger.tags) = "json:\"orderID\""];
*/


message CreateIpamVlanRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	int32 vid = 4; 
	string name = 5; 
	string status = 6; 
	string description = 7; 
	int64 groupID = 8; 
	int64 roleID = 9; 
	int64 siteID = 10; 
	int64 tenantID = 11; 
	string comments = 12; 
	string qinqRole = 13; 
	int64 qinqSvlanID = 14; 
}

message CreateIpamVlanReply {
  uint64 id = 1;
}

message DeleteIpamVlanByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteIpamVlanByIDReply {

}

message UpdateIpamVlanByIDRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	uint64 id = 4 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	int32 vid = 5; 
	string name = 6; 
	string status = 7; 
	string description = 8; 
	int64 groupID = 9; 
	int64 roleID = 10; 
	int64 siteID = 11; 
	int64 tenantID = 12; 
	string comments = 13; 
	string qinqRole = 14; 
	int64 qinqSvlanID = 15; 
}

message UpdateIpamVlanByIDReply {

}

message IpamVlan {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	uint64 id = 4; 
	int32 vid = 5; 
	string name = 6; 
	string status = 7; 
	string description = 8; 
	int64 groupID = 9; 
	int64 roleID = 10; 
	int64 siteID = 11; 
	int64 tenantID = 12; 
	string comments = 13; 
	string qinqRole = 14; 
	int64 qinqSvlanID = 15; 
}

message GetIpamVlanByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\"" ];
}

message GetIpamVlanByIDReply {
  IpamVlan ipamVlan = 1;
}

message ListIpamVlanRequest {
  api.types.Params params = 1;
}

message ListIpamVlanReply {
  int64 total = 1;
  repeated IpamVlan ipamVlans = 2;
}

message DeleteIpamVlanByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteIpamVlanByIDsReply {

}

message GetIpamVlanByConditionRequest {
  types.Conditions conditions = 1;
}

message GetIpamVlanByConditionReply {
  IpamVlan ipamVlan = 1;
}

message ListIpamVlanByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message ListIpamVlanByIDsReply {
  repeated IpamVlan ipamVlans = 1;
}

message ListIpamVlanByLastIDRequest {
  uint64 lastID = 1 [(tagger.tags) = "form:\"lastID\""]; // last id
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -id, the - sign indicates descending order.
}

message ListIpamVlanByLastIDReply {
  repeated IpamVlan ipamVlans = 1;
}


