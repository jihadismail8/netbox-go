message CreateVirtualizationVminterfaceRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	bool enabled = 4; 
	int32 mtu = 5; 
	string mode = 6; 
	string name = 7; 
	string xName = 8 [json_name = "xName"]; 
	string description = 9; 
	int64 parentID = 10; 
	int64 untaggedVlanID = 11; 
	int64 virtualMachineID = 12; 
	int64 bridgeID = 13; 
	int64 vrfID = 14; 
	int64 vlanTranslationPolicyID = 15; 
	int64 qinqSvlanID = 16; 
	int64 primaryMacAddressID = 17; 
}

message CreateVirtualizationVminterfaceReply {
  uint64 id = 1;
}

