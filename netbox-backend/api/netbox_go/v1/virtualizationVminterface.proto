syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service virtualizationVminterface {
  // Create a new virtualizationVminterface
  rpc Create(CreateVirtualizationVminterfaceRequest) returns (CreateVirtualizationVminterfaceReply) {
    option (google.api.http) = {
      post: "/api/virtualization/vminterfaces"
      body: "*"
    };
  }

  // Delete a virtualizationVminterface by id
  rpc DeleteByID(DeleteVirtualizationVminterfaceByIDRequest) returns (DeleteVirtualizationVminterfaceByIDReply) {
    option (google.api.http) = {
      delete: "/api/virtualization/vminterfaces/{id}"
    };
  }

  // Update a virtualizationVminterface by id
  rpc UpdateByID(UpdateVirtualizationVminterfaceByIDRequest) returns (UpdateVirtualizationVminterfaceByIDReply) {
    option (google.api.http) = {
      put: "/api/virtualization/vminterfaces/{id}"
      body: "*"
    };
  }

  // Get a virtualizationVminterface by id
  rpc GetByID(GetVirtualizationVminterfaceByIDRequest) returns (GetVirtualizationVminterfaceByIDReply) {
    option (google.api.http) = {
      get: "/api/virtualization/vminterfaces/{id}"
    };
  }

  // Get a paginated list of virtualizationVminterface by custom conditions
  rpc List(ListVirtualizationVminterfaceRequest) returns (ListVirtualizationVminterfaceReply) {
    option (google.api.http) = {
      post: "/api/virtualization/vminterfaces/list"
      body: "*"
    };
  }

  // Batch delete virtualizationVminterface by ids
  rpc DeleteByIDs(DeleteVirtualizationVminterfaceByIDsRequest) returns (DeleteVirtualizationVminterfaceByIDsReply) {
    option (google.api.http) = {
      post: "/api/virtualization/vminterfaces/delete/ids"
      body: "*"
    };
  }

  // Get a virtualizationVminterface by custom condition
  rpc GetByCondition(GetVirtualizationVminterfaceByConditionRequest) returns (GetVirtualizationVminterfaceByConditionReply) {
    option (google.api.http) = {
      post: "/api/virtualization/vminterfaces/condition"
      body: "*"
    };
  }

  // Batch get virtualizationVminterface by ids
  rpc ListByIDs(ListVirtualizationVminterfaceByIDsRequest) returns (ListVirtualizationVminterfaceByIDsReply) {
    option (google.api.http) = {
      post: "/api/virtualization/vminterfaces/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of virtualizationVminterface by last id
  rpc ListByLastID(ListVirtualizationVminterfaceByLastIDRequest) returns (ListVirtualizationVminterfaceByLastIDReply) {
    option (google.api.http) = {
      get: "/api/virtualization/vminterfaces"
    };
  }
}


