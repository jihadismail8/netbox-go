message CreateTenancyContactassignmentRequest {
	string created = 1; 
	string lastUpdated = 2; 
	int64 objectID = 3; 
	string priority = 4; 
	int64 contactID = 5; 
	int32 objectTypeID = 6; 
	int64 roleID = 7; 
	string customFieldData = 8; 
}

message CreateTenancyContactassignmentReply {
  uint64 id = 1;
}

