syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service tenancyContactassignment {
  // Create a new tenancyContactassignment
  rpc Create(CreateTenancyContactassignmentRequest) returns (CreateTenancyContactassignmentReply) {
    option (google.api.http) = {
      post: "/api/tenancy/contactassignments"
      body: "*"
    };
  }

  // Delete a tenancyContactassignment by id
  rpc DeleteByID(DeleteTenancyContactassignmentByIDRequest) returns (DeleteTenancyContactassignmentByIDReply) {
    option (google.api.http) = {
      delete: "/api/tenancy/contactassignments/{id}"
    };
  }

  // Update a tenancyContactassignment by id
  rpc UpdateByID(UpdateTenancyContactassignmentByIDRequest) returns (UpdateTenancyContactassignmentByIDReply) {
    option (google.api.http) = {
      put: "/api/tenancy/contactassignments/{id}"
      body: "*"
    };
  }

  // Get a tenancyContactassignment by id
  rpc GetByID(GetTenancyContactassignmentByIDRequest) returns (GetTenancyContactassignmentByIDReply) {
    option (google.api.http) = {
      get: "/api/tenancy/contactassignments/{id}"
    };
  }

  // Get a paginated list of tenancyContactassignment by custom conditions
  rpc List(ListTenancyContactassignmentRequest) returns (ListTenancyContactassignmentReply) {
    option (google.api.http) = {
      post: "/api/tenancy/contactassignments/list"
      body: "*"
    };
  }

  // Batch delete tenancyContactassignment by ids
  rpc DeleteByIDs(DeleteTenancyContactassignmentByIDsRequest) returns (DeleteTenancyContactassignmentByIDsReply) {
    option (google.api.http) = {
      post: "/api/tenancy/contactassignments/delete/ids"
      body: "*"
    };
  }

  // Get a tenancyContactassignment by custom condition
  rpc GetByCondition(GetTenancyContactassignmentByConditionRequest) returns (GetTenancyContactassignmentByConditionReply) {
    option (google.api.http) = {
      post: "/api/tenancy/contactassignments/condition"
      body: "*"
    };
  }

  // Batch get tenancyContactassignment by ids
  rpc ListByIDs(ListTenancyContactassignmentByIDsRequest) returns (ListTenancyContactassignmentByIDsReply) {
    option (google.api.http) = {
      post: "/api/tenancy/contactassignments/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of tenancyContactassignment by last id
  rpc ListByLastID(ListTenancyContactassignmentByLastIDRequest) returns (ListTenancyContactassignmentByLastIDReply) {
    option (google.api.http) = {
      get: "/api/tenancy/contactassignments"
    };
  }
}


