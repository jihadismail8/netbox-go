syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user details by id",
      description: "Gets detailed information of a thumbnailKvstore specified by the given id in the path.",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service thumbnailKvstore {
  // Create a new thumbnailKvstore
  rpc Create(CreateThumbnailKvstoreRequest) returns (CreateThumbnailKvstoreReply) {
    option (google.api.http) = {
      post: "/api/_kvstores"
      body: "*"
    };
  }

  // Delete a thumbnailKvstore by key
  rpc DeleteByKey(DeleteThumbnailKvstoreByKeyRequest) returns (DeleteThumbnailKvstoreByKeyReply) {
    option (google.api.http) = {
      delete: "/api/v1/thumbnailKvstore/{key}"
    };
  }

  // Update a thumbnailKvstore by key
  rpc UpdateByKey(UpdateThumbnailKvstoreByKeyRequest) returns (UpdateThumbnailKvstoreByKeyReply) {
    option (google.api.http) = {
      put: "/api/v1/thumbnailKvstore/{key}"
      body: "*"
    };
  }

  // Get a thumbnailKvstore by key
  rpc GetByKey(GetThumbnailKvstoreByKeyRequest) returns (GetThumbnailKvstoreByKeyReply) {
    option (google.api.http) = {
      get: "/api/v1/thumbnailKvstore/{key}"
    };
  }

  // Get a paginated list of thumbnailKvstore by custom conditions
  rpc List(ListThumbnailKvstoreRequest) returns (ListThumbnailKvstoreReply) {
    option (google.api.http) = {
      post: "/api/_kvstores/list"
      body: "*"
    };
  }

  // Batch delete thumbnailKvstore by key
  rpc DeleteByKeys(DeleteThumbnailKvstoreByKeysRequest) returns (DeleteThumbnailKvstoreByKeysReply) {
    option (google.api.http) = {
      post: "/api/_kvstores/delete/ids"
      body: "*"
    };
  }

  // Get a thumbnailKvstore by custom conditions
  rpc GetByCondition(GetThumbnailKvstoreByConditionRequest) returns (GetThumbnailKvstoreByConditionReply) {
    option (google.api.http) = {
      post: "/api/_kvstores/condition"
      body: "*"
    };
  }

  // Batch get thumbnailKvstore by key
  rpc ListByKeys(ListThumbnailKvstoreByKeysRequest) returns (ListThumbnailKvstoreByKeysReply) {
    option (google.api.http) = {
      post: "/api/_kvstores/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of thumbnailKvstore by last key
  rpc ListByLastKey(ListThumbnailKvstoreByLastKeyRequest) returns (ListThumbnailKvstoreByLastKeyReply) {
    option (google.api.http) = {
      get: "/api/_kvstores"
    };
  }
}


/*
Notes for defining message fields:
    1. Suggest using camel case style naming for message field names, such as firstName, lastName, etc.
    2. If the message field name ending in 'id', it is recommended to use xxxID naming format, such as userID, orderID, etc.
    3. Add validate rules https://github.com/envoyproxy/protoc-gen-validate#constraint-rules, such as:
        uint64 id = 1 [(validate.rules).uint64.gte  = 1];

If used to generate code that supports the HTTP protocol, notes for defining message fields:
    1. If the route contains the path parameter, such as /api/v1/thumbnailKvstore/{id}, the defined
        message must contain the name of the path parameter and the name should be added
        with a new tag, such as int64 id = 1 [(tagger.tags) = "uri:\"id\""];
    2. If the request url is followed by a query parameter, such as /api/v1/getThumbnailKvstore?name=Tom,
        a form tag must be added when defining the query parameter in the message, such as:
        string name = 1 [(tagger.tags) = "form:\"name\""].
    3. When the message fields use snake_case naming (e.g., order_id), the generated swagger.json file
        will use camelCase (e.g., orderId) instead of the expected snake_case. This behavior aligns with
        the JSON tag names used by gRPC, but it can cause the Gin framework to fail to correctly bind and
        retrieve parameter values. There are two ways to resolve this issue:
            (1) Explicitly specify the JSON tag name using the json_name option, such as:
                 string order_id = 1 [json_name = "order_id"];
            (2) If you want to switch to camelCase naming and update the JSON tag name accordingly, such as:
                 string order_id = 1 [json_name = "orderID", (tagger.tags) = "json:\"orderID\""];
*/


message CreateThumbnailKvstoreRequest {
	string key = 1; 
	string value = 2; 
}

message CreateThumbnailKvstoreReply {
  string key = 1;
}

message DeleteThumbnailKvstoreByKeyRequest {
  string key = 1 [(validate.rules).string.min_len = 1, (tagger.tags) = "uri:\"key\""];
}

message DeleteThumbnailKvstoreByKeyReply {

}

message UpdateThumbnailKvstoreByKeyRequest {
	string key = 1 [(validate.rules).string.min_len = 1, (tagger.tags) = "uri:\"key\""]; 
	string value = 2; 
}

message UpdateThumbnailKvstoreByKeyReply {

}

message ThumbnailKvstore {
	string key = 1; 
	string value = 2; 
}

message GetThumbnailKvstoreByKeyRequest {
  string key = 1 [(validate.rules).string.min_len = 1, (tagger.tags) = "uri:\"key\""];
}

message GetThumbnailKvstoreByKeyReply {
  ThumbnailKvstore thumbnailKvstore = 1;
}

message ListThumbnailKvstoreRequest {
  api.types.Params params = 1;
}

message ListThumbnailKvstoreReply {
  int64 total = 1;
  repeated ThumbnailKvstore thumbnailKvstores = 2;
}

message DeleteThumbnailKvstoreByKeysRequest {
  repeated string keys = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteThumbnailKvstoreByKeysReply {

}

message GetThumbnailKvstoreByConditionRequest {
  types.Conditions conditions = 1;
}

message GetThumbnailKvstoreByConditionReply {
  ThumbnailKvstore thumbnailKvstore = 1;
}

message ListThumbnailKvstoreByKeysRequest {
  repeated string keys = 1 [(validate.rules).repeated.min_items = 1];
}

message ListThumbnailKvstoreByKeysReply {
  repeated ThumbnailKvstore thumbnailKvstores = 1;
}

message ListThumbnailKvstoreByLastKeyRequest {
  string lastKey = 1 [(tagger.tags) = "form:\"lastKey\""];
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -key, the - sign indicates descending order.
}

message ListThumbnailKvstoreByLastKeyReply {
  repeated ThumbnailKvstore thumbnailKvstores = 1;
}


