syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service ipamServiceIpaddresses {
  // Create a new ipamServiceIpaddresses
  rpc Create(CreateIpamServiceIpaddressesRequest) returns (CreateIpamServiceIpaddressesReply) {
    option (google.api.http) = {
      post: "/api/ipam/ipamServiceIpaddresses"
      body: "*"
    };
  }

  // Delete a ipamServiceIpaddresses by id
  rpc DeleteByID(DeleteIpamServiceIpaddressesByIDRequest) returns (DeleteIpamServiceIpaddressesByIDReply) {
    option (google.api.http) = {
      delete: "/api/ipam/ipamServiceIpaddresses/{id}"
    };
  }

  // Update a ipamServiceIpaddresses by id
  rpc UpdateByID(UpdateIpamServiceIpaddressesByIDRequest) returns (UpdateIpamServiceIpaddressesByIDReply) {
    option (google.api.http) = {
      put: "/api/ipam/ipamServiceIpaddresses/{id}"
      body: "*"
    };
  }

  // Get a ipamServiceIpaddresses by id
  rpc GetByID(GetIpamServiceIpaddressesByIDRequest) returns (GetIpamServiceIpaddressesByIDReply) {
    option (google.api.http) = {
      get: "/api/ipam/ipamServiceIpaddresses/{id}"
    };
  }

  // Get a paginated list of ipamServiceIpaddresses by custom conditions
  rpc List(ListIpamServiceIpaddressesRequest) returns (ListIpamServiceIpaddressesReply) {
    option (google.api.http) = {
      post: "/api/ipam/ipamServiceIpaddresses/list"
      body: "*"
    };
  }

  // Batch delete ipamServiceIpaddresses by ids
  rpc DeleteByIDs(DeleteIpamServiceIpaddressesByIDsRequest) returns (DeleteIpamServiceIpaddressesByIDsReply) {
    option (google.api.http) = {
      post: "/api/ipam/ipamServiceIpaddresses/delete/ids"
      body: "*"
    };
  }

  // Get a ipamServiceIpaddresses by custom condition
  rpc GetByCondition(GetIpamServiceIpaddressesByConditionRequest) returns (GetIpamServiceIpaddressesByConditionReply) {
    option (google.api.http) = {
      post: "/api/ipam/ipamServiceIpaddresses/condition"
      body: "*"
    };
  }

  // Batch get ipamServiceIpaddresses by ids
  rpc ListByIDs(ListIpamServiceIpaddressesByIDsRequest) returns (ListIpamServiceIpaddressesByIDsReply) {
    option (google.api.http) = {
      post: "/api/ipam/ipamServiceIpaddresses/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of ipamServiceIpaddresses by last id
  rpc ListByLastID(ListIpamServiceIpaddressesByLastIDRequest) returns (ListIpamServiceIpaddressesByLastIDReply) {
    option (google.api.http) = {
      get: "/api/ipam/ipamServiceIpaddresses"
    };
  }
}


