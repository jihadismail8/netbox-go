message CreateIpamServiceIpaddressesRequest {
	int64 serviceID = 1; 
	int64 ipaddressID = 2; 
}

message CreateIpamServiceIpaddressesReply {
  uint64 id = 1;
}

message DeleteIpamServiceIpaddressesByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteIpamServiceIpaddressesByIDReply {

}

message UpdateIpamServiceIpaddressesByIDRequest {
	uint64 id = 1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	int64 serviceID = 2; 
	int64 ipaddressID = 3; 
}

message UpdateIpamServiceIpaddressesByIDReply {

}

message IpamServiceIpaddresses {
	uint64 id = 1; 
	int64 serviceID = 2; 
	int64 ipaddressID = 3; 
}

