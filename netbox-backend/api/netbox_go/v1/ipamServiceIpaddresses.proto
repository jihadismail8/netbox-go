  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\"" ];
}

message GetIpamServiceIpaddressesByIDReply {
  IpamServiceIpaddresses ipamServiceIpaddresses = 1;
}

message ListIpamServiceIpaddressesRequest {
  api.types.Params params = 1;
}

message ListIpamServiceIpaddressesReply {
  int64 total = 1;
  repeated IpamServiceIpaddresses ipamServiceIpaddressess = 2;
}

message DeleteIpamServiceIpaddressesByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteIpamServiceIpaddressesByIDsReply {

}

message GetIpamServiceIpaddressesByConditionRequest {
  types.Conditions conditions = 1;
}

message GetIpamServiceIpaddressesByConditionReply {
  IpamServiceIpaddresses ipamServiceIpaddresses = 1;
}

message ListIpamServiceIpaddressesByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message ListIpamServiceIpaddressesByIDsReply {
  repeated IpamServiceIpaddresses ipamServiceIpaddressess = 1;
}

message ListIpamServiceIpaddressesByLastIDRequest {
  uint64 lastID = 1 [(tagger.tags) = "form:\"lastID\""]; // last id
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -id, the - sign indicates descending order.
}

message ListIpamServiceIpaddressesByLastIDReply {
  repeated IpamServiceIpaddresses ipamServiceIpaddressess = 1;
}


