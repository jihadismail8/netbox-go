            (2) If you want to switch to camelCase naming and update the JSON tag name accordingly, such as:
                 string order_id = 1 [json_name = "orderID", (tagger.tags) = "json:\"orderID\""];
*/


message CreateVpnL2VpnRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	string name = 4; 
	string slug = 5; 
	string type = 6; 
	int64 identifier = 7; 
	string description = 8; 
	int64 tenantID = 9; 
	string comments = 10; 
	string status = 11; 
}

message CreateVpnL2VpnReply {
  uint64 id = 1;
}

message DeleteVpnL2VpnByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteVpnL2VpnByIDReply {

}

message UpdateVpnL2VpnByIDRequest {
	uint64 id = 1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	string created = 2; 
	string lastUpdated = 3; 
	string customFieldData = 4; 
	string name = 5; 
	string slug = 6; 
	string type = 7; 
	int64 identifier = 8; 
	string description = 9; 
	int64 tenantID = 10; 
	string comments = 11; 
	string status = 12; 
}

message UpdateVpnL2VpnByIDReply {

}

message VpnL2Vpn {
	uint64 id = 1; 
	string created = 2; 
	string lastUpdated = 3; 
	string customFieldData = 4; 
	string name = 5; 
	string slug = 6; 
	string type = 7; 
	int64 identifier = 8; 
	string description = 9; 
	int64 tenantID = 10; 
	string comments = 11; 
	string status = 12; 
}

message GetVpnL2VpnByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\"" ];
}

message GetVpnL2VpnByIDReply {
  VpnL2Vpn vpnL2Vpn = 1;
}

message ListVpnL2VpnRequest {
  api.types.Params params = 1;
}

message ListVpnL2VpnReply {
  int64 total = 1;
  repeated VpnL2Vpn vpnL2Vpns = 2;
}

message DeleteVpnL2VpnByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteVpnL2VpnByIDsReply {

}

message GetVpnL2VpnByConditionRequest {
  types.Conditions conditions = 1;
}

message GetVpnL2VpnByConditionReply {
  VpnL2Vpn vpnL2Vpn = 1;
}

message ListVpnL2VpnByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message ListVpnL2VpnByIDsReply {
  repeated VpnL2Vpn vpnL2Vpns = 1;
}

message ListVpnL2VpnByLastIDRequest {
  uint64 lastID = 1 [(tagger.tags) = "form:\"lastID\""]; // last id
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -id, the - sign indicates descending order.
}

message ListVpnL2VpnByLastIDReply {
  repeated VpnL2Vpn vpnL2Vpns = 1;
}


