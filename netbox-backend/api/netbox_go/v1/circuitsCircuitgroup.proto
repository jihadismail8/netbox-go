syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service circuitsCircuitgroup {
  // Create a new circuitsCircuitgroup
  rpc Create(CreateCircuitsCircuitgroupRequest) returns (CreateCircuitsCircuitgroupReply) {
    option (google.api.http) = {
      post: "/api/circuits/circuitgroups"
      body: "*"
    };
  }

  // Delete a circuitsCircuitgroup by id
  rpc DeleteByID(DeleteCircuitsCircuitgroupByIDRequest) returns (DeleteCircuitsCircuitgroupByIDReply) {
    option (google.api.http) = {
      delete: "/api/circuits/circuitgroups/{id}"
    };
  }

  // Update a circuitsCircuitgroup by id
  rpc UpdateByID(UpdateCircuitsCircuitgroupByIDRequest) returns (UpdateCircuitsCircuitgroupByIDReply) {
    option (google.api.http) = {
      put: "/api/circuits/circuitgroups/{id}"
      body: "*"
    };
  }

  // Get a circuitsCircuitgroup by id
  rpc GetByID(GetCircuitsCircuitgroupByIDRequest) returns (GetCircuitsCircuitgroupByIDReply) {
    option (google.api.http) = {
      get: "/api/circuits/circuitgroups/{id}"
    };
  }

  // Get a paginated list of circuitsCircuitgroup by custom conditions
  rpc List(ListCircuitsCircuitgroupRequest) returns (ListCircuitsCircuitgroupReply) {
    option (google.api.http) = {
      post: "/api/circuits/circuitgroups/list"
      body: "*"
    };
  }

  // Batch delete circuitsCircuitgroup by ids
  rpc DeleteByIDs(DeleteCircuitsCircuitgroupByIDsRequest) returns (DeleteCircuitsCircuitgroupByIDsReply) {
    option (google.api.http) = {
      post: "/api/circuits/circuitgroups/delete/ids"
      body: "*"
    };
  }

  // Get a circuitsCircuitgroup by custom condition
  rpc GetByCondition(GetCircuitsCircuitgroupByConditionRequest) returns (GetCircuitsCircuitgroupByConditionReply) {
    option (google.api.http) = {
      post: "/api/circuits/circuitgroups/condition"
      body: "*"
    };
  }

  // Batch get circuitsCircuitgroup by ids
  rpc ListByIDs(ListCircuitsCircuitgroupByIDsRequest) returns (ListCircuitsCircuitgroupByIDsReply) {
    option (google.api.http) = {
      post: "/api/circuits/circuitgroups/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of circuitsCircuitgroup by last id
  rpc ListByLastID(ListCircuitsCircuitgroupByLastIDRequest) returns (ListCircuitsCircuitgroupByLastIDReply) {
    option (google.api.http) = {
      get: "/api/circuits/circuitgroups"
    };
  }
}


/*
Notes for defining message fields:
    1. Suggest using camel case style naming for message field names, such as firstName, lastName, etc.
    2. If the message field name ending in 'id', it is recommended to use xxxID naming format, such as userID, orderID, etc.
    3. Add validate rules https://github.com/envoyproxy/protoc-gen-validate#constraint-rules, such as:
        uint64 id = 1 [(validate.rules).uint64.gte  = 1];

If used to generate code that supports the HTTP protocol, notes for defining message fields:
    1. If the route contains the path parameter, such as /api/v1/circuitsCircuitgroup/{id}, the defined
        message must contain the name of the path parameter and the name should be added
        with a new tag, such as int64 id = 1 [(tagger.tags) = "uri:\"id\""];
    2. If the request url is followed by a query parameter, such as /api/v1/getCircuitsCircuitgroup?name=Tom,
        a form tag must be added when defining the query parameter in the message, such as:
        string name = 1 [(tagger.tags) = "form:\"name\""].
    3. When the message fields use snake_case naming (e.g., order_id), the generated swagger.json file
        will use camelCase (e.g., orderId) instead of the expected snake_case. This behavior aligns with
        the JSON tag names used by gRPC, but it can cause the Gin framework to fail to correctly bind and
        retrieve parameter values. There are two ways to resolve this issue:
            (1) Explicitly specify the JSON tag name using the json_name option, such as:
                 string order_id = 1 [json_name = "order_id"];
            (2) If you want to switch to camelCase naming and update the JSON tag name accordingly, such as:
                 string order_id = 1 [json_name = "orderID", (tagger.tags) = "json:\"orderID\""];
*/


message CreateCircuitsCircuitgroupRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	string name = 4; 
	string slug = 5; 
	string description = 6; 
	int64 tenantID = 7; 
}

message CreateCircuitsCircuitgroupReply {
  uint64 id = 1;
}

message DeleteCircuitsCircuitgroupByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteCircuitsCircuitgroupByIDReply {

}

message UpdateCircuitsCircuitgroupByIDRequest {
	uint64 id = 1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	string created = 2; 
	string lastUpdated = 3; 
	string customFieldData = 4; 
	string name = 5; 
	string slug = 6; 
	string description = 7; 
	int64 tenantID = 8; 
}

message UpdateCircuitsCircuitgroupByIDReply {

}

message CircuitsCircuitgroup {
	uint64 id = 1; 
	string created = 2; 
	string lastUpdated = 3; 
	string customFieldData = 4; 
	string name = 5; 
	string slug = 6; 
	string description = 7; 
	int64 tenantID = 8; 
}

message GetCircuitsCircuitgroupByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\"" ];
}

message GetCircuitsCircuitgroupByIDReply {
  CircuitsCircuitgroup circuitsCircuitgroup = 1;
}

message ListCircuitsCircuitgroupRequest {
  api.types.Params params = 1;
}

message ListCircuitsCircuitgroupReply {
  int64 total = 1;
  repeated CircuitsCircuitgroup circuitsCircuitgroups = 2;
}

message DeleteCircuitsCircuitgroupByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteCircuitsCircuitgroupByIDsReply {

}

message GetCircuitsCircuitgroupByConditionRequest {
  types.Conditions conditions = 1;
}

message GetCircuitsCircuitgroupByConditionReply {
  CircuitsCircuitgroup circuitsCircuitgroup = 1;
}

message ListCircuitsCircuitgroupByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message ListCircuitsCircuitgroupByIDsReply {
  repeated CircuitsCircuitgroup circuitsCircuitgroups = 1;
}

message ListCircuitsCircuitgroupByLastIDRequest {
  uint64 lastID = 1 [(tagger.tags) = "form:\"lastID\""]; // last id
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -id, the - sign indicates descending order.
}

message ListCircuitsCircuitgroupByLastIDReply {
  repeated CircuitsCircuitgroup circuitsCircuitgroups = 1;
}


