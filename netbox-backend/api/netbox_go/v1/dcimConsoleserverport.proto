service dcimConsoleserverport {
  // Create a new dcimConsoleserverport
  rpc Create(CreateDcimConsoleserverportRequest) returns (CreateDcimConsoleserverportReply) {
    option (google.api.http) = {
      post: "/api/dcim/consoleserverports"
      body: "*"
    };
  }

  // Delete a dcimConsoleserverport by id
  rpc DeleteByID(DeleteDcimConsoleserverportByIDRequest) returns (DeleteDcimConsoleserverportByIDReply) {
    option (google.api.http) = {
      delete: "/api/dcim/consoleserverports/{id}"
    };
  }

  // Update a dcimConsoleserverport by id
  rpc UpdateByID(UpdateDcimConsoleserverportByIDRequest) returns (UpdateDcimConsoleserverportByIDReply) {
    option (google.api.http) = {
      put: "/api/dcim/consoleserverports/{id}"
      body: "*"
    };
  }

  // Get a dcimConsoleserverport by id
  rpc GetByID(GetDcimConsoleserverportByIDRequest) returns (GetDcimConsoleserverportByIDReply) {
    option (google.api.http) = {
      get: "/api/dcim/consoleserverports/{id}"
    };
  }

  // Get a paginated list of dcimConsoleserverport by custom conditions
  rpc List(ListDcimConsoleserverportRequest) returns (ListDcimConsoleserverportReply) {
    option (google.api.http) = {
      post: "/api/dcim/consoleserverports/list"
      body: "*"
    };
  }

  // Batch delete dcimConsoleserverport by ids
  rpc DeleteByIDs(DeleteDcimConsoleserverportByIDsRequest) returns (DeleteDcimConsoleserverportByIDsReply) {
    option (google.api.http) = {
      post: "/api/dcim/consoleserverports/delete/ids"
      body: "*"
    };
  }

  // Get a dcimConsoleserverport by custom condition
  rpc GetByCondition(GetDcimConsoleserverportByConditionRequest) returns (GetDcimConsoleserverportByConditionReply) {
    option (google.api.http) = {
      post: "/api/dcim/consoleserverports/condition"
      body: "*"
    };
  }

  // Batch get dcimConsoleserverport by ids
  rpc ListByIDs(ListDcimConsoleserverportByIDsRequest) returns (ListDcimConsoleserverportByIDsReply) {
    option (google.api.http) = {
      post: "/api/dcim/consoleserverports/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of dcimConsoleserverport by last id
  rpc ListByLastID(ListDcimConsoleserverportByLastIDRequest) returns (ListDcimConsoleserverportByLastIDReply) {
    option (google.api.http) = {
      get: "/api/dcim/consoleserverports"
    };
  }
}


