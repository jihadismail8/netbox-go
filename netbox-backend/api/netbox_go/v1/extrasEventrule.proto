message CreateExtrasEventruleRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	string name = 4; 
	string description = 5; 
	bool enabled = 6; 
	string conditions = 7; 
	string actionType = 8; 
	int64 actionObjectID = 9; 
	string actionData = 10; 
	string comments = 11; 
	int32 actionObjectTypeID = 12; 
	string eventTypes = 13; 
}

message CreateExtrasEventruleReply {
  uint64 id = 1;
}

message DeleteExtrasEventruleByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteExtrasEventruleByIDReply {

}

message UpdateExtrasEventruleByIDRequest {
	uint64 id = 1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	string created = 2; 
	string lastUpdated = 3; 
	string customFieldData = 4; 
	string name = 5; 
	string description = 6; 
	bool enabled = 7; 
	string conditions = 8; 
	string actionType = 9; 
	int64 actionObjectID = 10; 
	string actionData = 11; 
	string comments = 12; 
	int32 actionObjectTypeID = 13; 
	string eventTypes = 14; 
}

message UpdateExtrasEventruleByIDReply {

}

message ExtrasEventrule {
	uint64 id = 1; 
	string created = 2; 
	string lastUpdated = 3; 
	string customFieldData = 4; 
	string name = 5; 
	string description = 6; 
	bool enabled = 7; 
	string conditions = 8; 
	string actionType = 9; 
	int64 actionObjectID = 10; 
	string actionData = 11; 
	string comments = 12; 
	int32 actionObjectTypeID = 13; 
	string eventTypes = 14; 
}

message GetExtrasEventruleByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\"" ];
}

message GetExtrasEventruleByIDReply {
