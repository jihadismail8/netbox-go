}

message ListExtrasEventruleRequest {
  api.types.Params params = 1;
}

message ListExtrasEventruleReply {
  int64 total = 1;
  repeated ExtrasEventrule extrasEventrules = 2;
}

message DeleteExtrasEventruleByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteExtrasEventruleByIDsReply {

}

message GetExtrasEventruleByConditionRequest {
  types.Conditions conditions = 1;
}

message GetExtrasEventruleByConditionReply {
  ExtrasEventrule extrasEventrule = 1;
}

message ListExtrasEventruleByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message ListExtrasEventruleByIDsReply {
