syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service extrasEventrule {
  // Create a new extrasEventrule
  rpc Create(CreateExtrasEventruleRequest) returns (CreateExtrasEventruleReply) {
    option (google.api.http) = {
      post: "/api/extras/eventrules"
      body: "*"
    };
  }

  // Delete a extrasEventrule by id
  rpc DeleteByID(DeleteExtrasEventruleByIDRequest) returns (DeleteExtrasEventruleByIDReply) {
    option (google.api.http) = {
      delete: "/api/extras/eventrules/{id}"
    };
  }

  // Update a extrasEventrule by id
  rpc UpdateByID(UpdateExtrasEventruleByIDRequest) returns (UpdateExtrasEventruleByIDReply) {
    option (google.api.http) = {
      put: "/api/extras/eventrules/{id}"
      body: "*"
    };
  }

  // Get a extrasEventrule by id
  rpc GetByID(GetExtrasEventruleByIDRequest) returns (GetExtrasEventruleByIDReply) {
    option (google.api.http) = {
      get: "/api/extras/eventrules/{id}"
    };
  }

  // Get a paginated list of extrasEventrule by custom conditions
  rpc List(ListExtrasEventruleRequest) returns (ListExtrasEventruleReply) {
    option (google.api.http) = {
      post: "/api/extras/eventrules/list"
      body: "*"
    };
  }

  // Batch delete extrasEventrule by ids
  rpc DeleteByIDs(DeleteExtrasEventruleByIDsRequest) returns (DeleteExtrasEventruleByIDsReply) {
    option (google.api.http) = {
      post: "/api/extras/eventrules/delete/ids"
      body: "*"
    };
  }

  // Get a extrasEventrule by custom condition
  rpc GetByCondition(GetExtrasEventruleByConditionRequest) returns (GetExtrasEventruleByConditionReply) {
    option (google.api.http) = {
      post: "/api/extras/eventrules/condition"
      body: "*"
    };
  }

  // Batch get extrasEventrule by ids
  rpc ListByIDs(ListExtrasEventruleByIDsRequest) returns (ListExtrasEventruleByIDsReply) {
    option (google.api.http) = {
      post: "/api/extras/eventrules/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of extrasEventrule by last id
  rpc ListByLastID(ListExtrasEventruleByLastIDRequest) returns (ListExtrasEventruleByLastIDReply) {
    option (google.api.http) = {
      get: "/api/extras/eventrules"
    };
  }
}


