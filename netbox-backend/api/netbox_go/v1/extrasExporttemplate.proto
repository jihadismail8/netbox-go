syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service extrasExporttemplate {
  // Create a new extrasExporttemplate
  rpc Create(CreateExtrasExporttemplateRequest) returns (CreateExtrasExporttemplateReply) {
    option (google.api.http) = {
      post: "/api/extras/exporttemplates"
      body: "*"
    };
  }

  // Delete a extrasExporttemplate by id
  rpc DeleteByID(DeleteExtrasExporttemplateByIDRequest) returns (DeleteExtrasExporttemplateByIDReply) {
    option (google.api.http) = {
      delete: "/api/extras/exporttemplates/{id}"
    };
  }

  // Update a extrasExporttemplate by id
  rpc UpdateByID(UpdateExtrasExporttemplateByIDRequest) returns (UpdateExtrasExporttemplateByIDReply) {
    option (google.api.http) = {
      put: "/api/extras/exporttemplates/{id}"
      body: "*"
    };
  }

  // Get a extrasExporttemplate by id
  rpc GetByID(GetExtrasExporttemplateByIDRequest) returns (GetExtrasExporttemplateByIDReply) {
    option (google.api.http) = {
      get: "/api/extras/exporttemplates/{id}"
    };
  }

  // Get a paginated list of extrasExporttemplate by custom conditions
  rpc List(ListExtrasExporttemplateRequest) returns (ListExtrasExporttemplateReply) {
    option (google.api.http) = {
      post: "/api/extras/exporttemplates/list"
      body: "*"
    };
  }

  // Batch delete extrasExporttemplate by ids
  rpc DeleteByIDs(DeleteExtrasExporttemplateByIDsRequest) returns (DeleteExtrasExporttemplateByIDsReply) {
    option (google.api.http) = {
      post: "/api/extras/exporttemplates/delete/ids"
      body: "*"
    };
  }

  // Get a extrasExporttemplate by custom condition
  rpc GetByCondition(GetExtrasExporttemplateByConditionRequest) returns (GetExtrasExporttemplateByConditionReply) {
    option (google.api.http) = {
      post: "/api/extras/exporttemplates/condition"
      body: "*"
    };
  }

  // Batch get extrasExporttemplate by ids
  rpc ListByIDs(ListExtrasExporttemplateByIDsRequest) returns (ListExtrasExporttemplateByIDsReply) {
    option (google.api.http) = {
      post: "/api/extras/exporttemplates/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of extrasExporttemplate by last id
  rpc ListByLastID(ListExtrasExporttemplateByLastIDRequest) returns (ListExtrasExporttemplateByLastIDReply) {
    option (google.api.http) = {
      get: "/api/extras/exporttemplates"
    };
  }
}


