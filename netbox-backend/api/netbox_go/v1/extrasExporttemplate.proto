*/


message CreateExtrasExporttemplateRequest {
	string name = 1; 
	string description = 2; 
	string templateCode = 3; 
	string mimeType = 4; 
	string fileExtension = 5; 
	bool asAttachment = 6; 
	string created = 7; 
	string lastUpdated = 8; 
	int64 dataFileID = 9; 
	string dataPath = 10; 
	int64 dataSourceID = 11; 
	bool autoSyncEnabled = 12; 
	string dataSynced = 13; 
	string fileName = 14; 
	string environmentParams = 15; 
}

message CreateExtrasExporttemplateReply {
  uint64 id = 1;
}

message DeleteExtrasExporttemplateByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteExtrasExporttemplateByIDReply {

}

message UpdateExtrasExporttemplateByIDRequest {
	uint64 id = 1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	string name = 2; 
	string description = 3; 
	string templateCode = 4; 
	string mimeType = 5; 
	string fileExtension = 6; 
	bool asAttachment = 7; 
	string created = 8; 
	string lastUpdated = 9; 
	int64 dataFileID = 10; 
	string dataPath = 11; 
	int64 dataSourceID = 12; 
	bool autoSyncEnabled = 13; 
	string dataSynced = 14; 
	string fileName = 15; 
	string environmentParams = 16; 
}

message UpdateExtrasExporttemplateByIDReply {

}

message ExtrasExporttemplate {
	uint64 id = 1; 
	string name = 2; 
	string description = 3; 
	string templateCode = 4; 
	string mimeType = 5; 
	string fileExtension = 6; 
	bool asAttachment = 7; 
	string created = 8; 
	string lastUpdated = 9; 
	int64 dataFileID = 10; 
	string dataPath = 11; 
	int64 dataSourceID = 12; 
	bool autoSyncEnabled = 13; 
	string dataSynced = 14; 
	string fileName = 15; 
	string environmentParams = 16; 
}

message GetExtrasExporttemplateByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\"" ];
}

message GetExtrasExporttemplateByIDReply {
  ExtrasExporttemplate extrasExporttemplate = 1;
}

message ListExtrasExporttemplateRequest {
  api.types.Params params = 1;
}

message ListExtrasExporttemplateReply {
  int64 total = 1;
  repeated ExtrasExporttemplate extrasExporttemplates = 2;
}

message DeleteExtrasExporttemplateByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteExtrasExporttemplateByIDsReply {

}

message GetExtrasExporttemplateByConditionRequest {
  types.Conditions conditions = 1;
}

message GetExtrasExporttemplateByConditionReply {
  ExtrasExporttemplate extrasExporttemplate = 1;
}

message ListExtrasExporttemplateByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message ListExtrasExporttemplateByIDsReply {
  repeated ExtrasExporttemplate extrasExporttemplates = 1;
}

message ListExtrasExporttemplateByLastIDRequest {
  uint64 lastID = 1 [(tagger.tags) = "form:\"lastID\""]; // last id
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -id, the - sign indicates descending order.
}

message ListExtrasExporttemplateByLastIDReply {
  repeated ExtrasExporttemplate extrasExporttemplates = 1;
}


