message CreateDcimInventoryitemtemplateRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string name = 3; 
	string label = 4; 
	string description = 5; 
	int64 componentID = 6; 
	string partID = 7; 
	int32 lft = 8; 
	int32 rght = 9; 
	int32 treeID = 10; 
	int32 level = 11; 
	int32 componentTypeID = 12; 
	int64 deviceTypeID = 13; 
	int64 manufacturerID = 14; 
	int64 parentID = 15; 
	int64 roleID = 16; 
}

message CreateDcimInventoryitemtemplateReply {
  uint64 id = 1;
}

message DeleteDcimInventoryitemtemplateByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteDcimInventoryitemtemplateByIDReply {

}

message UpdateDcimInventoryitemtemplateByIDRequest {
	uint64 id = 1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	string created = 2; 
	string lastUpdated = 3; 
	string name = 4; 
	string label = 5; 
	string description = 6; 
	int64 componentID = 7; 
	string partID = 8; 
	int32 lft = 9; 
	int32 rght = 10; 
	int32 treeID = 11; 
	int32 level = 12; 
	int32 componentTypeID = 13; 
	int64 deviceTypeID = 14; 
	int64 manufacturerID = 15; 
	int64 parentID = 16; 
	int64 roleID = 17; 
}

message UpdateDcimInventoryitemtemplateByIDReply {

}

message DcimInventoryitemtemplate {
	uint64 id = 1; 
	string created = 2; 
	string lastUpdated = 3; 
	string name = 4; 
	string label = 5; 
	string description = 6; 
	int64 componentID = 7; 
	string partID = 8; 
	int32 lft = 9; 
	int32 rght = 10; 
	int32 treeID = 11; 
	int32 level = 12; 
	int32 componentTypeID = 13; 
	int64 deviceTypeID = 14; 
	int64 manufacturerID = 15; 
	int64 parentID = 16; 
	int64 roleID = 17; 
}

message GetDcimInventoryitemtemplateByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\"" ];
}

message GetDcimInventoryitemtemplateByIDReply {
  DcimInventoryitemtemplate dcimInventoryitemtemplate = 1;
}

message ListDcimInventoryitemtemplateRequest {
  api.types.Params params = 1;
}

message ListDcimInventoryitemtemplateReply {
  int64 total = 1;
  repeated DcimInventoryitemtemplate dcimInventoryitemtemplates = 2;
}

message DeleteDcimInventoryitemtemplateByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteDcimInventoryitemtemplateByIDsReply {

}

message GetDcimInventoryitemtemplateByConditionRequest {
  types.Conditions conditions = 1;
}

message GetDcimInventoryitemtemplateByConditionReply {
  DcimInventoryitemtemplate dcimInventoryitemtemplate = 1;
}

message ListDcimInventoryitemtemplateByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message ListDcimInventoryitemtemplateByIDsReply {
  repeated DcimInventoryitemtemplate dcimInventoryitemtemplates = 1;
}

message ListDcimInventoryitemtemplateByLastIDRequest {
  uint64 lastID = 1 [(tagger.tags) = "form:\"lastID\""]; // last id
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -id, the - sign indicates descending order.
}

message ListDcimInventoryitemtemplateByLastIDReply {
  repeated DcimInventoryitemtemplate dcimInventoryitemtemplates = 1;
}


