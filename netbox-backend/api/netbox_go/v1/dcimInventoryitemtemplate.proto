syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service dcimInventoryitemtemplate {
  // Create a new dcimInventoryitemtemplate
  rpc Create(CreateDcimInventoryitemtemplateRequest) returns (CreateDcimInventoryitemtemplateReply) {
    option (google.api.http) = {
      post: "/api/dcim/inventoryitemtemplates"
      body: "*"
    };
  }

  // Delete a dcimInventoryitemtemplate by id
  rpc DeleteByID(DeleteDcimInventoryitemtemplateByIDRequest) returns (DeleteDcimInventoryitemtemplateByIDReply) {
    option (google.api.http) = {
      delete: "/api/dcim/inventoryitemtemplates/{id}"
    };
  }

  // Update a dcimInventoryitemtemplate by id
  rpc UpdateByID(UpdateDcimInventoryitemtemplateByIDRequest) returns (UpdateDcimInventoryitemtemplateByIDReply) {
    option (google.api.http) = {
      put: "/api/dcim/inventoryitemtemplates/{id}"
      body: "*"
    };
  }

  // Get a dcimInventoryitemtemplate by id
  rpc GetByID(GetDcimInventoryitemtemplateByIDRequest) returns (GetDcimInventoryitemtemplateByIDReply) {
    option (google.api.http) = {
      get: "/api/dcim/inventoryitemtemplates/{id}"
    };
  }

  // Get a paginated list of dcimInventoryitemtemplate by custom conditions
  rpc List(ListDcimInventoryitemtemplateRequest) returns (ListDcimInventoryitemtemplateReply) {
    option (google.api.http) = {
      post: "/api/dcim/inventoryitemtemplates/list"
      body: "*"
    };
  }

  // Batch delete dcimInventoryitemtemplate by ids
  rpc DeleteByIDs(DeleteDcimInventoryitemtemplateByIDsRequest) returns (DeleteDcimInventoryitemtemplateByIDsReply) {
    option (google.api.http) = {
      post: "/api/dcim/inventoryitemtemplates/delete/ids"
      body: "*"
    };
  }

  // Get a dcimInventoryitemtemplate by custom condition
  rpc GetByCondition(GetDcimInventoryitemtemplateByConditionRequest) returns (GetDcimInventoryitemtemplateByConditionReply) {
    option (google.api.http) = {
      post: "/api/dcim/inventoryitemtemplates/condition"
      body: "*"
    };
  }

  // Batch get dcimInventoryitemtemplate by ids
  rpc ListByIDs(ListDcimInventoryitemtemplateByIDsRequest) returns (ListDcimInventoryitemtemplateByIDsReply) {
    option (google.api.http) = {
      post: "/api/dcim/inventoryitemtemplates/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of dcimInventoryitemtemplate by last id
  rpc ListByLastID(ListDcimInventoryitemtemplateByLastIDRequest) returns (ListDcimInventoryitemtemplateByLastIDReply) {
    option (google.api.http) = {
      get: "/api/dcim/inventoryitemtemplates"
    };
  }
}


