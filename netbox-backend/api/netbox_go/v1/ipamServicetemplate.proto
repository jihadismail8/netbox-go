syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service ipamServicetemplate {
  // Create a new ipamServicetemplate
  rpc Create(CreateIpamServicetemplateRequest) returns (CreateIpamServicetemplateReply) {
    option (google.api.http) = {
      post: "/api/ipam/servicetemplates"
      body: "*"
    };
  }

  // Delete a ipamServicetemplate by id
  rpc DeleteByID(DeleteIpamServicetemplateByIDRequest) returns (DeleteIpamServicetemplateByIDReply) {
    option (google.api.http) = {
      delete: "/api/ipam/servicetemplates/{id}"
    };
  }

  // Update a ipamServicetemplate by id
  rpc UpdateByID(UpdateIpamServicetemplateByIDRequest) returns (UpdateIpamServicetemplateByIDReply) {
    option (google.api.http) = {
      put: "/api/ipam/servicetemplates/{id}"
      body: "*"
    };
  }

  // Get a ipamServicetemplate by id
  rpc GetByID(GetIpamServicetemplateByIDRequest) returns (GetIpamServicetemplateByIDReply) {
    option (google.api.http) = {
      get: "/api/ipam/servicetemplates/{id}"
    };
  }

  // Get a paginated list of ipamServicetemplate by custom conditions
  rpc List(ListIpamServicetemplateRequest) returns (ListIpamServicetemplateReply) {
    option (google.api.http) = {
      post: "/api/ipam/servicetemplates/list"
      body: "*"
    };
  }

  // Batch delete ipamServicetemplate by ids
  rpc DeleteByIDs(DeleteIpamServicetemplateByIDsRequest) returns (DeleteIpamServicetemplateByIDsReply) {
    option (google.api.http) = {
      post: "/api/ipam/servicetemplates/delete/ids"
      body: "*"
    };
  }

  // Get a ipamServicetemplate by custom condition
  rpc GetByCondition(GetIpamServicetemplateByConditionRequest) returns (GetIpamServicetemplateByConditionReply) {
    option (google.api.http) = {
      post: "/api/ipam/servicetemplates/condition"
      body: "*"
    };
  }

  // Batch get ipamServicetemplate by ids
  rpc ListByIDs(ListIpamServicetemplateByIDsRequest) returns (ListIpamServicetemplateByIDsReply) {
    option (google.api.http) = {
      post: "/api/ipam/servicetemplates/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of ipamServicetemplate by last id
  rpc ListByLastID(ListIpamServicetemplateByLastIDRequest) returns (ListIpamServicetemplateByLastIDReply) {
    option (google.api.http) = {
      get: "/api/ipam/servicetemplates"
    };
  }
}


