message CreateIpamServicetemplateRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	string protocol = 4; 
	string ports = 5; 
	string description = 6; 
	string name = 7; 
	string comments = 8; 
}

message CreateIpamServicetemplateReply {
  uint64 id = 1;
}

