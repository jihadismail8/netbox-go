syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service dcimFrontport {
  // Create a new dcimFrontport
  rpc Create(CreateDcimFrontportRequest) returns (CreateDcimFrontportReply) {
    option (google.api.http) = {
      post: "/api/dcim/frontports"
      body: "*"
    };
  }

  // Delete a dcimFrontport by id
  rpc DeleteByID(DeleteDcimFrontportByIDRequest) returns (DeleteDcimFrontportByIDReply) {
    option (google.api.http) = {
      delete: "/api/dcim/frontports/{id}"
    };
  }

  // Update a dcimFrontport by id
  rpc UpdateByID(UpdateDcimFrontportByIDRequest) returns (UpdateDcimFrontportByIDReply) {
    option (google.api.http) = {
      put: "/api/dcim/frontports/{id}"
      body: "*"
    };
  }

  // Get a dcimFrontport by id
  rpc GetByID(GetDcimFrontportByIDRequest) returns (GetDcimFrontportByIDReply) {
    option (google.api.http) = {
      get: "/api/dcim/frontports/{id}"
    };
  }

  // Get a paginated list of dcimFrontport by custom conditions
  rpc List(ListDcimFrontportRequest) returns (ListDcimFrontportReply) {
    option (google.api.http) = {
      post: "/api/dcim/frontports/list"
      body: "*"
    };
  }

  // Batch delete dcimFrontport by ids
  rpc DeleteByIDs(DeleteDcimFrontportByIDsRequest) returns (DeleteDcimFrontportByIDsReply) {
    option (google.api.http) = {
      post: "/api/dcim/frontports/delete/ids"
      body: "*"
    };
  }

  // Get a dcimFrontport by custom condition
  rpc GetByCondition(GetDcimFrontportByConditionRequest) returns (GetDcimFrontportByConditionReply) {
    option (google.api.http) = {
      post: "/api/dcim/frontports/condition"
      body: "*"
    };
  }

  // Batch get dcimFrontport by ids
  rpc ListByIDs(ListDcimFrontportByIDsRequest) returns (ListDcimFrontportByIDsReply) {
    option (google.api.http) = {
      post: "/api/dcim/frontports/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of dcimFrontport by last id
  rpc ListByLastID(ListDcimFrontportByLastIDRequest) returns (ListDcimFrontportByLastIDReply) {
    option (google.api.http) = {
      get: "/api/dcim/frontports"
    };
  }
}


/*
Notes for defining message fields:
    1. Suggest using camel case style naming for message field names, such as firstName, lastName, etc.
    2. If the message field name ending in 'id', it is recommended to use xxxID naming format, such as userID, orderID, etc.
    3. Add validate rules https://github.com/envoyproxy/protoc-gen-validate#constraint-rules, such as:
        uint64 id = 1 [(validate.rules).uint64.gte  = 1];

If used to generate code that supports the HTTP protocol, notes for defining message fields:
    1. If the route contains the path parameter, such as /api/v1/dcimFrontport/{id}, the defined
        message must contain the name of the path parameter and the name should be added
        with a new tag, such as int64 id = 1 [(tagger.tags) = "uri:\"id\""];
    2. If the request url is followed by a query parameter, such as /api/v1/getDcimFrontport?name=Tom,
        a form tag must be added when defining the query parameter in the message, such as:
        string name = 1 [(tagger.tags) = "form:\"name\""].
    3. When the message fields use snake_case naming (e.g., order_id), the generated swagger.json file
        will use camelCase (e.g., orderId) instead of the expected snake_case. This behavior aligns with
        the JSON tag names used by gRPC, but it can cause the Gin framework to fail to correctly bind and
        retrieve parameter values. There are two ways to resolve this issue:
            (1) Explicitly specify the JSON tag name using the json_name option, such as:
                 string order_id = 1 [json_name = "order_id"];
            (2) If you want to switch to camelCase naming and update the JSON tag name accordingly, such as:
                 string order_id = 1 [json_name = "orderID", (tagger.tags) = "json:\"orderID\""];
*/


message CreateDcimFrontportRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	string name = 4; 
	string label = 5; 
	string description = 6; 
	bool markConnected = 7; 
	string type = 8; 
	int32 rearPortPosition = 9; 
	int64 cableID = 10; 
	int64 deviceID = 11; 
	int64 rearPortID = 12; 
	string color = 13; 
	int64 moduleID = 14; 
	string cableEnd = 15; 
	int64 xLocationID = 16; 
	int64 xRackID = 17; 
	int64 xSiteID = 18; 
}

message CreateDcimFrontportReply {
  uint64 id = 1;
}

message DeleteDcimFrontportByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteDcimFrontportByIDReply {

}

message UpdateDcimFrontportByIDRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	uint64 id = 4 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	string name = 5; 
	string label = 6; 
	string description = 7; 
	bool markConnected = 8; 
	string type = 9; 
	int32 rearPortPosition = 10; 
	int64 cableID = 11; 
	int64 deviceID = 12; 
	int64 rearPortID = 13; 
	string color = 14; 
	int64 moduleID = 15; 
	string cableEnd = 16; 
	int64 xLocationID = 17; 
	int64 xRackID = 18; 
	int64 xSiteID = 19; 
}

message UpdateDcimFrontportByIDReply {

}

message DcimFrontport {
	string created = 1; 
	string lastUpdated = 2; 
	string customFieldData = 3; 
	uint64 id = 4; 
	string name = 5; 
	string label = 6; 
	string description = 7; 
	bool markConnected = 8; 
	string type = 9; 
	int32 rearPortPosition = 10; 
	int64 cableID = 11; 
	int64 deviceID = 12; 
	int64 rearPortID = 13; 
	string color = 14; 
	int64 moduleID = 15; 
	string cableEnd = 16; 
	int64 xLocationID = 17; 
	int64 xRackID = 18; 
	int64 xSiteID = 19; 
}

message GetDcimFrontportByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\"" ];
}

message GetDcimFrontportByIDReply {
  DcimFrontport dcimFrontport = 1;
}

message ListDcimFrontportRequest {
  api.types.Params params = 1;
}

message ListDcimFrontportReply {
  int64 total = 1;
  repeated DcimFrontport dcimFrontports = 2;
}

message DeleteDcimFrontportByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteDcimFrontportByIDsReply {

}

message GetDcimFrontportByConditionRequest {
  types.Conditions conditions = 1;
}

message GetDcimFrontportByConditionReply {
  DcimFrontport dcimFrontport = 1;
}

message ListDcimFrontportByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message ListDcimFrontportByIDsReply {
  repeated DcimFrontport dcimFrontports = 1;
}

message ListDcimFrontportByLastIDRequest {
  uint64 lastID = 1 [(tagger.tags) = "form:\"lastID\""]; // last id
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -id, the - sign indicates descending order.
}

message ListDcimFrontportByLastIDReply {
  repeated DcimFrontport dcimFrontports = 1;
}


