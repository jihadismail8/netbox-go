            (2) If you want to switch to camelCase naming and update the JSON tag name accordingly, such as:
                 string order_id = 1 [json_name = "orderID", (tagger.tags) = "json:\"orderID\""];
*/


message CreateDcimFrontporttemplateRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string name = 3; 
	string label = 4; 
	string description = 5; 
	string type = 6; 
	int32 rearPortPosition = 7; 
	int64 deviceTypeID = 8; 
	int64 rearPortID = 9; 
	string color = 10; 
	int64 moduleTypeID = 11; 
}

message CreateDcimFrontporttemplateReply {
  uint64 id = 1;
}

message DeleteDcimFrontporttemplateByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteDcimFrontporttemplateByIDReply {

}

message UpdateDcimFrontporttemplateByIDRequest {
	string created = 1; 
	string lastUpdated = 2; 
	uint64 id = 3 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	string name = 4; 
	string label = 5; 
	string description = 6; 
	string type = 7; 
	int32 rearPortPosition = 8; 
	int64 deviceTypeID = 9; 
	int64 rearPortID = 10; 
	string color = 11; 
	int64 moduleTypeID = 12; 
}

message UpdateDcimFrontporttemplateByIDReply {

}

message DcimFrontporttemplate {
	string created = 1; 
	string lastUpdated = 2; 
	uint64 id = 3; 
	string name = 4; 
	string label = 5; 
	string description = 6; 
	string type = 7; 
	int32 rearPortPosition = 8; 
	int64 deviceTypeID = 9; 
	int64 rearPortID = 10; 
	string color = 11; 
	int64 moduleTypeID = 12; 
}

message GetDcimFrontporttemplateByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\"" ];
}

message GetDcimFrontporttemplateByIDReply {
  DcimFrontporttemplate dcimFrontporttemplate = 1;
}

message ListDcimFrontporttemplateRequest {
  api.types.Params params = 1;
}

message ListDcimFrontporttemplateReply {
  int64 total = 1;
  repeated DcimFrontporttemplate dcimFrontporttemplates = 2;
}

message DeleteDcimFrontporttemplateByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteDcimFrontporttemplateByIDsReply {

}

message GetDcimFrontporttemplateByConditionRequest {
  types.Conditions conditions = 1;
}

message GetDcimFrontporttemplateByConditionReply {
  DcimFrontporttemplate dcimFrontporttemplate = 1;
}

message ListDcimFrontporttemplateByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message ListDcimFrontporttemplateByIDsReply {
  repeated DcimFrontporttemplate dcimFrontporttemplates = 1;
}

message ListDcimFrontporttemplateByLastIDRequest {
  uint64 lastID = 1 [(tagger.tags) = "form:\"lastID\""]; // last id
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -id, the - sign indicates descending order.
}

message ListDcimFrontporttemplateByLastIDReply {
  repeated DcimFrontporttemplate dcimFrontporttemplates = 1;
}


