syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service wirelessWirelesslangroup {
  // Create a new wirelessWirelesslangroup
  rpc Create(CreateWirelessWirelesslangroupRequest) returns (CreateWirelessWirelesslangroupReply) {
    option (google.api.http) = {
      post: "/api/wireless/wirelesslangroups"
      body: "*"
    };
  }

  // Delete a wirelessWirelesslangroup by id
  rpc DeleteByID(DeleteWirelessWirelesslangroupByIDRequest) returns (DeleteWirelessWirelesslangroupByIDReply) {
    option (google.api.http) = {
      delete: "/api/wireless/wirelesslangroups/{id}"
    };
  }

  // Update a wirelessWirelesslangroup by id
  rpc UpdateByID(UpdateWirelessWirelesslangroupByIDRequest) returns (UpdateWirelessWirelesslangroupByIDReply) {
    option (google.api.http) = {
      put: "/api/wireless/wirelesslangroups/{id}"
      body: "*"
    };
  }

  // Get a wirelessWirelesslangroup by id
  rpc GetByID(GetWirelessWirelesslangroupByIDRequest) returns (GetWirelessWirelesslangroupByIDReply) {
    option (google.api.http) = {
      get: "/api/wireless/wirelesslangroups/{id}"
    };
  }

  // Get a paginated list of wirelessWirelesslangroup by custom conditions
  rpc List(ListWirelessWirelesslangroupRequest) returns (ListWirelessWirelesslangroupReply) {
    option (google.api.http) = {
      post: "/api/wireless/wirelesslangroups/list"
      body: "*"
    };
  }

  // Batch delete wirelessWirelesslangroup by ids
  rpc DeleteByIDs(DeleteWirelessWirelesslangroupByIDsRequest) returns (DeleteWirelessWirelesslangroupByIDsReply) {
    option (google.api.http) = {
      post: "/api/wireless/wirelesslangroups/delete/ids"
      body: "*"
    };
  }

  // Get a wirelessWirelesslangroup by custom condition
  rpc GetByCondition(GetWirelessWirelesslangroupByConditionRequest) returns (GetWirelessWirelesslangroupByConditionReply) {
    option (google.api.http) = {
      post: "/api/wireless/wirelesslangroups/condition"
      body: "*"
    };
  }

  // Batch get wirelessWirelesslangroup by ids
  rpc ListByIDs(ListWirelessWirelesslangroupByIDsRequest) returns (ListWirelessWirelesslangroupByIDsReply) {
    option (google.api.http) = {
      post: "/api/wireless/wirelesslangroups/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of wirelessWirelesslangroup by last id
  rpc ListByLastID(ListWirelessWirelesslangroupByLastIDRequest) returns (ListWirelessWirelesslangroupByLastIDReply) {
    option (google.api.http) = {
      get: "/api/wireless/wirelesslangroups"
    };
  }
}


