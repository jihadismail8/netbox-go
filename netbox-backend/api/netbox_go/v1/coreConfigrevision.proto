syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service coreConfigrevision {
  // Create a new coreConfigrevision
  rpc Create(CreateCoreConfigrevisionRequest) returns (CreateCoreConfigrevisionReply) {
    option (google.api.http) = {
      post: "/api/core/configrevisions"
      body: "*"
    };
  }

  // Delete a coreConfigrevision by id
  rpc DeleteByID(DeleteCoreConfigrevisionByIDRequest) returns (DeleteCoreConfigrevisionByIDReply) {
    option (google.api.http) = {
      delete: "/api/core/configrevisions/{id}"
    };
  }

  // Update a coreConfigrevision by id
  rpc UpdateByID(UpdateCoreConfigrevisionByIDRequest) returns (UpdateCoreConfigrevisionByIDReply) {
    option (google.api.http) = {
      put: "/api/core/configrevisions/{id}"
      body: "*"
    };
  }

  // Get a coreConfigrevision by id
  rpc GetByID(GetCoreConfigrevisionByIDRequest) returns (GetCoreConfigrevisionByIDReply) {
    option (google.api.http) = {
      get: "/api/core/configrevisions/{id}"
    };
  }

  // Get a paginated list of coreConfigrevision by custom conditions
  rpc List(ListCoreConfigrevisionRequest) returns (ListCoreConfigrevisionReply) {
    option (google.api.http) = {
      post: "/api/core/configrevisions/list"
      body: "*"
    };
  }

  // Batch delete coreConfigrevision by ids
  rpc DeleteByIDs(DeleteCoreConfigrevisionByIDsRequest) returns (DeleteCoreConfigrevisionByIDsReply) {
    option (google.api.http) = {
      post: "/api/core/configrevisions/delete/ids"
      body: "*"
    };
  }

  // Get a coreConfigrevision by custom condition
  rpc GetByCondition(GetCoreConfigrevisionByConditionRequest) returns (GetCoreConfigrevisionByConditionReply) {
    option (google.api.http) = {
      post: "/api/core/configrevisions/condition"
      body: "*"
    };
  }

  // Batch get coreConfigrevision by ids
  rpc ListByIDs(ListCoreConfigrevisionByIDsRequest) returns (ListCoreConfigrevisionByIDsReply) {
    option (google.api.http) = {
      post: "/api/core/configrevisions/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of coreConfigrevision by last id
  rpc ListByLastID(ListCoreConfigrevisionByLastIDRequest) returns (ListCoreConfigrevisionByLastIDReply) {
    option (google.api.http) = {
      get: "/api/core/configrevisions"
    };
  }
}


/*
Notes for defining message fields:
    1. Suggest using camel case style naming for message field names, such as firstName, lastName, etc.
    2. If the message field name ending in 'id', it is recommended to use xxxID naming format, such as userID, orderID, etc.
    3. Add validate rules https://github.com/envoyproxy/protoc-gen-validate#constraint-rules, such as:
        uint64 id = 1 [(validate.rules).uint64.gte  = 1];

If used to generate code that supports the HTTP protocol, notes for defining message fields:
    1. If the route contains the path parameter, such as /api/v1/coreConfigrevision/{id}, the defined
        message must contain the name of the path parameter and the name should be added
        with a new tag, such as int64 id = 1 [(tagger.tags) = "uri:\"id\""];
    2. If the request url is followed by a query parameter, such as /api/v1/getCoreConfigrevision?name=Tom,
        a form tag must be added when defining the query parameter in the message, such as:
        string name = 1 [(tagger.tags) = "form:\"name\""].
    3. When the message fields use snake_case naming (e.g., order_id), the generated swagger.json file
        will use camelCase (e.g., orderId) instead of the expected snake_case. This behavior aligns with
        the JSON tag names used by gRPC, but it can cause the Gin framework to fail to correctly bind and
        retrieve parameter values. There are two ways to resolve this issue:
            (1) Explicitly specify the JSON tag name using the json_name option, such as:
                 string order_id = 1 [json_name = "order_id"];
            (2) If you want to switch to camelCase naming and update the JSON tag name accordingly, such as:
                 string order_id = 1 [json_name = "orderID", (tagger.tags) = "json:\"orderID\""];
*/


message CreateCoreConfigrevisionRequest {
	string created = 1; 
	string comment = 2; 
	string data = 3; 
	bool active = 4; 
}

message CreateCoreConfigrevisionReply {
  uint64 id = 1;
}

message DeleteCoreConfigrevisionByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteCoreConfigrevisionByIDReply {

}

message UpdateCoreConfigrevisionByIDRequest {
	uint64 id = 1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	string created = 2; 
	string comment = 3; 
	string data = 4; 
	bool active = 5; 
}

message UpdateCoreConfigrevisionByIDReply {

}

message CoreConfigrevision {
	uint64 id = 1; 
	string created = 2; 
	string comment = 3; 
	string data = 4; 
	bool active = 5; 
}

message GetCoreConfigrevisionByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\"" ];
}

message GetCoreConfigrevisionByIDReply {
  CoreConfigrevision coreConfigrevision = 1;
}

message ListCoreConfigrevisionRequest {
  api.types.Params params = 1;
}

message ListCoreConfigrevisionReply {
  int64 total = 1;
  repeated CoreConfigrevision coreConfigrevisions = 2;
}

message DeleteCoreConfigrevisionByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteCoreConfigrevisionByIDsReply {

}

message GetCoreConfigrevisionByConditionRequest {
  types.Conditions conditions = 1;
}

message GetCoreConfigrevisionByConditionReply {
  CoreConfigrevision coreConfigrevision = 1;
}

message ListCoreConfigrevisionByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message ListCoreConfigrevisionByIDsReply {
  repeated CoreConfigrevision coreConfigrevisions = 1;
}

message ListCoreConfigrevisionByLastIDRequest {
  uint64 lastID = 1 [(tagger.tags) = "form:\"lastID\""]; // last id
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -id, the - sign indicates descending order.
}

message ListCoreConfigrevisionByLastIDReply {
  repeated CoreConfigrevision coreConfigrevisions = 1;
}


