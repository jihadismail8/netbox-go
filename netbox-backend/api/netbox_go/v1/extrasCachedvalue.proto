message CreateExtrasCachedvalueRequest {
	string timestamp = 1; 
	int64 objectID = 2; 
	string field = 3; 
	string type = 4; 
	string value = 5; 
	int32 weight = 6; 
	int32 objectTypeID = 7; 
}

message CreateExtrasCachedvalueReply {
  string id = 1;
}

message DeleteExtrasCachedvalueByIDRequest {
  string id = 1 [(validate.rules).string.min_len = 1, (tagger.tags) = "uri:\"id\""];
}

message DeleteExtrasCachedvalueByIDReply {

}

message UpdateExtrasCachedvalueByIDRequest {
	string id = 1 [(validate.rules).string.min_len = 1, (tagger.tags) = "uri:\"id\""]; 
	string timestamp = 2; 
	int64 objectID = 3; 
	string field = 4; 
	string type = 5; 
	string value = 6; 
	int32 weight = 7; 
	int32 objectTypeID = 8; 
}

message UpdateExtrasCachedvalueByIDReply {

}

message ExtrasCachedvalue {
	string id = 1; 
	string timestamp = 2; 
	int64 objectID = 3; 
	string field = 4; 
	string type = 5; 
	string value = 6; 
	int32 weight = 7; 
	int32 objectTypeID = 8; 
}

message GetExtrasCachedvalueByIDRequest {
  string id = 1 [(validate.rules).string.min_len = 1, (tagger.tags) = "uri:\"id\""];
}

message GetExtrasCachedvalueByIDReply {
  ExtrasCachedvalue extrasCachedvalue = 1;
}

message ListExtrasCachedvalueRequest {
  api.types.Params params = 1;
}

message ListExtrasCachedvalueReply {
  int64 total = 1;
  repeated ExtrasCachedvalue extrasCachedvalues = 2;
}

message DeleteExtrasCachedvalueByIDsRequest {
  repeated string ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteExtrasCachedvalueByIDsReply {

}

message GetExtrasCachedvalueByConditionRequest {
  types.Conditions conditions = 1;
}

message GetExtrasCachedvalueByConditionReply {
  ExtrasCachedvalue extrasCachedvalue = 1;
}

message ListExtrasCachedvalueByIDsRequest {
  repeated string ids = 1 [(validate.rules).repeated.min_items = 1];
}

message ListExtrasCachedvalueByIDsReply {
  repeated ExtrasCachedvalue extrasCachedvalues = 1;
}

message ListExtrasCachedvalueByLastIDRequest {
  string lastID = 1 [(tagger.tags) = "form:\"lastID\""];
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -id, the - sign indicates descending order.
}

message ListExtrasCachedvalueByLastIDReply {
  repeated ExtrasCachedvalue extrasCachedvalues = 1;
}


