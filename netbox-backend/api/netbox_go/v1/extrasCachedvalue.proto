syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user details by id",
      description: "Gets detailed information of a extrasCachedvalue specified by the given id in the path.",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service extrasCachedvalue {
  // Create a new extrasCachedvalue
  rpc Create(CreateExtrasCachedvalueRequest) returns (CreateExtrasCachedvalueReply) {
    option (google.api.http) = {
      post: "/api/extras/cachedvalues"
      body: "*"
    };
  }

  // Delete a extrasCachedvalue by id
  rpc DeleteByID(DeleteExtrasCachedvalueByIDRequest) returns (DeleteExtrasCachedvalueByIDReply) {
    option (google.api.http) = {
      delete: "/api/extras/cachedvalues/{id}"
    };
  }

  // Update a extrasCachedvalue by id
  rpc UpdateByID(UpdateExtrasCachedvalueByIDRequest) returns (UpdateExtrasCachedvalueByIDReply) {
    option (google.api.http) = {
      put: "/api/extras/cachedvalues/{id}"
      body: "*"
    };
  }

  // Get a extrasCachedvalue by id
  rpc GetByID(GetExtrasCachedvalueByIDRequest) returns (GetExtrasCachedvalueByIDReply) {
    option (google.api.http) = {
      get: "/api/extras/cachedvalues/{id}"
    };
  }

  // Get a paginated list of extrasCachedvalue by custom conditions
  rpc List(ListExtrasCachedvalueRequest) returns (ListExtrasCachedvalueReply) {
    option (google.api.http) = {
      post: "/api/extras/cachedvalues/list"
      body: "*"
    };
  }

  // Batch delete extrasCachedvalue by id
  rpc DeleteByIDs(DeleteExtrasCachedvalueByIDsRequest) returns (DeleteExtrasCachedvalueByIDsReply) {
    option (google.api.http) = {
      post: "/api/extras/cachedvalues/delete/ids"
      body: "*"
    };
  }

  // Get a extrasCachedvalue by custom conditions
  rpc GetByCondition(GetExtrasCachedvalueByConditionRequest) returns (GetExtrasCachedvalueByConditionReply) {
    option (google.api.http) = {
      post: "/api/extras/cachedvalues/condition"
      body: "*"
    };
  }

  // Batch get extrasCachedvalue by id
  rpc ListByIDs(ListExtrasCachedvalueByIDsRequest) returns (ListExtrasCachedvalueByIDsReply) {
    option (google.api.http) = {
      post: "/api/extras/cachedvalues/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of extrasCachedvalue by last id
  rpc ListByLastID(ListExtrasCachedvalueByLastIDRequest) returns (ListExtrasCachedvalueByLastIDReply) {
    option (google.api.http) = {
      get: "/api/extras/cachedvalues"
    };
  }
}


