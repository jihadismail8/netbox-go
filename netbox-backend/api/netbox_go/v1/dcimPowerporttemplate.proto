syntax = "proto3";

package api.netbox_go.v1;

import "api/types/types.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "tagger/tagger.proto";
import "validate/validate.proto";

option go_package = "netbox-go/api/netbox_go/v1;v1";

/*
Default settings for generating *.swagger.json documents. For reference, see: https://bit.ly/4dE5jj7
Tip: To enhance the generated Swagger documentation, you can add the openapiv2_operation option to your RPC method. For example:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "get user by id",
      description: "get user by id",
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
*/
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  host: "localhost:8080"
  base_path: ""
  info: {
    title: "netbox_go api docs";
    version: "v1.0.0";
  }
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerAuth";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "Type Bearer your-jwt-token to Value";
      }
    }
  }
};

service dcimPowerporttemplate {
  // Create a new dcimPowerporttemplate
  rpc Create(CreateDcimPowerporttemplateRequest) returns (CreateDcimPowerporttemplateReply) {
    option (google.api.http) = {
      post: "/api/dcim/powerporttemplates"
      body: "*"
    };
  }

  // Delete a dcimPowerporttemplate by id
  rpc DeleteByID(DeleteDcimPowerporttemplateByIDRequest) returns (DeleteDcimPowerporttemplateByIDReply) {
    option (google.api.http) = {
      delete: "/api/dcim/powerporttemplates/{id}"
    };
  }

  // Update a dcimPowerporttemplate by id
  rpc UpdateByID(UpdateDcimPowerporttemplateByIDRequest) returns (UpdateDcimPowerporttemplateByIDReply) {
    option (google.api.http) = {
      put: "/api/dcim/powerporttemplates/{id}"
      body: "*"
    };
  }

  // Get a dcimPowerporttemplate by id
  rpc GetByID(GetDcimPowerporttemplateByIDRequest) returns (GetDcimPowerporttemplateByIDReply) {
    option (google.api.http) = {
      get: "/api/dcim/powerporttemplates/{id}"
    };
  }

  // Get a paginated list of dcimPowerporttemplate by custom conditions
  rpc List(ListDcimPowerporttemplateRequest) returns (ListDcimPowerporttemplateReply) {
    option (google.api.http) = {
      post: "/api/dcim/powerporttemplates/list"
      body: "*"
    };
  }

  // Batch delete dcimPowerporttemplate by ids
  rpc DeleteByIDs(DeleteDcimPowerporttemplateByIDsRequest) returns (DeleteDcimPowerporttemplateByIDsReply) {
    option (google.api.http) = {
      post: "/api/dcim/powerporttemplates/delete/ids"
      body: "*"
    };
  }

  // Get a dcimPowerporttemplate by custom condition
  rpc GetByCondition(GetDcimPowerporttemplateByConditionRequest) returns (GetDcimPowerporttemplateByConditionReply) {
    option (google.api.http) = {
      post: "/api/dcim/powerporttemplates/condition"
      body: "*"
    };
  }

  // Batch get dcimPowerporttemplate by ids
  rpc ListByIDs(ListDcimPowerporttemplateByIDsRequest) returns (ListDcimPowerporttemplateByIDsReply) {
    option (google.api.http) = {
      post: "/api/dcim/powerporttemplates/list/ids"
      body: "*"
    };
  }

  // Get a paginated list of dcimPowerporttemplate by last id
  rpc ListByLastID(ListDcimPowerporttemplateByLastIDRequest) returns (ListDcimPowerporttemplateByLastIDReply) {
    option (google.api.http) = {
      get: "/api/dcim/powerporttemplates"
    };
  }
}


/*
Notes for defining message fields:
    1. Suggest using camel case style naming for message field names, such as firstName, lastName, etc.
    2. If the message field name ending in 'id', it is recommended to use xxxID naming format, such as userID, orderID, etc.
    3. Add validate rules https://github.com/envoyproxy/protoc-gen-validate#constraint-rules, such as:
        uint64 id = 1 [(validate.rules).uint64.gte  = 1];

If used to generate code that supports the HTTP protocol, notes for defining message fields:
    1. If the route contains the path parameter, such as /api/v1/dcimPowerporttemplate/{id}, the defined
        message must contain the name of the path parameter and the name should be added
        with a new tag, such as int64 id = 1 [(tagger.tags) = "uri:\"id\""];
    2. If the request url is followed by a query parameter, such as /api/v1/getDcimPowerporttemplate?name=Tom,
        a form tag must be added when defining the query parameter in the message, such as:
        string name = 1 [(tagger.tags) = "form:\"name\""].
    3. When the message fields use snake_case naming (e.g., order_id), the generated swagger.json file
