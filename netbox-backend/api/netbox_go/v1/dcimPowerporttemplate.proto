            (2) If you want to switch to camelCase naming and update the JSON tag name accordingly, such as:
                 string order_id = 1 [json_name = "orderID", (tagger.tags) = "json:\"orderID\""];
*/


message CreateDcimPowerporttemplateRequest {
	string created = 1; 
	string lastUpdated = 2; 
	string name = 3; 
	string label = 4; 
	string description = 5; 
	string type = 6; 
	int32 maximumDraw = 7; 
	int32 allocatedDraw = 8; 
	int64 deviceTypeID = 9; 
	int64 moduleTypeID = 10; 
}

message CreateDcimPowerporttemplateReply {
  uint64 id = 1;
}

message DeleteDcimPowerporttemplateByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""];
}

message DeleteDcimPowerporttemplateByIDReply {

}

message UpdateDcimPowerporttemplateByIDRequest {
	string created = 1; 
	string lastUpdated = 2; 
	uint64 id = 3 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\""]; 
	string name = 4; 
	string label = 5; 
	string description = 6; 
	string type = 7; 
	int32 maximumDraw = 8; 
	int32 allocatedDraw = 9; 
	int64 deviceTypeID = 10; 
	int64 moduleTypeID = 11; 
}

message UpdateDcimPowerporttemplateByIDReply {

}

message DcimPowerporttemplate {
	string created = 1; 
	string lastUpdated = 2; 
	uint64 id = 3; 
	string name = 4; 
	string label = 5; 
	string description = 6; 
	string type = 7; 
	int32 maximumDraw = 8; 
	int32 allocatedDraw = 9; 
	int64 deviceTypeID = 10; 
	int64 moduleTypeID = 11; 
}

message GetDcimPowerporttemplateByIDRequest {
  uint64 id =1 [(validate.rules).uint64.gt = 0, (tagger.tags) = "uri:\"id\"" ];
}

message GetDcimPowerporttemplateByIDReply {
  DcimPowerporttemplate dcimPowerporttemplate = 1;
}

message ListDcimPowerporttemplateRequest {
  api.types.Params params = 1;
}

message ListDcimPowerporttemplateReply {
  int64 total = 1;
  repeated DcimPowerporttemplate dcimPowerporttemplates = 2;
}

message DeleteDcimPowerporttemplateByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message DeleteDcimPowerporttemplateByIDsReply {

}

message GetDcimPowerporttemplateByConditionRequest {
  types.Conditions conditions = 1;
}

message GetDcimPowerporttemplateByConditionReply {
  DcimPowerporttemplate dcimPowerporttemplate = 1;
}

message ListDcimPowerporttemplateByIDsRequest {
  repeated uint64 ids = 1 [(validate.rules).repeated.min_items = 1];
}

message ListDcimPowerporttemplateByIDsReply {
  repeated DcimPowerporttemplate dcimPowerporttemplates = 1;
}

message ListDcimPowerporttemplateByLastIDRequest {
  uint64 lastID = 1 [(tagger.tags) = "form:\"lastID\""]; // last id
  uint32 limit = 2 [(validate.rules).uint32.gt = 0, (tagger.tags) = "form:\"limit\""]; // limit size per page
  string sort = 3 [(tagger.tags) = "form:\"sort\""]; // sort by column name of table, default is -id, the - sign indicates descending order.
}

message ListDcimPowerporttemplateByLastIDReply {
  repeated DcimPowerporttemplate dcimPowerporttemplates = 1;
}


